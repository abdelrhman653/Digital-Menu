<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --info: #1E90FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .total-badge { font-size: 12px; color: var(--gray); text-align: center; }
        .total-badge span { display: block; font-size: 16px; font-weight: 900; color: var(--white); }

        .tabs-row { display: flex; gap: 6px; margin-bottom: 15px; }
        .tab-btn {
            background: var(--dark-card); color: var(--gray); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; flex: 1; text-align: center;
        }
        .tab-btn.active { background: rgba(255, 165, 2, 0.15); color: var(--warning); border-color: var(--warning); }
        .tab-btn.active.delivered { background: rgba(46, 213, 115, 0.15); color: var(--secondary); border-color: var(--secondary); }
        .tab-btn.active.cancelled { background: rgba(255, 71, 87, 0.15); color: var(--primary); border-color: var(--primary); }

        .filter-box { background: var(--dark-card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-bottom: 15px; }
        .search-input { width: 100%; background: var(--dark-bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; color: var(--white); font-size: 12px; margin-bottom: 8px; }

        .order-card {
            background: var(--dark-card); border: 1px solid var(--border); border-radius: 16px; padding: 15px; margin-bottom: 15px;
        }
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .table-title { font-size: 14px; font-weight: 700; color: var(--primary); }
        .order-meta { font-size: 11px; color: var(--gray); }

        .customer-info { background: var(--dark-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
        .order-item-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px; }
        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
        .total-price { font-weight: 700; color: var(--secondary); font-size: 13px; }

        .status-actions { display: flex; gap: 5px; margin-top: 10px; }
        .status-btn { background: var(--dark-bg); color: var(--white); border: 1px solid var(--border); padding: 6px 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 10px; flex: 1; text-align: center; }
        .status-btn.active-status { background: var(--warning); color: #000; }
        .status-btn.ready-status { background: var(--info); color: #fff; }
        .status-btn.success-status { background: var(--secondary); color: #000; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> شاشة المطبخ</h1>
        <div id="headerRestaurantTitle">مطعمي</div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="total-badge">إجمالي الطلبات <span id="totalOrdersCount">0</span></div>
            <div class="total-badge" style="color: var(--warning);">النشطة <span id="activeCount">0</span></div>
            <div class="total-badge" style="color: var(--secondary);">تم التسليم <span id="deliveredCount">0</span></div>
            <div class="total-badge" style="color: var(--primary);">الملغاة <span id="cancelledCount">0</span></div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="tabActive" onclick="switchTab('active')">نشطة (<span id="tabActiveCount">0</span>)</button>
            <button class="tab-btn" id="tabDelivered" onclick="switchTab('delivered')">تم التسليم</button>
            <button class="tab-btn" id="tabCancelled" onclick="switchTab('cancelled')">تم الإلغاء</button>
        </div>

        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث برقم الطلب أو اسم العميل..." oninput="loadKitchenOrders()">
        </div>

        <div id="kitchenOrdersList"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        let currentTab = 'active';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
            let btn = document.getElementById(tab === 'active' ? 'tabActive' : (tab === 'delivered' ? 'tabDelivered' : 'tabCancelled'));
            btn.classList.add('active');
            if(tab === 'delivered') btn.classList.add('delivered');
            if(tab === 'cancelled') btn.classList.add('cancelled');
            loadKitchenOrders();
        }

        function loadKitchenOrders() {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let container = document.getElementById('kitchenOrdersList');
            
            document.getElementById('totalOrdersCount').innerText = orders.length;
            let activeList = orders.filter(o => o.status !== 'تم التسليم' && o.status !== 'ملغي');
            let deliveredList = orders.filter(o => o.status === 'تم التسليم');
            let cancelledList = orders.filter(o => o.status === 'ملغي');

            document.getElementById('activeCount').innerText = activeList.length;
            document.getElementById('deliveredCount').innerText = deliveredList.length;
            document.getElementById('cancelledCount').innerText = cancelledList.length;
            document.getElementById('tabActiveCount').innerText = activeList.length;

            let searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = orders.filter(o => {
                if (currentTab === 'active') return o.status !== 'تم التسليم' && o.status !== 'ملغي';
                if (currentTab === 'delivered') return o.status === 'تم التسليم';
                if (currentTab === 'cancelled') return o.status === 'ملغي';
            });

            if (searchVal) {
                filtered = filtered.filter(o => String(o.id).includes(searchVal) || (o.client && o.client.name.toLowerCase().includes(searchVal)));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 40px; font-size: 13px;">لا توجد طلبات في هذا القسم.</p>`;
                return;
            }

            let html = '';
            filtered.slice().reverse().forEach(order => {
                let itemsHtml = order.items.map(i => `<div class="order-item-row"><span>x ${i.qty} ${i.name}</span><span style="color: var(--secondary);">${i.price * i.qty} ج.م</span></div>`).join('');
                let isLocked = (order.status === 'تم التسليم' || order.status === 'ملغي');

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="table-title">طلب ${order.type} (${order.table})</div>
                            <div class="order-meta">${order.time} | #${order.id}</div>
                        </div>
                        <div class="customer-info">
                            <div><i class="fa-solid fa-user" style="color: var(--primary);"></i> ${order.client.name} (${order.client.phone})</div>
                            ${order.client.address ? `<div style="margin-top: 4px; color: var(--gray);"><i class="fa-solid fa-location-dot"></i> ${order.client.address}</div>` : ''}
                        </div>
                        <div>${itemsHtml}</div>
                        <div class="order-footer">
                            <div class="total-price">الإجمالي: ${order.total} ج.م</div>
                        </div>
                        <div class="status-actions">
                            <button class="status-btn ${order.status === 'قيد التحضير' ? 'active-status' : ''}" onclick="updateStatus(${order.id}, 'قيد التحضير')" ${isLocked ? 'disabled' : ''}>تحضير</button>
                            <button class="status-btn ${order.status === 'جاهز' ? 'ready-status' : ''}" onclick="updateStatus(${order.id}, 'جاهز')" ${isLocked ? 'disabled' : ''}>جاهز</button>
                            <button class="status-btn ${order.status === 'تم التسليم' ? 'success-status' : ''}" onclick="updateStatus(${order.id}, 'تم التسليم')" ${isLocked ? 'disabled' : ''}>تسليم</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function updateStatus(orderId, newStatus) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                loadKitchenOrders();
            }
        }

        setInterval(loadKitchenOrders, 2000);
        window.onload = loadKitchenOrders;
    </script>
        <div style="text-align: center; padding: 20px 0; background: var(--dark-card, #151B22); border-top: 1px solid var(--border, #30363D); margin-top: 40px; color: var(--gray, #8B949E); font-size: 13px; font-family: 'Cairo', sans-serif;">
    تم التطوير بواسطة <span style="color: var(--primary, #FF4757); font-weight: 700;">Abdelrhman Mohamed | Web Developer</span>
        </div>
</body>
</html>
