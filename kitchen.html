<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            text-align: center;
        }
        header h1 { font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        .stats-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            flex: 1;
            text-align: center;
        }
        .stat-card.active { border-color: var(--warning); background: rgba(255, 165, 2, 0.08); }
        .stat-number { font-size: 18px; font-weight: 900; color: var(--warning); }
        .stat-label { font-size: 11px; color: var(--gray); }

        .order-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .table-title { font-size: 15px; font-weight: 700; color: var(--primary); }
        .order-meta { font-size: 11px; color: var(--gray); display: flex; align-items: center; gap: 5px; }

        .customer-info {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 13px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .total-price { font-weight: 700; color: var(--secondary); font-size: 14px; }

        .status-actions {
            display: flex;
            gap: 6px;
        }
        .status-btn {
            background: var(--dark-bg);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 11px;
        }
        .status-btn.active-status {
            background: var(--warning);
            color: #000;
            border-color: var(--warning);
        }
        .status-btn.ready-status {
            background: var(--secondary);
            color: #000;
            border-color: var(--secondary);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> شاشة المطبخ وإدارة الطلبات</h1>
    </header>

    <div class="container">
        <!-- إحصائيات -->
        <div class="stats-bar">
            <div class="stat-card active">
                <div class="stat-number" id="activeOrdersCount">0</div>
                <div class="stat-label">الطلبات النشطة</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalOrdersCount">0</div>
                <div class="stat-label">إجمالي الطلبات</div>
            </div>
        </div>

        <!-- قائمة الطلبات -->
        <div id="kitchenOrdersList">
            <!-- الطلبات تحمل هنا -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';

        function loadKitchenOrders() {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let container = document.getElementById('kitchenOrdersList');
            
            document.getElementById('totalOrdersCount').innerText = orders.length;
            let activeOrders = orders.filter(o => o.status !== 'تم التسليم' && o.status !== 'ملغي');
            document.getElementById('activeOrdersCount').innerText = activeOrders.length;

            if (orders.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 40px; font-size: 13px;">لا توجد طلبات واردة حتى الآن.</p>`;
                return;
            }

            let html = '';
            orders.slice().reverse().forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item-row">
                            <span>x ${item.qty} ${item.name}</span>
                            <span style="color: var(--secondary);">${item.price * item.qty} ج.م</span>
                        </div>
                    `;
                });

                let clientName = order.client ? order.client.name : 'عميل';
                let clientPhone = order.client ? order.client.phone : '';

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="table-title">طلب ${order.type} (${order.table})</div>
                            <div class="order-meta"><i class="fa-regular fa-calendar"></i> ${order.date || '2026-07-28'} | <i class="fa-regular fa-clock"></i> ${order.time} | #${order.id}</div>
                        </div>
                        
                        <div class="customer-info">
                            <div><i class="fa-solid fa-user" style="color: var(--primary);"></i> ${clientName} (${clientPhone})</div>
                        </div>

                        <div>
                            ${itemsHtml}
                            <div style="font-size: 11px; color: var(--gray); margin-top: 6px;">الخدمة: ${order.serviceFee} ج.م</div>
                        </div>

                        <div class="order-footer">
                            <div class="total-price">الإجمالي: ${order.total} ج.م</div>
                            <div class="status-actions">
                                <button class="status-btn ${order.status === 'قيد التحضير' ? 'active-status' : ''}" onclick="updateStatus(${order.id}, 'قيد التحضير')">تحضير</button>
                                <button class="status-btn ${order.status === 'جاهز' ? 'ready-status' : ''}" onclick="updateStatus(${order.id}, 'جاهز')">جاهز</button>
                                <button class="status-btn" onclick="updateStatus(${order.id}, 'تم التسليم')" style="background: rgba(46,213,115,0.1); color: var(--secondary);">تسليم</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateStatus(orderId, newStatus) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                loadKitchenOrders();
            }
        }

        // تحديث تلقائي كل ثانيتين لتظهر الطلبات الجديدة فوراً
        setInterval(loadKitchenOrders, 2000);
        window.onload = loadKitchenOrders;
    </script>
</body>
</html>
