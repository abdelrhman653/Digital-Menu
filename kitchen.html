<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --info: #1E90FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .total-badge { font-size: 12px; color: var(--gray); text-align: center; }
        .total-badge span { display: block; font-size: 16px; font-weight: 900; color: var(--white); }

        .tabs-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .tab-btn.active {
            background: rgba(255, 165, 2, 0.15);
            color: var(--warning);
            border-color: var(--warning);
        }
        .tab-btn.active.delivered {
            background: rgba(46, 213, 115, 0.15);
            color: var(--secondary);
            border-color: var(--secondary);
        }
        .tab-btn.active.cancelled {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .filter-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--white);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
        }
        .filter-select {
            flex: 1;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            color: var(--white);
            font-size: 11px;
        }

        .order-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .table-title { font-size: 14px; font-weight: 700; color: var(--primary); }
        .order-meta { font-size: 11px; color: var(--gray); }

        .customer-info {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 12px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .total-price { font-weight: 700; color: var(--secondary); font-size: 13px; }

        .print-btn {
            background: rgba(30, 144, 255, 0.15);
            color: var(--info);
            border: 1px solid var(--info);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .status-btn {
            background: var(--dark-bg);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 10px;
            flex: 1;
            text-align: center;
        }
        .status-btn.active-status { background: var(--warning); color: #000; border-color: var(--warning); }
        .status-btn.ready-status { background: var(--info); color: #fff; border-color: var(--info); }
        .status-btn.delivery-status { background: #9b59b6; color: #fff; border-color: #9b59b6; }
        .status-btn.success-status { background: var(--secondary); color: #000; border-color: var(--secondary); }

        .disabled-card { opacity: 0.85; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> شاشة المطبخ</h1>
        <div id="headerRestaurantTitle">مطعمي</div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="total-badge">إجمالي الطلبات <span id="totalOrdersCount">0</span></div>
            <div class="total-badge" style="color: var(--warning);">النشطة <span id="activeCount">0</span></div>
            <div class="total-badge" style="color: var(--secondary);">تم التسليم <span id="deliveredCount">0</span></div>
            <div class="total-badge" style="color: var(--primary);">الملغاة <span id="cancelledCount">0</span></div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="tabActive" onclick="switchTab('active')"><i class="fa-solid fa-hourglass-half"></i> نشطة (<span id="tabActiveCount">0</span>)</button>
            <button class="tab-btn" id="tabDelivered" onclick="switchTab('delivered')"><i class="fa-solid fa-check"></i> تم التسليم</button>
            <button class="tab-btn" id="tabCancelled" onclick="switchTab('cancelled')"><i class="fa-solid fa-xmark"></i> تم الإلغاء</button>
        </div>

        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث برقم الطلب، اسم العميل، أو الطاولة..." oninput="loadKitchenOrders()">
            <div class="filter-row">
                <select id="dateFilter" class="filter-select" onchange="loadKitchenOrders()">
                    <option value="all">كل التواريخ</option>
                </select>
                <select id="timeFilter" class="filter-select" onchange="loadKitchenOrders()">
                    <option value="all">كل الأوقات</option>
                </select>
            </div>
        </div>

        <div id="kitchenOrdersList"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        let currentTab = 'active';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = 'tab-btn';
            });
            let btn = document.getElementById(tab === 'active' ? 'tabActive' : (tab === 'delivered' ? 'tabDelivered' : 'tabCancelled'));
            btn.classList.add('active');
            if(tab === 'delivered') btn.classList.add('delivered');
            if(tab === 'cancelled') btn.classList.add('cancelled');
            loadKitchenOrders();
        }

        function loadKitchenOrders() {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let container = document.getElementById('kitchenOrdersList');
            
            document.getElementById('totalOrdersCount').innerText = orders.length;
            let activeList = orders.filter(o => o.status !== 'تم التسليم' && o.status !== 'ملغي');
            let deliveredList = orders.filter(o => o.status === 'تم التسليم');
            let cancelledList = orders.filter(o => o.status === 'ملغي');

            document.getElementById('activeCount').innerText = activeList.length;
            document.getElementById('deliveredCount').innerText = deliveredList.length;
            document.getElementById('cancelledCount').innerText = cancelledList.length;
            document.getElementById('tabActiveCount').innerText = activeList.length;

            updateDateAndTimeFilters(orders);

            let searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            let dateVal = document.getElementById('dateFilter').value;
            let timeVal = document.getElementById('timeFilter').value;

            let filtered = orders.filter(o => {
                if (currentTab === 'active') return o.status !== 'تم التسليم' && o.status !== 'ملغي';
                if (currentTab === 'delivered') return o.status === 'تم التسليم';
                if (currentTab === 'cancelled') return o.status === 'ملغي';
            });

            if (searchVal) {
                filtered = filtered.filter(o => 
                    String(o.id).includes(searchVal) ||
                    (o.client && o.client.name.toLowerCase().includes(searchVal)) ||
                    String(o.table).toLowerCase().includes(searchVal)
                );
            }

            if (dateVal !== 'all') filtered = filtered.filter(o => o.date === dateVal);
            if (timeVal !== 'all') filtered = filtered.filter(o => o.time === timeVal);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 40px; font-size: 13px;">لا توجد طلبات في هذا القسم.</p>`;
                return;
            }

            let html = '';
            filtered.slice().reverse().forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item-row">
                            <span>x ${item.qty} ${item.name}</span>
                            <span style="color: var(--secondary);">${item.price * item.qty} ج.م</span>
                        </div>
                    `;
                });

                let clientName = order.client ? order.client.name : 'عميل';
                let clientPhone = order.client ? order.client.phone : '';
                let clientAddress = order.client ? order.client.address : '';

                let isLocked = (order.status === 'تم التسليم' || order.status === 'ملغي');

                html += `
                    <div class="order-card ${isLocked && order.status === 'ملغي' ? 'disabled-card' : ''}">
                        <div class="order-header">
                            <div class="table-title">طلب ${order.type} (${order.table})</div>
                            <div class="order-meta"><i class="fa-regular fa-calendar"></i> ${order.date} | <i class="fa-regular fa-clock"></i> ${order.time} | #${order.id}</div>
                        </div>
                        
                        <div class="customer-info">
                            <div><i class="fa-solid fa-user" style="color: var(--primary);"></i> ${clientName} (${clientPhone})</div>
                            ${clientAddress ? `<div style="margin-top: 4px; color: var(--gray);"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${clientAddress}</div>` : ''}
                        </div>

                        <div>
                            ${itemsHtml}
                            <div style="font-size: 11px; color: var(--gray); margin-top: 6px;">الخدمة / التوصيل: ${order.serviceFee} ج.م</div>
                        </div>

                        <div class="order-footer">
                            <div class="total-price">الإجمالي: ${order.total} ج.م</div>
                            <button class="print-btn" onclick="printReceipt(${order.id})"><i class="fa-solid fa-print"></i> طباعة الوصل</button>
                        </div>

                        <div class="status-actions">
                            <button class="status-btn ${order.status === 'قيد التحضير' ? 'active-status' : ''}" onclick="updateStatus(${order.id}, 'قيد التحضير')" ${isLocked ? 'disabled' : ''}>تحضير</button>
                            <button class="status-btn ${order.status === 'جاهز' ? 'ready-status' : ''}" onclick="updateStatus(${order.id}, 'جاهز')" ${isLocked ? 'disabled' : ''}>جاهز</button>
                            <button class="status-btn ${order.status === 'جاري التوصيل' ? 'delivery-status' : ''}" onclick="updateStatus(${order.id}, 'جاري التوصيل')" ${isLocked ? 'disabled' : ''}>دليفري</button>
                            <button class="status-btn ${order.status === 'تم التسليم' ? 'success-status' : ''}" onclick="updateStatus(${order.id}, 'تم التسليم')" ${isLocked ? 'disabled' : ''}>تسليم</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateDateAndTimeFilters(orders) {
            let dateSelect = document.getElementById('dateFilter');
            let timeSelect = document.getElementById('timeFilter');
            let currentSelectedDate = dateSelect.value;
            let currentSelectedTime = timeSelect.value;

            let dates = [...new Set(orders.map(o => o.date))];
            let times = [...new Set(orders.map(o => o.time))];

            let dateHtml = `<option value="all">كل التواريخ</option>`;
            dates.forEach(d => { dateHtml += `<option value="${d}">${d}</option>`; });
            dateSelect.innerHTML = dateHtml;
            dateSelect.value = currentSelectedDate;

            let timeHtml = `<option value="all">كل الأوقات</option>`;
            times.forEach(t => { timeHtml += `<option value="${t}">${t}</option>`; });
            timeSelect.innerHTML = timeHtml;
            timeSelect.value = currentSelectedTime;
        }

        function updateStatus(orderId, newStatus) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                loadKitchenOrders();
            }
        }

        function printReceipt(orderId) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (!order) return;

            let printContent = `
                <html dir="rtl">
                <head>
                    <title>إيصال طلب #${order.id}</title>
                    <style>
                        body { font-family: 'Cairo', sans-serif; padding: 15px; font-size: 12px; color: #000; }
                        h2 { text-align: center; margin-bottom: 5px; font-size: 16px; }
                        .info { margin-bottom: 10px; border-bottom: 1px dashed #000; padding-bottom: 8px; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
                        th, td { padding: 4px; text-align: right; border-bottom: 1px solid #ddd; }
                        .total { font-weight: bold; text-align: left; font-size: 14px; margin-top: 10px; }
                    </style>
                </head>
                <body>
                    <h2>${restaurant.toUpperCase()}</h2>
                    <div class="info">
                        رقم الطلب: #${order.id}<br>
                        التاريخ: ${order.date} - ${order.time}<br>
                        العميل: ${order.client.name} (${order.client.phone})<br>
                        العنوان: ${order.client.address || '-'}<br>
                        النوع: ${order.type} (${order.table})
                    </div>
                    <table>
                        <tr><th>الصنف</th><th>الكمية</th><th>السعر</th></tr>
                        ${order.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price * i.qty} ج.م</td></tr>`).join('')}
                    </table>
                    <div>خدمة التوصيل: ${order.serviceFee} ج.م</div>
                    <div class="total">الإجمالي النهائي: ${order.total} ج.م</div>
                </body>
                </html>
            `;

            let printWindow = window.open('', '_blank', 'height=600,width=400');
            if (printWindow) {
                printWindow.document.open();
                printWindow.document.write(printContent);
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => {
                    printWindow.print();
                    printWindow.close();
                }, 500);
            }
        }

        setInterval(loadKitchenOrders, 2000);
        window.onload = loadKitchenOrders;
    </script>
</body>
</html>
