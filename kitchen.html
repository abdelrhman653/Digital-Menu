<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - التحكم في حالات الطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #060911; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }

        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 80mm; padding: 10px; color: #000; background: #fff; font-family: monospace, sans-serif; }
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function KitchenApp() {
            const [orders, setOrders] = useState([]);
            const [audioAllowed, setAudioAllowed] = useState(false);
            const [printOrderData, setPrintOrderData] = useState(null);
            const prevOrdersCount = useRef(0);

            const playNotificationSound = () => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            };

            const loadOrders = () => {
                const savedOrders = localStorage.getItem('nexus_kitchen_orders');
                if (savedOrders) {
                    const parsed = JSON.parse(savedOrders);
                    setOrders(parsed);

                    if (parsed.length > prevOrdersCount.current && audioAllowed) {
                        playNotificationSound();
                    }
                    prevOrdersCount.current = parsed.length;
                }
            };

            useEffect(() => {
                loadOrders();
                const handleStorageChange = (e) => { if (e.key === 'nexus_kitchen_orders') loadOrders(); };
                window.addEventListener('storage', handleStorageChange);
                const interval = setInterval(loadOrders, 2000);
                return () => { window.removeEventListener('storage', handleStorageChange); clearInterval(interval); };
            }, [audioAllowed]);

            // تحديث حالة الطلب من قِبل المطبخ
            const updateOrderStatus = (orderId, newStatus) => {
                const updated = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
                setOrders(updated);
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updated));
            };

            // إزالة الطلب تماماً بعد الأرشفة أو الشغل الكامل
            const removeOrder = (orderId) => {
                const updated = orders.filter(o => o.id !== orderId);
                setOrders(updated);
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updated));
            };

            const handlePrint = (order) => {
                setPrintOrderData(order);
                setTimeout(() => window.print(), 300);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 space-y-6">
                    {/* Header */}
                    <header className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-amber-500/20 border border-amber-500/30 rounded-xl flex items-center justify-center text-amber-400 text-xl font-bold">
                                <i className="fa-solid fa-utensils"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-xl text-slate-100">لوحة تحكم المطبخ والطلبات</h1>
                                <p className="text-xs text-slate-400">التحكم في الـ 4 مراحل للتوصيل والتسليم مباشرة للعميل</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            {!audioAllowed ? (
                                <button onClick={() => { setAudioAllowed(true); playNotificationSound(); }} className="px-3 py-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-xl text-xs font-bold animate-pulse">
                                    🔔 تفعيل الصوت
                                </button>
                            ) : (
                                <span className="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-xl font-bold">
                                    🔔 التنبيه مفعل
                                </span>
                            )}
                        </div>
                    </header>

                    {/* قائمة الطلبات */}
                    {orders.length === 0 ? (
                        <div className="text-center py-20 glass-card rounded-2xl border border-slate-800 space-y-2">
                            <i className="fa-solid fa-square-check text-4xl text-slate-600"></i>
                            <h3 className="text-base font-bold text-slate-400">لا توجد طلبات جديدة حالياً</h3>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {orders.map((order) => {
                                const isOnline = !!order.customerInfo;
                                const status = order.status || 'pending';

                                return (
                                    <div key={order.id} className="glass-card rounded-2xl p-5 space-y-4 relative border border-slate-800">
                                        
                                        {/* نوع الطلب وتوقيته */}
                                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                            {isOnline ? (
                                                <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-xl font-black text-xs">🛵 أونلاين / دليفري</span>
                                            ) : (
                                                <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-xl font-black text-xs">📍 {order.tableNumber}</span>
                                            )}
                                            <span className="text-[11px] text-slate-400 font-mono">{order.time}</span>
                                        </div>

                                        {/* تفاصيل التوصيل للأونلاين */}
                                        {isOnline && (
                                            <div className="bg-slate-900/90 p-3 rounded-xl border border-emerald-500/20 text-xs space-y-1">
                                                <p className="font-bold text-emerald-300">👤 {order.customerInfo.name}</p>
                                                <p className="text-slate-300 font-mono">📞 {order.customerInfo.phone}</p>
                                                <p className="text-slate-400 text-[11px]">🏠 {order.customerInfo.address}</p>
                                            </div>
                                        )}

                                        {/* الأصناف */}
                                        <div className="space-y-1.5 max-h-[160px] overflow-y-auto">
                                            {order.items.map((item, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-slate-900/90 p-2 rounded-xl border border-slate-800">
                                                    <span className="font-bold text-xs text-slate-100">{item.name}</span>
                                                    <span className="bg-cyan-500/20 text-cyan-300 font-black text-xs px-2.5 py-0.5 rounded-lg">x{item.quantity}</span>
                                                </div>
                                            ))}
                                        </div>

                                        {/* أزرار تحكم المطبخ المنفصلة في المراحل الأربعة */}
                                        <div className="pt-2 border-t border-slate-800 space-y-2">
                                            <div className="flex justify-between items-center text-xs mb-1">
                                                <span className="text-slate-400">الإجمالي: <strong className="text-cyan-400">{order.totalPrice} ج.م</strong></span>
                                                <button onClick={() => handlePrint(order)} className="text-cyan-400 hover:underline text-[11px] font-bold">
                                                    <i className="fa-solid fa-print"></i> طباعة
                                                </button>
                                            </div>

                                            <div className="text-[11px] text-slate-400 font-bold mb-1">حالة الطلب الحالية:</div>
                                            
                                            <div className="grid grid-cols-2 gap-1.5">
                                                {/* 1. قيد التحضير */}
                                                <button 
                                                    onClick={() => updateOrderStatus(order.id, 'pending')}
                                                    className={`py-2 px-1 rounded-xl text-[11px] font-bold border transition-all ${
                                                        status === 'pending' 
                                                        ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg' 
                                                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    ⏳ 1. قيد التحضير
                                                </button>

                                                {/* 2. جاهز */}
                                                <button 
                                                    onClick={() => updateOrderStatus(order.id, 'ready')}
                                                    className={`py-2 px-1 rounded-xl text-[11px] font-bold border transition-all ${
                                                        status === 'ready' 
                                                        ? 'bg-cyan-500 text-slate-950 border-cyan-400 shadow-lg' 
                                                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    🍳 2. جاهز
                                                </button>

                                                {/* 3. خرج للتوصيل / للترابيزة */}
                                                <button 
                                                    onClick={() => updateOrderStatus(order.id, 'out_for_delivery')}
                                                    className={`py-2 px-1 rounded-xl text-[11px] font-bold border transition-all ${
                                                        status === 'out_for_delivery' 
                                                        ? 'bg-purple-500 text-white border-purple-400 shadow-lg' 
                                                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    🏃 3. خرج للتوصيل
                                                </button>

                                                {/* 4. تم التسليم */}
                                                <button 
                                                    onClick={() => updateOrderStatus(order.id, 'delivered')}
                                                    className={`py-2 px-1 rounded-xl text-[11px] font-bold border transition-all ${
                                                        status === 'delivered' 
                                                        ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow-lg' 
                                                        : 'bg-slate-900 text-slate-400 border-slate-800 hover:bg-slate-800'
                                                    }`}
                                                >
                                                    ✅ 4. تم التسليم
                                                </button>
                                            </div>

                                            <button 
                                                onClick={() => removeOrder(order.id)}
                                                className="w-full py-1.5 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/50 text-rose-300 font-bold rounded-xl text-[10px] transition-all mt-1"
                                            >
                                                مسح الطلب من الشاشة 🗑️
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* قالب الطباعة */}
                    {printOrderData && (
                        <div id="printable-receipt" className="hidden">
                            <div style={{ textAlign: 'center', borderBottom: '1px dashed #000', paddingBottom: '8px', marginBottom: '8px' }}>
                                <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0' }}>بون طلب - المطبخ</h2>
                                <p style={{ fontSize: '11px', margin: '2px 0' }}>{printOrderData.time}</p>
                                <h3 style={{ fontSize: '14px', fontWeight: 'bold', margin: '4px 0' }}>{printOrderData.tableNumber}</h3>
                            </div>
                            {printOrderData.customerInfo && (
                                <div style={{ borderBottom: '1px dashed #000', paddingBottom: '8px', marginBottom: '8px', fontSize: '11px' }}>
                                    <p><strong>الاسم:</strong> {printOrderData.customerInfo.name}</p>
                                    <p><strong>الهاتف:</strong> {printOrderData.customerInfo.phone}</p>
                                    <p><strong>العنوان:</strong> {printOrderData.customerInfo.address}</p>
                                </div>
                            )}
                            <div style={{ borderBottom: '1px dashed #000', paddingBottom: '8px', marginBottom: '8px' }}>
                                <table style={{ width: '100%', fontSize: '11px', textAlign: 'right' }}>
                                    <thead>
                                        <tr><th>الصنف</th><th>العدد</th><th>السعر</th></tr>
                                    </thead>
                                    <tbody>
                                        {printOrderData.items.map((item, idx) => (
                                            <tr key={idx}><td>{item.name}</td><td>x{item.quantity}</td><td>{item.price * item.quantity}</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            <div style={{ textAlign: 'left', fontSize: '12px', fontWeight: 'bold' }}>
                                <p>الإجمالي: {printOrderData.totalPrice} ج.م</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<KitchenApp />);
    </script>
</body>
</html>
