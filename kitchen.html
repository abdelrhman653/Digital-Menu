<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - إدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --secondary: #2ED573;
            --dark: #2F3542;
            --light: #F1F2F6;
            --white: #FFFFFF;
            --gray: #A4B0BE;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #F8F9FA; color: var(--dark); padding: 20px; }
        header {
            background: var(--dark);
            color: var(--white);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 30px;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--primary);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #E4E7EB;
            padding-bottom: 10px;
        }
        .order-items { list-style: none; margin-bottom: 15px; }
        .order-items li {
            padding: 8px 0;
            border-bottom: 1px dashed #E4E7EB;
            font-weight: 700;
        }
        .btn {
            background: var(--secondary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-fire-burner"></i> شاشة المطبخ الحية</h1>
    </header>

    <div class="container">
        <div class="orders-grid" id="kitchenOrdersGrid">
            <!-- Orders loaded dynamically -->
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantSlug = urlParams.get('restaurant');

        window.onload = function() {
            if(!restaurantSlug) {
                alert('رقم المطعم غير موجود!');
                return;
            }
            loadKitchenOrders();
            // Refresh every 5 seconds for live updates
            setInterval(loadKitchenOrders, 5000);
        }

        function loadKitchenOrders() {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurantSlug}`) || '[]');
            let grid = document.getElementById('kitchenOrdersGrid');
            grid.innerHTML = '';

            let pendingOrders = orders.filter(o => o.status === 'pending');

            if(pendingOrders.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:var(--gray); grid-column:1/-1;">لا توجد طلبات جديدة حالياً في المطبخ.</p>';
                return;
            }

            pendingOrders.forEach((order) => {
                let itemsHtml = '';
                order.items.forEach(i => {
                    itemsHtml += `<li><i class="fa-solid fa-utensils" style="color:var(--primary); margin-left:8px;"></i> ${i.name}</li>`;
                });

                grid.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span style="font-weight:900; font-size:18px;">ترابيزة: ${order.table}</span>
                            <span style="color:var(--gray); font-size:14px;">${order.time}</span>
                        </div>
                        <ul class="order-items">
                            ${itemsHtml}
                        </ul>
                        <button class="btn" onclick="completeOrder(${order.id})"><i class="fa-solid fa-check"></i> تم التجهيز</button>
                    </div>
                `;
            });
        }

        function completeOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurantSlug}`) || '[]');
            orders = orders.map(o => {
                if(o.id === orderId) o.status = 'completed';
                return o;
            });
            localStorage.setItem(`orders_${restaurantSlug}`, JSON.stringify(orders));
            loadKitchenOrders();
        }
    </script>
</body>
</html>
