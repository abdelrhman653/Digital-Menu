<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }

        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000 !important;
                background: #fff !important;
                padding: 10px;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DELIVERY_FEE = 40;
        const SERVICE_PERCENTAGE = 0.12;

        function KitchenApp() {
            const [orders, setOrders] = useState([]);
            const [activeTab, setActiveTab] = useState('active'); // 'active' | 'delivered' | 'cancelled'
            const [printOrder, setPrintOrder] = useState(null);

            // البحث والتصفية بالتاريخ والاسم
            const [searchQuery, setSearchQuery] = useState('');
            const [filterDate, setFilterDate] = useState('');

            const loadKitchenOrders = () => {
                const allOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                const fixedOrders = allOrders.map(o => {
                    if (!o.date) {
                        return { ...o, date: '2026-07-28', time: o.time || '12:00 ص' };
                    }
                    return o;
                });
                setOrders(fixedOrders);
            };

            useEffect(() => {
                loadKitchenOrders();
                const interval = setInterval(loadKitchenOrders, 1500);
                return () => clearInterval(interval);
            }, []);

            const updateOrderStatus = (orderId, newStatus) => {
                const updatedOrders = orders.map(o => {
                    if (o.id === orderId) {
                        return { ...o, status: newStatus };
                    }
                    return o;
                });
                setOrders(updatedOrders);
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updatedOrders));
            };

            const handlePrint = (order) => {
                setPrintOrder(order);
                setTimeout(() => {
                    window.print();
                }, 300);
            };

            const getStatusBadge = (status) => {
                switch(status) {
                    case 'pending': return <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-lg text-[11px] font-bold">⏳ قيد التحضير</span>;
                    case 'ready': return <span className="bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2 py-0.5 rounded-lg text-[11px] font-bold">🍳 جاهز</span>;
                    case 'out_for_delivery': return <span className="bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2 py-0.5 rounded-lg text-[11px] font-bold">🏃 للديليفري</span>;
                    case 'delivered': return <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-lg text-[11px] font-bold">✅ تم التسليم</span>;
                    case 'cancelled': return <span className="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-lg text-[11px] font-bold">❌ ملغي</span>;
                    default: return null;
                }
            };

            // تصفية الطلبات حسب الحالة العامة
            const activeOrders = orders.filter(o => o.status !== 'delivered' && o.status !== 'cancelled');
            const deliveredOrders = orders.filter(o => o.status === 'delivered');
            const cancelledOrders = orders.filter(o => o.status === 'cancelled');

            // تطبيق البحث والفلترة بالتاريخ
            const filterByQueryAndDate = (orderList) => {
                return orderList.filter(o => {
                    const matchesDate = filterDate ? o.date.includes(filterDate) : true;
                    const query = searchQuery.toLowerCase();
                    const matchesText = searchQuery === '' || 
                        String(o.id).includes(query) || 
                        (o.customerInfo && o.customerInfo.name.toLowerCase().includes(query)) ||
                        (o.customerInfo && o.customerInfo.phone.includes(query)) ||
                        o.tableNumber.toLowerCase().includes(query);

                    return matchesDate && matchesText;
                });
            };

            const displayedOrders = filterByQueryAndDate(
                activeTab === 'active' ? activeOrders :
                activeTab === 'delivered' ? deliveredOrders : cancelledOrders
            );

            return (
                <div className="max-w-4xl mx-auto min-h-screen bg-[#0b1320] flex flex-col p-4 shadow-2xl">
                    {/* Header */}
                    <header className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4 no-print">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-cyan-500/20 text-cyan-400 rounded-2xl flex items-center justify-center font-bold">
                                <i className="fa-solid fa-fire-burner"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-base text-slate-100">شاشة المطبخ وإدارة الطلبات 👨‍🍳</h1>
                                <p className="text-[10px] text-slate-400">تقسيم الطلبات والبحث بالأيام والشهور</p>
                            </div>
                        </div>
                        <span className="text-xs bg-slate-800 text-cyan-400 border border-slate-700 px-3 py-1.5 rounded-xl font-bold font-mono">
                            إجمالي الطلبات: {orders.length}
                        </span>
                    </header>

                    {/* أزرار التنقل بين الأقسام الثلاثة */}
                    <div className="grid grid-cols-3 gap-2 bg-slate-900 p-1.5 rounded-2xl border border-slate-800 mb-4 no-print">
                        <button 
                            onClick={() => setActiveTab('active')} 
                            className={`py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'active' ? 'bg-cyan-500 text-slate-950 shadow-lg font-black' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <span>⏳ نشطة</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] ${activeTab === 'active' ? 'bg-slate-950 text-cyan-400' : 'bg-slate-800 text-slate-300'}`}>
                                {activeOrders.length}
                            </span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('delivered')} 
                            className={`py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'delivered' ? 'bg-emerald-500 text-slate-950 shadow-lg font-black' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <span>✅ تم التسليم</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] ${activeTab === 'delivered' ? 'bg-slate-950 text-emerald-400' : 'bg-slate-800 text-slate-300'}`}>
                                {deliveredOrders.length}
                            </span>
                        </button>
                        
                        <button 
                            onClick={() => setActiveTab('cancelled')} 
                            className={`py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${activeTab === 'cancelled' ? 'bg-rose-500 text-white shadow-lg font-black' : 'text-slate-400 hover:text-slate-200'}`}
                        >
                            <span>❌ تم الإلغاء</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] ${activeTab === 'cancelled' ? 'bg-slate-950 text-rose-400' : 'bg-slate-800 text-slate-300'}`}>
                                {cancelledOrders.length}
                            </span>
                        </button>
                    </div>

                    {/* أدوات البحث والتصفية بالتاريخ */}
                    <div className="glass-card p-3 rounded-2xl mb-4 grid grid-cols-1 sm:grid-cols-2 gap-2.5 no-print">
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-500 text-xs"></i>
                            <input 
                                type="text" 
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="بحث برقم الطلب، اسم العميل، أو الطاولة..."
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 pr-8 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                            />
                        </div>

                        <div className="flex items-center gap-2">
                            <div className="relative flex-1">
                                <i className="fa-solid fa-calendar-days absolute right-3 top-3 text-slate-500 text-xs"></i>
                                <input 
                                    type="text" 
                                    value={filterDate}
                                    onChange={(e) => setFilterDate(e.target.value)}
                                    placeholder="بحث بالتاريخ (مثال: 2026-07 أو 2026-07-28)"
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 pr-8 text-xs text-slate-100 focus:outline-none focus:border-cyan-500 font-mono"
                                />
                            </div>
                            {filterDate && (
                                <button 
                                    onClick={() => setFilterDate('')}
                                    className="px-3 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold whitespace-nowrap"
                                >
                                    مسح الفلتر
                                </button>
                            )}
                        </div>
                    </div>

                    {/* عرض قائمة الطلبات */}
                    {displayedOrders.length === 0 ? (
                        <div className="text-center py-20 glass-card rounded-2xl p-6 space-y-3 no-print">
                            <i className={`fa-solid ${activeTab === 'active' ? 'fa-utensils text-slate-600' : activeTab === 'delivered' ? 'fa-circle-check text-emerald-600' : 'fa-ban text-rose-600'} text-4xl`}></i>
                            <h3 className="font-bold text-slate-300 text-sm">
                                {activeTab === 'active' ? 'لا توجد طلبات جارية حالياً' : activeTab === 'delivered' ? 'لا توجد طلبات مسلّمة تطابق البحث' : 'لا توجد طلبات ملغاة تطابق البحث'}
                            </h3>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 no-print">
                            {displayedOrders.map((order) => {
                                const isCompleted = order.status === 'delivered' || order.status === 'cancelled';
                                const isDelivery = !!order.customerInfo;
                                
                                const subtotal = order.subtotal || order.totalPrice;
                                const extraFee = order.extraFee !== undefined ? order.extraFee : (isDelivery ? DELIVERY_FEE : Math.round(subtotal * SERVICE_PERCENTAGE));
                                const finalTotal = order.totalPrice || (subtotal + extraFee);

                                return (
                                    <div key={order.id} className={`glass-card rounded-2xl p-4 space-y-3 border ${order.status === 'cancelled' ? 'border-rose-500/40 opacity-80' : order.status === 'delivered' ? 'border-emerald-500/30' : 'border-slate-800/80'}`}>
                                        
                                        {order.status === 'cancelled' && (
                                            <div className="bg-rose-500/20 border border-rose-500/40 text-rose-300 text-center py-1.5 rounded-xl font-bold text-xs">
                                                ❌ تم إلغاء هذا الطلب
                                            </div>
                                        )}

                                        <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
                                            <div>
                                                <span className="text-xs font-black text-pink-400 block">{order.tableNumber}</span>
                                                <span className="text-[10px] text-slate-400 font-mono">
                                                    📅 {order.date || '2026-07-28'} | ⏰ {order.time} | #{String(order.id).slice(-6)}
                                                </span>
                                            </div>
                                            {getStatusBadge(order.status)}
                                        </div>

                                        {isDelivery && (
                                            <div className="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-xs space-y-1">
                                                <p className="text-slate-200 font-bold">👤 {order.customerInfo.name}</p>
                                                <p className="text-slate-400 font-mono">📞 {order.customerInfo.phone}</p>
                                                <p className="text-slate-400">📍 {order.customerInfo.address}</p>
                                            </div>
                                        )}

                                        <div className="space-y-1.5 bg-slate-950/40 p-2.5 rounded-xl">
                                            {order.items.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center text-xs">
                                                    <span className="text-slate-200 font-semibold">{item.name}</span>
                                                    <span className="text-pink-400 font-bold font-mono">x {item.quantity}</span>
                                                </div>
                                            ))}
                                            <div className="flex justify-between items-center text-xs pt-1.5 border-t border-slate-800/60 text-amber-400 font-medium">
                                                <span>{isDelivery ? '🚴 خدمة توصيل' : '🍽️ خدمة صالة (12%)'}</span>
                                                <span className="font-bold font-mono">{extraFee} ج.م</span>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between pt-1">
                                            <div>
                                                <span className="text-xs font-black text-cyan-400 block">الإجمالي الكلي: {finalTotal} ج.م</span>
                                                <span className="text-[9px] text-slate-400">(شامل {isDelivery ? 'التوصيل' : 'الخدمة'})</span>
                                            </div>
                                            
                                            <button 
                                                onClick={() => handlePrint(order)}
                                                className="px-3 py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-300 text-xs font-bold rounded-xl flex items-center gap-1.5 transition-all"
                                            >
                                                <i className="fa-solid fa-print"></i> طباعة الوصل
                                            </button>
                                        </div>

                                        {isCompleted ? (
                                            <div className="bg-slate-900/50 border border-slate-800 text-center py-2 rounded-xl text-[11px] font-bold text-slate-400">
                                                🔒 اكتمل الطلب وحالته نهائية (مقفول)
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-4 gap-1 pt-2 border-t border-slate-800/80">
                                                <button onClick={() => updateOrderStatus(order.id, 'pending')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${order.status === 'pending' ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>تحضير</button>
                                                <button onClick={() => updateOrderStatus(order.id, 'ready')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${order.status === 'ready' ? 'bg-cyan-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>جاهز 🍳</button>
                                                <button onClick={() => updateOrderStatus(order.id, 'out_for_delivery')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${order.status === 'out_for_delivery' ? 'bg-purple-500 text-white font-black' : 'bg-slate-800 text-slate-400'}`}>للديليفري 🏃</button>
                                                <button onClick={() => updateOrderStatus(order.id, 'delivered')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${order.status === 'delivered' ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-400'}`}>تسليم ✅</button>
                                            </div>
                                        )}

                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* قالب الطباعة للوصل */}
                    {printOrder && (() => {
                        const isDelivery = !!printOrder.customerInfo;
                        const subtotal = printOrder.subtotal || printOrder.totalPrice;
                        const extraFee = printOrder.extraFee !== undefined ? printOrder.extraFee : (isDelivery ? DELIVERY_FEE : Math.round(subtotal * SERVICE_PERCENTAGE));
                        const grandTotal = printOrder.totalPrice || (subtotal + extraFee);

                        return (
                            <div id="printable-receipt" className="hidden print:block font-sans">
                                <div className="text-center border-b pb-2 mb-2">
                                    <h2 className="text-xl font-bold">Abdo Shop 🍔</h2>
                                    <p className="text-xs">{isDelivery ? 'وصل توصيل (ديليفري)' : 'وصل طلب صالة'}</p>
                                    <p className="text-xs font-mono mt-1">التاريخ: {printOrder.date} | الوقت: {printOrder.time}</p>
                                </div>

                                {isDelivery ? (
                                    <div className="border-b pb-2 mb-2 text-xs space-y-1">
                                        <p><strong>العميل:</strong> {printOrder.customerInfo.name}</p>
                                        <p><strong>التليفون:</strong> {printOrder.customerInfo.phone}</p>
                                        <p><strong>العنوان:</strong> {printOrder.customerInfo.address}</p>
                                    </div>
                                ) : (
                                    <div className="border-b pb-2 mb-2 text-xs">
                                        <p><strong>الطاولة:</strong> {printOrder.tableNumber}</p>
                                    </div>
                                )}

                                <table className="w-full text-right text-xs border-b pb-2 mb-2">
                                    <thead>
                                        <tr className="border-b">
                                            <th className="py-1">الصنف</th>
                                            <th className="py-1 text-center">العدد</th>
                                            <th className="py-1 text-left">السعر</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {printOrder.items.map((item, idx) => (
                                            <tr key={idx}>
                                                <td className="py-1">{item.name}</td>
                                                <td className="py-1 text-center">{item.quantity}</td>
                                                <td className="py-1 text-left">{item.price * item.quantity} ج.م</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>

                                <div className="text-xs space-y-1 border-b pb-2 mb-2">
                                    <div className="flex justify-between">
                                        <span>مجموع الأصناف:</span>
                                        <span>{subtotal} ج.م</span>
                                    </div>
                                    <div className="flex justify-between font-bold">
                                        <span>{isDelivery ? 'رسوم التوصيل:' : 'خدمة صالة (12%):'}</span>
                                        <span>{extraFee} ج.م</span>
                                    </div>
                                </div>

                                <div className="flex justify-between font-black text-sm mb-4">
                                    <span>الإجمالي الكلي:</span>
                                    <span>{grandTotal} ج.م</span>
                                </div>

                                <div className="text-center text-[10px] border-t pt-2">
                                    شكراً لطلبكم من Abdo Shop! نتمنى لكم وجبة شهية ❤️
                                </div>
                            </div>
                        );
                    })()}

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<KitchenApp />);
    </script>
</body>
</html>
