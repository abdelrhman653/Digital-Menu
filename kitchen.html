<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
      import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDkDKnpfuxVuRH4g9FwlMBZWCaH3NAfFSs",
        authDomain: "digital-menu-8d2b4.firebaseapp.com",
        projectId: "digital-menu-8d2b4",
        storageBucket: "digital-menu-8d2b4.firebasestorage.app",
        messagingSenderId: "436566477044",
        appId: "1:436566477044:web:2a86cfb212b44229f0b6a1"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.db = db;
      window.firestoreModules = { collection, onSnapshot, doc, updateDoc };

      window.dispatchEvent(new Event('firebase-loaded-kitchen'));
    </script>

    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --info: #1E90FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
        header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .total-badge { font-size: 12px; color: var(--gray); text-align: center; }
        .total-badge span { display: block; font-size: 16px; font-weight: 900; color: var(--white); }

        .tabs-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .tab-btn.active {
            background: rgba(255, 165, 2, 0.15);
            color: var(--warning);
            border-color: var(--warning);
        }
        .tab-btn.active.delivered {
            background: rgba(46, 213, 115, 0.15);
            color: var(--secondary);
            border-color: var(--secondary);
        }
        .tab-btn.active.cancelled {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .filter-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--white);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
        }
        .filter-select {
            flex: 1;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            color: var(--white);
            font-size: 11px;
        }

        .order-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .table-title { font-size: 14px; font-weight: 700; color: var(--primary); }
        .order-meta { font-size: 11px; color: var(--gray); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

        .time-badge {
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
        }
        .time-fresh { background: rgba(46, 213, 115, 0.2); color: var(--secondary); }
        .time-warning { background: rgba(255, 165, 2, 0.2); color: var(--warning); }
        .time-danger { background: rgba(255, 71, 87, 0.2); color: var(--primary); }

        .customer-info {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 12px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .total-price { font-weight: 700; color: var(--secondary); font-size: 13px; }

        .print-btn {
            background: rgba(30, 144, 255, 0.15);
            color: var(--info);
            border: 1px solid var(--info);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .status-btn {
            background: var(--dark-bg);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 10px;
            flex: 1;
            text-align: center;
            transition: all 0.2s;
        }
        .status-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-btn.active-current { background: var(--warning); color: #000; border-color: var(--warning); box-shadow: 0 0 10px rgba(255, 165, 2, 0.4); }
        .status-btn.ready-current { background: var(--info); color: #fff; border-color: var(--info); box-shadow: 0 0 10px rgba(30, 144, 255, 0.4); }
        .status-btn.delivery-current { background: #9b59b6; color: #fff; border-color: #9b59b6; box-shadow: 0 0 10px rgba(155, 89, 182, 0.4); }
        .status-btn.success-current { background: var(--secondary); color: #000; border-color: var(--secondary); box-shadow: 0 0 10px rgba(46, 213, 115, 0.4); }
        .status-btn.cancel-current { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); }

        .empty-state { color: var(--gray); text-align: center; padding: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <audio id="orderAlertSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="header-brand">
            <img id="headerLogoImg" class="header-logo" src="" alt="الشعار">
            <h1><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> <span data-i18n="kitchen_title">شاشة المطبخ</span></h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="langSelectKitchen" onchange="changeLanguage(this.value)" style="width: 100px; padding: 4px; font-size: 11px; background: var(--dark-bg); color: #fff; border: 1px solid var(--border); border-radius: 6px;">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇺🇸</option>
            </select>
            <div id="headerRestaurantTitle">مطعمي</div>
        </div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="total-badge"><span data-i18n="total_orders">إجمالي الطلبات</span> <span id="totalOrdersCount">0</span></div>
            <div class="total-badge" style="color: var(--warning);"><span data-i18n="active_orders">النشطة</span> <span id="activeCount">0</span></div>
            <div class="total-badge" style="color: var(--secondary);"><span data-i18n="delivered_orders">تم التسليم</span> <span id="deliveredCount">0</span></div>
            <div class="total-badge" style="color: var(--primary);"><span data-i18n="cancelled_orders">الملغاة</span> <span id="cancelledCount">0</span></div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="tabActive" onclick="switchTab('active')"><i class="fa-solid fa-hourglass-half"></i> <span data-i18n="tab_active">نشطة</span> (<span id="tabActiveCount">0</span>)</button>
            <button class="tab-btn" id="tabDelivered" onclick="switchTab('delivered')"><i class="fa-solid fa-check"></i> <span data-i18n="tab_delivered">تم التسليم</span></button>
            <button class="tab-btn" id="tabCancelled" onclick="switchTab('cancelled')"><i class="fa-solid fa-xmark"></i> <span data-i18n="tab_cancelled">تم الإلغاء</span></button>
        </div>

        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث برقم الطلب، اسم العميل، رقم الطاولة، أو الهاتف..." oninput="handleSearchInput()">
            <div class="filter-row">
                <select id="dateFilter" class="filter-select" onchange="renderKitchenOrders()">
                    <option value="all" data-i18n="all_dates">كل التواريخ</option>
                </select>
                <select id="timeFilter" class="filter-select" onchange="renderKitchenOrders()">
                    <option value="all" data-i18n="all_times">كل الأوقات</option>
                </select>
            </div>
        </div>

        <div id="kitchenOrdersList"></div>
    </div>

    <script>
        let currentLang = localStorage.getItem('app_lang') || 'ar';
        const translations = {
            ar: {
                kitchen_title: "شاشة المطبخ",
                total_orders: "إجمالي الطلبات",
                active_orders: "النشطة",
                delivered_orders: "تم التسليم",
                cancelled_orders: "الملغاة",
                tab_active: "نشطة",
                tab_delivered: "تم التسليم",
                tab_cancelled: "تم الإلغاء",
                all_dates: "كل التواريخ",
                all_times: "كل الأوقات",
                search_placeholder: "بحث برقم الطلب، اسم العميل، الطاولة، أو الهاتف...",
                print_receipt: "طباعة الوصل",
                status_prep: "تحضير",
                status_ready: "جاهز",
                status_delivery: "دليفري",
                status_success: "تسليم",
                status_cancel: "إلغاء",
                subtotal: "المجموع الفرعي",
                total_final: "الإجمالي النهائي",
                no_orders: "لا توجد طلبات في هذا القسم.",
                currency: "ج.م"
            },
            en: {
                kitchen_title: "Kitchen Display",
                total_orders: "Total Orders",
                active_orders: "Active",
                delivered_orders: "Delivered",
                cancelled_orders: "Cancelled",
                tab_active: "Active",
                tab_delivered: "Delivered",
                tab_cancelled: "Cancelled",
                all_dates: "All Dates",
                all_times: "All Times",
                search_placeholder: "Search order #, client name, table, phone...",
                print_receipt: "Print Receipt",
                status_prep: "Prep",
                status_ready: "Ready",
                status_delivery: "Delivery",
                status_success: "Deliver",
                status_cancel: "Cancel",
                subtotal: "Subtotal",
                total_final: "Final Total",
                no_orders: "No orders in this section.",
                currency: "EGP"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        let restData = {};
        let currentTab = 'active';
        let globalOrdersMap = new Map();
        let isInitialSnapshot = true;
        let originalTitle = document.title;
        let isBlinking = false;
        let blinkInterval = null;
        let searchDebounceTimer = null;
        let isFirestoreInitialized = false;

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        window.addEventListener('firebase-loaded-kitchen', async () => {
            try {
                const restDocRef = window.firestoreModules.doc(window.db, "restaurants", restaurant);
                // استخدام getDoc لجلب إعدادات المطعم
                const { getDoc, doc } = await import("https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js");
                const restSnap = await getDoc(restDocRef);
                if (restSnap.exists()) {
                    restData = restSnap.data();
                    if (restData.primaryColor) {
                        document.documentElement.style.setProperty('--primary', restData.primaryColor);
                    }
                    if (restData.logo) {
                        let logoImg = document.getElementById('headerLogoImg');
                        logoImg.src = restData.logo;
                        logoImg.style.display = 'block';
                    }
                }
            } catch(e) { console.error(e); }

            initFirestoreListener();
        });

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelectKitchen').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                let key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            document.getElementById('searchInput').placeholder = translations[lang].search_placeholder;
            updateStatsAndFilters();
            renderKitchenOrders();
        }

        function playOrderSound() {
            let sound = document.getElementById('orderAlertSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked by browser policy"));
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn');
            let btn = document.getElementById(tab === 'active' ? 'tabActive' : (tab === 'delivered' ? 'tabDelivered' : 'tabCancelled'));
            if (btn) {
                btn.classList.add('active');
                if (tab === 'delivered') btn.classList.add('delivered');
                if (tab === 'cancelled') btn.classList.add('cancelled');
            }
            renderKitchenOrders();
        }

        function handleSearchInput() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                renderKitchenOrders();
            }, 200);
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return { text: currentLang === 'ar' ? 'منذ لحظات' : 'Just now', class: 'time-fresh' };
            let diffSec = Math.floor((Date.now() - timestamp) / 1000);
            if (diffSec < 60) return { text: currentLang === 'ar' ? 'منذ لحظات' : 'Just now', class: 'time-fresh' };
            let diffMin = Math.floor(diffSec / 60);
            if (diffMin < 60) {
                let text = currentLang === 'ar' ? `منذ ${diffMin} دقيقة` : `${diffMin}m ago`;
                let cls = diffMin > 20 ? 'time-danger' : (diffMin > 10 ? 'time-warning' : 'time-fresh');
                return { text, class: cls };
            }
            let diffHour = Math.floor(diffMin / 60);
            let text = currentLang === 'ar' ? `منذ ${diffHour} ساعة` : `${diffHour}h ago`;
            return { text, class: 'time-danger' };
        }

        function updateStatsAndFilters() {
            let orders = Array.from(globalOrdersMap.values());

            let activeList = orders.filter(o => {
                let st = o.status || '';
                return st !== 'تم التسليم' && st !== 'ملغي' && st !== 'Delivered' && st !== 'Cancelled';
            });
            let deliveredList = orders.filter(o => o.status === 'تم التسليم' || o.status === 'Delivered');
            let cancelledList = orders.filter(o => o.status === 'ملغي' || o.status === 'Cancelled');

            document.getElementById('totalOrdersCount').innerText = orders.length;
            document.getElementById('activeCount').innerText = activeList.length;
            document.getElementById('deliveredCount').innerText = deliveredList.length;
            document.getElementById('cancelledCount').innerText = cancelledList.length;
            document.getElementById('tabActiveCount').innerText = activeList.length;

            updateDateAndTimeFilters(orders);
        }

        function generateOrderCardHTML(order) {
            let itemsHtml = '';
            if (order.items && Array.isArray(order.items)) {
                order.items.forEach(item => {
                    let q = item.qty || item.quantity || 1;
                    let p = item.price || 0;
                    itemsHtml += `
                        <div class="order-item-row">
                            <span>x ${q} ${escapeHTML(item.name || '')}</span>
                            <span style="color: var(--secondary);">${p * q} ${translations[currentLang].currency}</span>
                        </div>
                    `;
                });
            }

            let clientName = order.client ? order.client.name : (currentLang === 'ar' ? 'عميل' : 'Client');
            let clientPhone = order.client ? order.client.phone : '';
            let clientAddress = order.client ? order.client.address : '';

            let st = order.status || '';
            let isLocked = (st === 'تم التسليم' || st === 'ملغي' || st === 'Delivered' || st === 'Cancelled');
            let serviceText = (order.type === 'صالة' || order.type === 'Dine-In') ? 
                `${currentLang === 'ar' ? 'خدمة صالة' : 'Dine-In Fee'}: ${order.serviceFee || order.fees || 0} ${translations[currentLang].currency}` : 
                `${currentLang === 'ar' ? 'توصيل' : 'Delivery'}: ${order.serviceFee || order.fees || 0} ${translations[currentLang].currency}`;

            let timeInfo = getTimeAgo(order.timestamp || (order.createdAt ? new Date(order.createdAt).getTime() : null));

            let btnPrepClass = (st === 'قيد التحضير' || st === 'Prep') ? 'status-btn active-current' : 'status-btn';
            let btnReadyClass = (st === 'جاهز' || st === 'Ready') ? 'status-btn ready-current' : 'status-btn';
            let btnDeliveryClass = (st === 'جاري التوصيل' || st === 'Delivery') ? 'status-btn delivery-current' : 'status-btn';
            let btnSuccessClass = (st === 'تم التسليم' || st === 'Delivered') ? 'status-btn success-current' : 'status-btn';
            let btnCancelClass = (st === 'ملغي' || st === 'Cancelled') ? 'status-btn cancel-current' : 'status-btn';

            let shortId = escapeHTML(String(order.id || order.docId || '').slice(-4));

            return `
                <div class="order-card" data-docid="${order.docId}">
                    <div class="order-header">
                        <div class="table-title">${currentLang === 'ar' ? 'طلب' : 'Order'} ${escapeHTML(order.type || '')} (${escapeHTML(order.table || '-')})</div>
                        <div class="order-meta">
                            <span class="time-badge ${timeInfo.class}">${timeInfo.text}</span>
                            <span><i class="fa-regular fa-calendar"></i> ${escapeHTML(order.date || '')}</span>
                            <span><i class="fa-regular fa-clock"></i> ${escapeHTML(order.time || '')}</span>
                            <span>#${shortId}</span>
                        </div>
                    </div>
                    
                    <div class="customer-info">
                        <div><i class="fa-solid fa-user" style="color: var(--primary);"></i> ${escapeHTML(clientName)} (${escapeHTML(clientPhone)})</div>
                        ${clientAddress ? `<div style="margin-top: 4px; color: var(--gray);"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${escapeHTML(clientAddress)}</div>` : ''}
                    </div>

                    <div>
                        ${itemsHtml}
                        <div style="font-size: 11px; color: var(--gray); margin-top: 6px;">${serviceText}</div>
                    </div>

                    <div class="order-footer">
                        <div class="total-price">${translations[currentLang].total_final}: ${order.total || 0} ${translations[currentLang].currency}</div>
                        <button class="print-btn" onclick="printReceipt('${order.docId}')"><i class="fa-solid fa-print"></i> ${translations[currentLang].print_receipt}</button>
                    </div>

                    <div class="status-actions">
                        <button class="${btnPrepClass}" onclick="updateStatus('${order.docId}', 'قيد التحضير')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_prep}</button>
                        <button class="${btnReadyClass}" onclick="updateStatus('${order.docId}', 'جاهز')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_ready}</button>
                        <button class="${btnDeliveryClass}" onclick="updateStatus('${order.docId}', 'جاري التوصيل')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_delivery}</button>
                        <button class="${btnSuccessClass}" onclick="updateStatus('${order.docId}', 'تم التسليم')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_success}</button>
                        <button class="${btnCancelClass}" onclick="updateStatus('${order.docId}', 'ملغي')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_cancel}</button>
                    </div>
                </div>
            `;
        }

        function renderKitchenOrders() {
            const container = document.getElementById('kitchenOrdersList');
            if (!container) return;

            let orders = Array.from(globalOrdersMap.values());
            
            let searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            let dateVal = document.getElementById('dateFilter').value;
            let timeVal = document.getElementById('timeFilter').value;

            let filtered = orders.filter(o => {
                let st = o.status || '';
                let isDel = (st === 'تم التسليم' || st === 'Delivered');
                let isCan = (st === 'ملغي' || st === 'Cancelled');
                if (currentTab === 'active') return !isDel && !isCan;
                if (currentTab === 'delivered') return isDel;
                if (currentTab === 'cancelled') return isCan;
                return true;
            });

            if (searchVal) {
                filtered = filtered.filter(o => 
                    String(o.id || '').toLowerCase().includes(searchVal) ||
                    String(o.docId || '').toLowerCase().includes(searchVal) ||
                    (o.client && String(o.client.name || '').toLowerCase().includes(searchVal)) ||
                    String(o.table || '').toLowerCase().includes(searchVal) ||
                    (o.client && String(o.client.phone || '').includes(searchVal))
                );
            }

            if (dateVal !== 'all') filtered = filtered.filter(o => o.date === dateVal);
            if (timeVal !== 'all') filtered = filtered.filter(o => o.time === timeVal);

            filtered.sort((a, b) => {
                let timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                let timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                return timeB - timeA; // الأحدث أولاً
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="empty-state">${translations[currentLang].no_orders}</p>`;
                return;
            }

            if (container.querySelector('.empty-state')) {
                container.innerHTML = '';
            }

            const targetDocIds = new Set(filtered.map(o => String(o.docId)));

            // إزالة البطاقات التي لم تعد مطابقة للفلتر أو القسم الحالي
            const existingCards = Array.from(container.querySelectorAll('.order-card'));
            existingCards.forEach(card => {
                const docId = card.getAttribute('data-docid');
                if (!targetDocIds.has(docId)) {
                    card.remove();
                }
            });

            // تحديث البطاقات أو إضافتها بشكل ذكي (بدون إعادة رسم القائمة بالكامل)
            filtered.forEach((order, index) => {
                const docId = String(order.docId);
                let card = container.querySelector(`.order-card[data-docid="${docId}"]`);
                const cardHtml = generateOrderCardHTML(order);

                if (!card) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = cardHtml;
                    card = tempDiv.firstElementChild;
                    
                    const currentChildren = Array.from(container.children);
                    if (index < currentChildren.length) {
                        container.insertBefore(card, currentChildren[index]);
                    } else {
                        container.appendChild(card);
                    }
                } else {
                    if (card.outerHTML !== cardHtml) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = cardHtml;
                        const newCard = tempDiv.firstElementChild;
                        card.replaceWith(newCard);
                    } else {
                        const currentChildren = Array.from(container.children);
                        if (currentChildren[index] !== card) {
                            container.insertBefore(card, currentChildren[index] || null);
                        }
                    }
                }
            });

            updateStatsAndFilters();
        }

        function updateDateAndTimeFilters(orders) {
            let dateSelect = document.getElementById('dateFilter');
            let timeSelect = document.getElementById('timeFilter');
            if (!dateSelect || !timeSelect) return;

            let currentSelectedDate = dateSelect.value || 'all';
            let currentSelectedTime = timeSelect.value || 'all';

            let dates = [...new Set(orders.map(o => o.date).filter(Boolean))];
            let times = [...new Set(orders.map(o => o.time).filter(Boolean))];

            let dateHtml = `<option value="all">${translations[currentLang].all_dates}</option>`;
            dates.forEach(d => { dateHtml += `<option value="${d}">${d}</option>`; });

            let timeHtml = `<option value="all">${translations[currentLang].all_times}</option>`;
            times.forEach(t => { timeHtml += `<option value="${t}">${t}</option>`; });

            if (dateSelect.innerHTML !== dateHtml) {
                dateSelect.innerHTML = dateHtml;
                dateSelect.value = dates.includes(currentSelectedDate) ? currentSelectedDate : 'all';
            }

            if (timeSelect.innerHTML !== timeHtml) {
                timeSelect.innerHTML = timeHtml;
                timeSelect.value = times.includes(currentSelectedTime) ? currentSelectedTime : 'all';
            }
        }

        async function updateStatus(docId, newStatus) {
            let order = globalOrdersMap.get(String(docId));
            if (!order) return;

            let oldStatus = order.status;
            if (oldStatus === newStatus) return;

            // Optimistic Update لتغيير لون الزر فورياً وعدم وجود أي تأخير
            order.status = newStatus;
            updateStatsAndFilters();
            renderKitchenOrders();

            try {
                const { doc, updateDoc } = window.firestoreModules;
                const orderRef = doc(window.db, `restaurants/${restaurant}/orders`, String(docId));
                await updateDoc(orderRef, { status: newStatus });
            } catch (e) {
                console.error("Error updating status: ", e);
                // Rollback في حال الفشل
                order.status = oldStatus;
                updateStatsAndFilters();
                renderKitchenOrders();
            }
        }

        function printReceipt(orderId) {
            let order = Array.from(globalOrdersMap.values()).find(o => String(o.docId) === String(orderId) || String(o.id) === String(orderId));
            if (!order) return;

            let logoImgHtml = restData.logo ? `<img src="${restData.logo}" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 5px auto;">` : '';
            let clientName = order.client ? order.client.name : '';
            let clientPhone = order.client ? order.client.phone : '';
            let clientAddress = order.client ? order.client.address : '';

            let printDocumentContent = `
                <!DOCTYPE html>
                <html dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                <head>
                    <meta charset="UTF-8">
                    <title>Receipt #${order.id || order.docId}</title>
                    <style>
                        body { font-family: 'Cairo', sans-serif; padding: 5px; font-size: 12px; color: #000; width: 72mm; margin: 0 auto; text-align: center; }
                        h2 { margin: 2px 0; font-size: 14px; }
                        .info { margin-bottom: 6px; border-bottom: 1px dashed #000; padding-bottom: 6px; font-size: 10px; text-align: ${currentLang === 'ar' ? 'right' : 'left'}; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 10px; text-align: ${currentLang === 'ar' ? 'right' : 'left'}; }
                        th, td { padding: 2px; border-bottom: 1px solid #ddd; }
                        .totals-section { margin-top: 6px; border-top: 1px dashed #000; padding-top: 4px; font-size: 10px; text-align: ${currentLang === 'ar' ? 'right' : 'left'}; }
                        .total-final { font-weight: bold; font-size: 12px; margin-top: 2px; }
                        .footer-note { font-size: 9px; margin-top: 8px; border-top: 1px solid #000; padding-top: 4px; }
                    </style>
                </head>
                <body>
                    ${logoImgHtml}
                    <h2>${restaurant.toUpperCase()}</h2>
                    <div class="info">
                        <strong>Order:</strong> #${escapeHTML(String(order.id || order.docId).slice(-4))}<br>
                        <strong>Date:</strong> ${escapeHTML(order.date || '')} - ${escapeHTML(order.time || '')}<br>
                        <strong>Client:</strong> ${escapeHTML(clientName)} (${escapeHTML(clientPhone)})<br>
                        ${clientAddress ? `<strong>Address:</strong> ${escapeHTML(clientAddress)}<br>` : ''}
                        <strong>Type:</strong> ${escapeHTML(order.type || '')} (${escapeHTML(order.table || '-')})
                    </div>
                    <table>
                        <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
                        ${(order.items || []).map(i => `<tr><td>${escapeHTML(i.name || '')}</td><td>${i.qty || i.quantity || 1}</td><td>${(i.price || 0) * (i.qty || i.quantity || 1)}</td></tr>`).join('')}
                    </table>
                    <div class="totals-section">
                        <div>Fee: ${order.serviceFee || order.fees || 0} ${translations[currentLang].currency}</div>
                        <div class="total-final">Total: ${order.total || 0} ${translations[currentLang].currency}</div>
                    </div>
                    <div class="footer-note">
                        Thank You For Your Visit!<br>
                        Abdelrhman Mohamed | Web Developer
                    </div>
                </body>
                </html>
            `;

            let iframe = document.getElementById('printIframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'printIframe';
                iframe.style.position = 'fixed';
                iframe.style.right = '0';
                iframe.style.bottom = '0';
                iframe.style.width = '0px';
                iframe.style.height = '0px';
                iframe.style.border = 'none';
                iframe.style.visibility = 'hidden';
                document.body.appendChild(iframe);
            }

            let doc = iframe.contentWindow.document;
            doc.open();
            doc.write(printDocumentContent);
            doc.close();

            setTimeout(() => {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }, 250);
        }

        function initFirestoreListener() {
            if (isFirestoreInitialized) return;
            
            if (window.db && window.firestoreModules) {
                isFirestoreInitialized = true;
                const { collection, onSnapshot } = window.firestoreModules;
                const ordersCol = collection(window.db, `restaurants/${restaurant}/orders`);
                
                onSnapshot(ordersCol, (snapshot) => {
                    const changes = snapshot.docChanges();
                    let hasNewOrderAdded = false;

                    changes.forEach(change => {
                        const data = change.doc.data();
                        data.docId = change.doc.id;
                        if (!data.id) data.id = change.doc.id;

                        if (change.type === "added") {
                            globalOrdersMap.set(data.docId, data);
                            if (!isInitialSnapshot) {
                                hasNewOrderAdded = true;
                            }
                        } else if (change.type === "modified") {
                            globalOrdersMap.set(data.docId, data);
                        } else if (change.type === "removed") {
                            globalOrdersMap.delete(data.docId);
                        }
                    });

                    if (hasNewOrderAdded) {
                        playOrderSound();
                    }

                    isInitialSnapshot = false;
                    renderKitchenOrders();
                }, (error) => {
                    console.error("Kitchen orders snapshot error:", error);
                });
            }
        }
    </script>
</body>
</html>
