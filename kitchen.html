<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - شاشة المطبخ اللحظية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-glass: rgba(22, 31, 49, 0.85);
            --accent-neon: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ff0055;
            --green-glow: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(0, 255, 135, 0.1);
            border: 1px solid var(--green-glow);
            color: var(--green-glow);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .orders-count {
            background: var(--accent-purple);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .order-card {
            background: var(--card-glass);
            border: 1px solid var(--accent-purple);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(121, 40, 202, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .order-table {
            font-weight: 900;
            color: var(--accent-neon);
            font-size: 1.2rem;
        }

        .order-time {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }

        .order-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
        }

        .order-total-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .order-done-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--green-glow), #059669);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .no-orders {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-sub);
            font-size: 1.2rem;
            background: var(--card-glass);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">شاشة المطبخ والكاشير 👨‍🍳</div>
        <div class="status-badge">النظام متصل حي 🟢</div>
    </header>

    <div class="orders-header">
        <h2 style="font-size: 1.2rem; color: #fff;">الطلبات الواردة فورياً</h2>
        <span class="orders-count" id="ordersCount">0 طلبات معلقة</span>
    </div>

    <div class="orders-grid" id="ordersGrid">
        <div class="no-orders">في انتظار أوردرات جديدة من العملاء... ☕</div>
    </div>

    <script>
        let previousOrdersCount = 0;

        // دالة صوت الجرس عند نزول أوردر جديد
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // نغمة جرس
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function checkNewOrders() {
            const orders = JSON.parse(localStorage.getItem('nexus_orders') || '[]');
            const grid = document.getElementById('ordersGrid');
            document.getElementById('ordersCount').innerText = `${orders.length} طلبات معلقة`;

            // إطلاق جرس التنبيه لو نزل أوردر جديد
            if (orders.length > previousOrdersCount) {
                playBeep();
            }
            previousOrdersCount = orders.length;

            if (orders.length === 0) {
                grid.innerHTML = `<div class="no-orders">في انتظار أوردرات جديدة من العملاء... ☕</div>`;
                return;
            }

            grid.innerHTML = '';
            orders.forEach(order => {
                let itemsListHtml = '';
                order.items.forEach(i => {
                    itemsListHtml += `
                        <div class="order-item">
                            <span>1x ${i.name}</span>
                            <span style="color: var(--text-sub);">${i.price} ج.م</span>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div>
                        <div class="order-header">
                            <span class="order-table">ترابيزة رقم ${order.table}</span>
                            <span class="order-time">⏰ ${order.time}</span>
                        </div>
                        <div class="order-items">
                            ${itemsListHtml}
                        </div>
                    </div>
                    <div class="order-footer">
                        <div class="order-total-row">
                            <span>الإجمالي:</span>
                            <span style="color: var(--green-glow);">${order.total} ج.م</span>
                        </div>
                        <button class="order-done-btn" onclick="completeOrder(${order.id})">تم التجهيز والتقديم ✅</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function completeOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem('nexus_orders') || '[]');
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('nexus_orders', JSON.stringify(orders));
            checkNewOrders();
        }

        // فحص تلقائي كل ثانية للطلبات الجديدة (Real-time polling)
        setInterval(checkNewOrders, 1000);
        checkNewOrders();
    </script>
</body>
</html>
