<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ وإدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --info: #1E90FF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
        header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 12px;
            align-items: center;
        }
        .total-badge { font-size: 12px; color: var(--gray); text-align: center; }
        .total-badge span { display: block; font-size: 16px; font-weight: 900; color: var(--white); }

        .tabs-row {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .tab-btn.active {
            background: rgba(255, 165, 2, 0.15);
            color: var(--warning);
            border-color: var(--warning);
        }
        .tab-btn.active.delivered {
            background: rgba(46, 213, 115, 0.15);
            color: var(--secondary);
            border-color: var(--secondary);
        }
        .tab-btn.active.cancelled {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .filter-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .search-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--white);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
        }
        .filter-select {
            flex: 1;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            color: var(--white);
            font-size: 11px;
        }

        .order-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .table-title { font-size: 14px; font-weight: 700; color: var(--primary); }
        .order-meta { font-size: 11px; color: var(--gray); }

        .customer-info {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 12px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .total-price { font-weight: 700; color: var(--secondary); font-size: 13px; }

        .print-btn {
            background: rgba(30, 144, 255, 0.15);
            color: var(--info);
            border: 1px solid var(--info);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-actions {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        .status-btn {
            background: var(--dark-bg);
            color: var(--white);
            border: 1px solid var(--border);
            padding: 6px 8px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 10px;
            flex: 1;
            text-align: center;
        }
        .status-btn.active-status { background: var(--warning); color: #000; border-color: var(--warning); }
        .status-btn.ready-status { background: var(--info); color: #fff; border-color: var(--info); }
        .status-btn.delivery-status { background: #9b59b6; color: #fff; border-color: #9b59b6; }
        .status-btn.success-status { background: var(--secondary); color: #000; border-color: var(--secondary); }

        .disabled-card { opacity: 0.85; }

        #customAlertModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .custom-alert-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .custom-alert-box p { font-size: 14px; margin-bottom: 20px; color: var(--white); line-height: 1.6; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- عنصر الصوت المدمج للتنبيه -->
    <audio id="orderAlertSound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <header>
        <div class="header-brand">
            <img id="headerLogoImg" class="header-logo" src="" alt="الشعار">
            <h1><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> <span data-i18n="kitchen_title">شاشة المطبخ</span></h1>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <select id="langSelectKitchen" onchange="changeLanguage(this.value)" style="width: 100px; padding: 4px; font-size: 11px; background: var(--dark-bg); color: #fff; border: 1px solid var(--border); border-radius: 6px;">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇺🇸</option>
            </select>
            <div id="headerRestaurantTitle">مطعمي</div>
        </div>
    </header>

    <div class="container">
        <div class="stats-bar">
            <div class="total-badge"><span data-i18n="total_orders">إجمالي الطلبات</span> <span id="totalOrdersCount">0</span></div>
            <div class="total-badge" style="color: var(--warning);"><span data-i18n="active_orders">النشطة</span> <span id="activeCount">0</span></div>
            <div class="total-badge" style="color: var(--secondary);"><span data-i18n="delivered_orders">تم التسليم</span> <span id="deliveredCount">0</span></div>
            <div class="total-badge" style="color: var(--primary);"><span data-i18n="cancelled_orders">الملغاة</span> <span id="cancelledCount">0</span></div>
        </div>

        <div class="tabs-row">
            <button class="tab-btn active" id="tabActive" onclick="switchTab('active')"><i class="fa-solid fa-hourglass-half"></i> <span data-i18n="tab_active">نشطة</span> (<span id="tabActiveCount">0</span>)</button>
            <button class="tab-btn" id="tabDelivered" onclick="switchTab('delivered')"><i class="fa-solid fa-check"></i> <span data-i18n="tab_delivered">تم التسليم</span></button>
            <button class="tab-btn" id="tabCancelled" onclick="switchTab('cancelled')"><i class="fa-solid fa-xmark"></i> <span data-i18n="tab_cancelled">تم الإلغاء</span></button>
        </div>

        <div class="filter-box">
            <input type="text" id="searchInput" class="search-input" placeholder="بحث برقم الطلب، اسم العميل، أو الـ table..." oninput="loadKitchenOrders(true)">
            <div class="filter-row">
                <select id="dateFilter" class="filter-select" onchange="loadKitchenOrders(true)">
                    <option value="all" data-i18n="all_dates">كل التواريخ</option>
                </select>
                <select id="timeFilter" class="filter-select" onchange="loadKitchenOrders(true)">
                    <option value="all" data-i18n="all_times">كل الأوقات</option>
                </select>
            </div>
        </div>

        <div id="kitchenOrdersList"></div>
    </div>

    <script>
        let currentLang = localStorage.getItem('app_lang') || 'ar';
        const translations = {
            ar: {
                kitchen_title: "شاشة المطبخ",
                total_orders: "إجمالي الطلبات",
                active_orders: "النشطة",
                delivered_orders: "تم التسليم",
                cancelled_orders: "الملغاة",
                tab_active: "نشطة",
                tab_delivered: "تم التسليم",
                tab_cancelled: "تم الإلغاء",
                all_dates: "كل التواريخ",
                all_times: "كل الأوقات",
                search_placeholder: "بحث برقم الطلب، اسم العميل، أو الـ table...",
                print_receipt: "طباعة الوصل",
                status_prep: "تحضير",
                status_ready: "جاهز",
                status_delivery: "دليفري",
                status_success: "تسليم",
                subtotal: "المجموع الفرعي",
                total_final: "الإجمالي النهائي"
            },
            en: {
                kitchen_title: "Kitchen Display",
                total_orders: "Total Orders",
                active_orders: "Active",
                delivered_orders: "Delivered",
                cancelled_orders: "Cancelled",
                tab_active: "Active",
                tab_delivered: "Delivered",
                tab_cancelled: "Cancelled",
                all_dates: "All Dates",
                all_times: "All Times",
                search_placeholder: "Search order #, client name, table...",
                print_receipt: "Print Receipt",
                status_prep: "Prep",
                status_ready: "Ready",
                status_delivery: "Delivery",
                status_success: "Deliver",
                subtotal: "Subtotal",
                total_final: "Final Total"
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelectKitchen').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                let key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });
            document.getElementById('searchInput').placeholder = translations[lang].search_placeholder;
            loadKitchenOrders(true);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        let db = JSON.parse(localStorage.getItem('all_restaurants_db')) || {};
        let restData = db[restaurant] || {};

        let customColor = restData.primaryColor || '#FF4757';
        document.documentElement.style.setProperty('--primary', customColor);

        if (restData.logo) {
            let logoImg = document.getElementById('headerLogoImg');
            logoImg.src = restData.logo;
            logoImg.style.display = 'block';
        }

        let currentTab = 'active';
        let lastSerializedData = ""; // متغير لحفظ الحالة السابقة للبيانات بصيغة JSON لمنع الوميض والتحديث غير الضروري

        function playOrderSound() {
            let sound = document.getElementById('orderAlertSound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio play blocked by browser policy until user interaction"));
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = 'tab-btn';
            });
            let btn = document.getElementById(tab === 'active' ? 'tabActive' : (tab === 'delivered' ? 'tabDelivered' : 'tabCancelled'));
            btn.classList.add('active');
            if(tab === 'delivered') btn.classList.add('delivered');
            if(tab === 'cancelled') btn.classList.add('cancelled');
            loadKitchenOrders(true);
        }

        function loadKitchenOrders(forceUpdate = false) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            
            // فحص التغييرات عبر JSON.stringify بما يشمل الفلاتر والتبويب الحالي لتحديد هل يلزم إعادة الرسم أم لا
            let searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            let dateVal = document.getElementById('dateFilter').value;
            let timeVal = document.getElementById('timeFilter').value;

            let activeListForCheck = orders.filter(o => o.status !== 'تم التسليم' && o.status !== 'ملغي' && o.status !== 'Delivered' && o.status !== 'Cancelled');
            
            // تجهيز كائن يمثل حالة البيانات بالكامل للمقارنة
            let currentStateObj = {
                orders: orders,
                tab: currentTab,
                search: searchVal,
                date: dateVal,
                time: timeVal,
                lang: currentLang
            };
            let currentSerialized = JSON.stringify(currentStateObj);

            // التحقق من وجود طلبات جديدة لتشغيل التنبيه الصوتي فقط عند حدوث زيادة حقيقية
            let previousOrders = lastSerializedData ? JSON.parse(lastSerializedData).orders : [];
            let prevActiveCount = previousOrders.filter(o => o.status !== 'تم التسليم' && o.status !== 'ملغي' && o.status !== 'Delivered' && o.status !== 'Cancelled').length;
            
            if (lastSerializedData !== "" && activeListForCheck.length > prevActiveCount) {
                playOrderSound();
            }

            // إذا كانت البيانات والفلترة متطابقة تماماً ولم يتم طلب اجبار التحديث، فلا تقم بإعادة رسم الـ DOM لتجنب الوميض نهائياً
            if (!forceUpdate && currentSerialized === lastSerializedData) {
                return;
            }

            lastSerializedData = currentSerialized;

            let container = document.getElementById('kitchenOrdersList');

            document.getElementById('totalOrdersCount').innerText = orders.length;
            let deliveredList = orders.filter(o => o.status === 'تم التسليم' || o.status === 'Delivered');
            let cancelledList = orders.filter(o => o.status === 'ملغي' || o.status === 'Cancelled');

            document.getElementById('activeCount').innerText = activeListForCheck.length;
            document.getElementById('deliveredCount').innerText = deliveredList.length;
            document.getElementById('cancelledCount').innerText = cancelledList.length;
            document.getElementById('tabActiveCount').innerText = activeListForCheck.length;

            updateDateAndTimeFilters(orders);

            let filtered = orders.filter(o => {
                let st = o.status;
                let isDel = (st === 'تم التسليم' || st === 'Delivered');
                let isCan = (st === 'ملغي' || st === 'Cancelled');
                if (currentTab === 'active') return !isDel && !isCan;
                if (currentTab === 'delivered') return isDel;
                if (currentTab === 'cancelled') return isCan;
            });

            if (searchVal) {
                filtered = filtered.filter(o => 
                    String(o.id).includes(searchVal) ||
                    (o.client && o.client.name.toLowerCase().includes(searchVal)) ||
                    String(o.table).toLowerCase().includes(searchVal)
                );
            }

            if (dateVal !== 'all') filtered = filtered.filter(o => o.date === dateVal);
            if (timeVal !== 'all') filtered = filtered.filter(o => o.time === timeVal);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 40px; font-size: 13px;">${currentLang === 'ar' ? 'لا توجد طلبات في هذا القسم.' : 'No orders in this section.'}</p>`;
                return;
            }

            let html = '';
            filtered.slice().reverse().forEach(order => {
                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item-row">
                            <span>x ${item.qty} ${item.name}</span>
                            <span style="color: var(--secondary);">${item.price * item.qty} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}</span>
                        </div>
                    `;
                });

                let clientName = order.client ? order.client.name : 'Client';
                let clientPhone = order.client ? order.client.phone : '';
                let clientAddress = order.client ? order.client.address : '';

                let isLocked = (order.status === 'تم التسليم' || order.status === 'ملغي' || order.status === 'Delivered' || order.status === 'Cancelled');
                let serviceText = order.type === 'صالة' || order.type === 'Dine-In' ? `${currentLang === 'ar' ? 'خدمة صالة' : 'Dine-In Fee'}: ${order.serviceFee} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}` : `${currentLang === 'ar' ? 'توصيل' : 'Delivery'}: ${order.serviceFee} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}`;

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="table-title">${currentLang === 'ar' ? 'طلب' : 'Order'} ${order.type} (${order.table})</div>
                            <div class="order-meta"><i class="fa-regular fa-calendar"></i> ${order.date} | <i class="fa-regular fa-clock"></i> ${order.time} | #${order.id}</div>
                        </div>
                        
                        <div class="customer-info">
                            <div><i class="fa-solid fa-user" style="color: var(--primary);"></i> ${clientName} (${clientPhone})</div>
                            ${clientAddress ? `<div style="margin-top: 4px; color: var(--gray);"><i class="fa-solid fa-location-dot" style="color: var(--primary);"></i> ${clientAddress}</div>` : ''}
                        </div>

                        <div>
                            ${itemsHtml}
                            <div style="font-size: 11px; color: var(--gray); margin-top: 6px;">${serviceText}</div>
                        </div>

                        <div class="order-footer">
                            <div class="total-price">${translations[currentLang].total_final}: ${order.total} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}</div>
                            <button class="print-btn" onclick="printReceipt(${order.id})"><i class="fa-solid fa-print"></i> ${translations[currentLang].print_receipt}</button>
                        </div>

                        <div class="status-actions">
                            <button class="status-btn" onclick="updateStatus(${order.id}, 'قيد التحضير')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_prep}</button>
                            <button class="status-btn" onclick="updateStatus(${order.id}, 'جاهز')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_ready}</button>
                            <button class="status-btn" onclick="updateStatus(${order.id}, 'جاري التوصيل')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_delivery}</button>
                            <button class="status-btn" onclick="updateStatus(${order.id}, 'تم التسليم')" ${isLocked ? 'disabled' : ''}>${translations[currentLang].status_success}</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateDateAndTimeFilters(orders) {
            let dateSelect = document.getElementById('dateFilter');
            let timeSelect = document.getElementById('timeFilter');
            let currentSelectedDate = dateSelect.value;
            let currentSelectedTime = timeSelect.value;

            let dates = [...new Set(orders.map(o => o.date))];
            let times = [...new Set(orders.map(o => o.time))];

            let dateHtml = `<option value="all">${translations[currentLang].all_dates}</option>`;
            dates.forEach(d => { dateHtml += `<option value="${d}">${d}</option>`; });
            dateSelect.innerHTML = dateHtml;
            dateSelect.value = currentSelectedDate;

            let timeHtml = `<option value="all">${translations[currentLang].all_times}</option>`;
            times.forEach(t => { timeHtml += `<option value="${t}">${t}</option>`; });
            timeSelect.innerHTML = timeHtml;
            timeSelect.value = currentSelectedTime;
        }

        function updateStatus(orderId, newStatus) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                loadKitchenOrders(true); // تحديث إجباري عند تغيير الحالة
            }
        }

        function printReceipt(orderId) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (!order) return;

            let logoImgHtml = restData.logo ? `<img src="${restData.logo}" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: block; margin: 0 auto 5px auto;">` : '';

            let printContent = `
                <html dir="${currentLang === 'ar' ? 'rtl' : 'ltr'}">
                <head>
                    <title>Receipt #${order.id}</title>
                    <style>
                        body { font-family: 'Cairo', sans-serif; padding: 10px; font-size: 13px; color: #000; width: 180px; margin: 0 auto; text-align: center; }
                        h2 { margin-bottom: 2px; font-size: 15px; }
                        .info { margin-bottom: 8px; border-bottom: 1px dashed #000; padding-bottom: 6px; font-size: 11px; text-align: ${currentLang === 'ar' ? 'right' : 'left'}; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 11px; text-align: ${currentLang === 'ar' ? 'right' : 'left'}; }
                        th, td { padding: 3px; border-bottom: 1px solid #ddd; }
                        .total { font-weight: bold; text-align: ${currentLang === 'ar' ? 'left' : 'right'}; font-size: 12px; margin-top: 8px; }
                        .footer-dev { font-size: 9px; margin-top: 10px; border-top: 1px solid #000; padding-top: 5px; }
                    </style>
                </head>
                <body>
                    ${logoImgHtml}
                    <h2>${restaurant.toUpperCase()}</h2>
                    <div class="info">
                        Order: #${order.id}<br>
                        Date: ${order.date} - ${order.time}<br>
                        Client: ${order.client.name} (${order.client.phone})<br>
                        Address: ${order.client.address || '-'}<br>
                        Type: ${order.type} (${order.table})
                    </div>
                    <table>
                        <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
                        ${order.items.map(i => `<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price * i.qty}</td></tr>`).join('')}
                    </table>
                    <div style="text-align: ${currentLang === 'ar' ? 'right' : 'left'}; font-size: 11px;">Service Fee: ${order.serviceFee}</div>
                    <div class="total">Total: ${order.total}</div>
                    <div class="footer-dev">Abdelrhman Mohamed</div>
                </body>
                </html>
            `;

            let iframe = document.getElementById('printIframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'printIframe';
                iframe.style.position = 'absolute';
                iframe.style.width = '0px';
                iframe.style.height = '0px';
                iframe.style.border = 'none';
                document.body.appendChild(iframe);
            }

            let doc = iframe.contentWindow.document;
            doc.open();
            doc.write(printContent);
            doc.close();

            iframe.contentWindow.focus();
            setTimeout(() => {
                iframe.contentWindow.print();
            }, 500);
        }

        setInterval(() => loadKitchenOrders(false), 2000);
        window.onload = function() {
            changeLanguage(currentLang);
        };
    </script>
    <div style="text-align: center; padding: 20px 0; background: var(--dark-card, #151B22); border-top: 1px solid var(--border, #30363D); margin-top: 40px; color: var(--gray, #8B949E); font-size: 13px; font-family: 'Cairo', sans-serif;">
        تم التطوير بواسطة <span style="color: var(--primary, #FF4757); font-weight: 700;">Abdelrhman Mohamed | Web Developer</span>
    </div>
</body>
</html>
