<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة المطبخ - استلام الطلبات</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #060911; color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function KitchenApp() {
            const [orders, setOrders] = useState([]);
            const [audioAllowed, setAudioAllowed] = useState(false);
            const prevOrdersCount = useRef(0);

            const playNotificationSound = () => {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            };

            const loadOrders = () => {
                const savedOrders = localStorage.getItem('nexus_kitchen_orders');
                if (savedOrders) {
                    const parsed = JSON.parse(savedOrders);
                    setOrders(parsed);

                    if (parsed.length > prevOrdersCount.current && audioAllowed) {
                        playNotificationSound();
                    }
                    prevOrdersCount.current = parsed.length;
                }
            };

            useEffect(() => {
                loadOrders();
                const handleStorageChange = (e) => {
                    if (e.key === 'nexus_kitchen_orders') loadOrders();
                };
                window.addEventListener('storage', handleStorageChange);
                const interval = setInterval(loadOrders, 2000);
                return () => {
                    window.removeEventListener('storage', handleStorageChange);
                    clearInterval(interval);
                };
            }, [audioAllowed]);

            const updateOrderStatus = (orderId, newStatus) => {
                let updated;
                if (newStatus === 'completed') {
                    updated = orders.filter(o => o.id !== orderId);
                } else {
                    updated = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
                }
                setOrders(updated);
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updated));
            };

            const enableAudio = () => {
                setAudioAllowed(true);
                playNotificationSound();
            };

            return (
                <div className="max-w-6xl mx-auto p-4 space-y-6">
                    {/* Header */}
                    <header className="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-amber-500/20 border border-amber-500/30 rounded-xl flex items-center justify-center text-amber-400 text-xl font-bold">
                                <i className="fa-solid fa-utensils"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-xl text-slate-100">شاشة المطبخ (Kitchen Display)</h1>
                                <p className="text-xs text-slate-400">متابعة الطلبات المباشرة والدمج مع طلبات الأونلاين</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            {!audioAllowed ? (
                                <button onClick={enableAudio} className="px-3 py-1.5 bg-amber-500/20 border border-amber-500/40 text-amber-300 rounded-xl text-xs font-bold animate-pulse">
                                    <i className="fa-solid fa-volume-high ml-1"></i> اضغط لتفعيل صوت التنبيه 🔔
                                </button>
                            ) : (
                                <span className="text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-xl font-bold">
                                    <i className="fa-solid fa-bell ml-1"></i> التنبيه الصوتي مفعل
                                </span>
                            )}
                            <div className="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs text-slate-300 font-bold">
                                الطلبات النشطة: <span className="text-cyan-400 text-sm font-extrabold">{orders.length}</span>
                            </div>
                        </div>
                    </header>

                    {/* قائمة الطلبات */}
                    {orders.length === 0 ? (
                        <div className="text-center py-20 glass-card rounded-2xl border border-slate-800 space-y-3">
                            <i className="fa-solid fa-square-check text-4xl text-slate-600"></i>
                            <h3 className="text-base font-bold text-slate-400">لا توجد طلبات جديدة حالياً</h3>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {orders.map((order) => {
                                const isReady = order.status === 'ready';
                                const isOnline = !!order.customerInfo;

                                return (
                                    <div 
                                        key={order.id} 
                                        className={`glass-card rounded-2xl p-5 space-y-4 relative transition-all border ${
                                            isReady ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-amber-500/40'
                                        }`}
                                    >
                                        {/* نوع الطلب (ترابيزة أم أونلاين) */}
                                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                            {isOnline ? (
                                                <div className="bg-emerald-500 text-slate-950 px-3 py-1 rounded-xl font-black text-xs flex items-center gap-1 shadow-md">
                                                    <i className="fa-solid fa-motorcycle"></i>
                                                    <span>طلب أونلاين / دليفري</span>
                                                </div>
                                            ) : (
                                                <div className="bg-amber-500 text-slate-950 px-3 py-1 rounded-xl font-black text-xs flex items-center gap-1 shadow-md">
                                                    <i className="fa-solid fa-chair"></i>
                                                    <span>{order.tableNumber}</span>
                                                </div>
                                            )}
                                            <span className="text-[11px] text-slate-400 font-mono">
                                                <i className="fa-regular fa-clock ml-1"></i>
                                                {order.time || 'الآن'}
                                            </span>
                                        </div>

                                        {/* تفاصيل التوصيل لو أونلاين */}
                                        {isOnline && (
                                            <div className="bg-slate-900/90 p-3 rounded-xl border border-emerald-500/30 text-xs space-y-1">
                                                <p className="font-bold text-emerald-300 flex items-center gap-1">
                                                    <i className="fa-solid fa-user text-[10px]"></i> {order.customerInfo.name}
                                                </p>
                                                <p className="text-slate-300 flex items-center gap-1 dir-ltr text-right font-mono">
                                                    <i className="fa-solid fa-phone text-[10px] text-slate-400"></i> {order.customerInfo.phone}
                                                </p>
                                                <p className="text-slate-400 text-[11px] flex items-start gap-1 mt-1">
                                                    <i className="fa-solid fa-location-dot text-[10px] text-rose-400 mt-1"></i> {order.customerInfo.address}
                                                </p>
                                            </div>
                                        )}

                                        {/* تفاصيل الإصناف المطلوبة */}
                                        <div className="space-y-2">
                                            <h4 className="text-xs text-slate-400 font-bold">الأصناف المطلوبة:</h4>
                                            <div className="space-y-1.5 max-h-[180px] overflow-y-auto pr-1">
                                                {order.items.map((item, idx) => (
                                                    <div key={idx} className="flex items-center justify-between bg-slate-900/90 p-2 rounded-xl border border-slate-800">
                                                        <span className="font-bold text-xs text-slate-100">{item.name}</span>
                                                        <span className="bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 font-black text-xs px-2.5 py-0.5 rounded-lg">
                                                            x{item.quantity}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* الإجمالي وتحديث الحالة */}
                                        <div className="pt-2 border-t border-slate-800 space-y-3">
                                            <div className="flex justify-between items-center text-xs">
                                                <span className="text-slate-400">إجمالي الحساب:</span>
                                                <span className="font-bold text-cyan-400 text-sm">{order.totalPrice} ج.م</span>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2">
                                                {!isReady ? (
                                                    <button 
                                                        onClick={() => updateOrderStatus(order.id, 'ready')}
                                                        className="col-span-2 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1 shadow-lg"
                                                    >
                                                        <i className="fa-solid fa-check"></i> تم التجهيز (جاهز)
                                                    </button>
                                                ) : (
                                                    <>
                                                        <span className="col-span-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-center py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                                                            <i className="fa-solid fa-circle-check"></i> جاهز
                                                        </span>
                                                        <button 
                                                            onClick={() => updateOrderStatus(order.id, 'completed')}
                                                            className="col-span-1 py-2 bg-slate-800 hover:bg-rose-600 hover:text-white text-slate-300 font-bold rounded-xl text-xs transition-all"
                                                        >
                                                            تسليم وتصفية 🗑️
                                                        </button>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<KitchenApp />);
    </script>
</body>
</html>
