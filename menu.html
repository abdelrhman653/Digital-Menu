<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو والطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --warning: #FFA502;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 90px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .shop-brand { font-size: 15px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .top-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--dark-bg); border: 1px solid var(--border); color: var(--white);
            padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px;
        }

        .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }

        /* تصنيفات المنيو */
        .categories-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: var(--dark-card); border: 1px solid var(--border); color: var(--gray);
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .cat-chip.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .food-card {
            background: var(--dark-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; padding: 10px;
        }
        .food-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; }
        .food-title { font-size: 13px; font-weight: 700; margin-top: 8px; }
        .food-price { color: var(--secondary); font-size: 12px; font-weight: 900; margin-top: 4px; }
        .add-btn {
            width: 100%; background: rgba(255, 71, 87, 0.15); color: var(--primary); border: 1px solid var(--primary);
            padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 8px;
        }

        /* سلة الطلبات العائمة */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--dark-card); border-top: 1px solid var(--border);
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }
        .checkout-btn {
            background: var(--primary-gradient); color: var(--white); border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
        }

        /* Modal مخصص عام */
        .custom-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .custom-modal-content {
            background: var(--dark-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 350px; text-align: center; max-height: 80vh; overflow-y: auto;
        }
        .custom-modal-text { font-size: 13px; margin-bottom: 20px; color: var(--white); line-height: 1.6; }
        .custom-modal-btns { display: flex; gap: 10px; }
        .custom-modal-btn {
            flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; border: none;
        }
        .modal-btn-confirm { background: var(--primary); color: var(--white); }
        .modal-btn-cancel { background: var(--dark-bg); color: var(--gray); border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="shop-brand" id="restaurantNameHeader"><i class="fa-solid fa-store"></i> Abdo Shop</div>
        <div class="top-actions">
            <button class="icon-btn" onclick="openHistoryModal()"><i class="fa-solid fa-clock-rotate-left"></i> طلباتي</button>
            <button class="icon-btn" onclick="openProfileModal()"><i class="fa-solid fa-user"></i> حسابي</button>
        </div>
    </header>

    <div class="container">
        <!-- شريط التصنيفات -->
        <div class="categories-scroll" id="categoriesScroll">
            <div class="cat-chip active" onclick="filterCategory('الكل', this)">الكل</div>
            <div class="cat-chip" onclick="filterCategory('وجبات', this)">الوجبات الرئيسية</div>
            <div class="cat-chip" onclick="filterCategory('مقبلات', this)">المقبلات والسلطات</div>
            <div class="cat-chip" onclick="filterCategory('مشروبات', this)">المشروبات</div>
            <div class="cat-chip" onclick="filterCategory('حلويات', this)">الحلويات</div>
        </div>

        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <div class="cart-bar" id="cartBar" style="display: none;">
        <div>السلة: <span id="cartCount" style="color: var(--primary); font-weight: bold;">0</span> أصناف | الإجمالي: <span id="cartTotal" style="color: var(--secondary); font-weight: bold;">0</span> ج.م</div>
        <button class="checkout-btn" onclick="openCheckoutModal()">إتمام الطلب</button>
    </div>

    <!-- نافذة مخصصة عامة -->
    <div id="customModal" class="custom-modal">
        <div class="custom-modal-content" id="modalContentBox">
            <div id="modalText" class="custom-modal-text"></div>
            <div id="modalBtns" class="custom-modal-btns"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        let clientInfo = JSON.parse(localStorage.getItem(`client_${restaurant}`)) || { restaurantName: 'Abdo Shop', name: 'عميل', phone: '' };
        document.getElementById('restaurantNameHeader').innerHTML = `<i class="fa-solid fa-store"></i> ${clientInfo.restaurantName}`;

        let cart = [];
        const menuItems = [
            { id: 1, name: 'وجبة شاورما دابل', category: 'وجبات', price: 130, img: 'https://images.unsplash.com/photo-1529042410759-befb1204b468?w=300' },
            { id: 2, name: 'برجر مشوي بالجبنة', category: 'وجبات', price: 110, img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300' },
            { id: 3, name: 'بطاطس مقرمشة', category: 'مقبلات', price: 40, img: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300' },
            { id: 4, name: 'سلطة كول سلو', category: 'مقبلات', price: 30, img: 'https://images.unsplash.com/photo-1540420773420-3366772f4999?w=300' },
            { id: 5, name: 'عصير مانجو فريش', category: 'مشروبات', price: 45, img: 'https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=300' },
            { id: 6, name: 'كيك الشوكولاتة', category: 'حلويات', price: 60, img: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300' }
        ];

        function showModalHtml(htmlContent, buttonsHtml) {
            document.getElementById('modalText').innerHTML = htmlContent;
            document.getElementById('modalBtns').innerHTML = buttonsHtml;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeCustomModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function renderMenu(itemsToRender) {
            let grid = document.getElementById('menuGrid');
            let html = '';
            itemsToRender.forEach(item => {
                html += `
                    <div class="food-card">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="food-title">${item.name}</div>
                        <div class="food-price">${item.price} ج.م</div>
                        <button class="add-btn" onclick="addToCart(${item.id})"><i class="fa-solid fa-plus"></i> إضافة للسلة</button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            if(cat === 'الكل') {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(i => i.category === cat));
            }
        }

        function addToCart(id) {
            let item = menuItems.find(i => i.id === id);
            let found = cart.find(c => c.id === id);
            if(found) found.qty++;
            else cart.push({...item, qty: 1});
            updateCartBar();
        }

        function updateCartBar() {
            let totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            let totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            if(totalQty > 0) {
                document.getElementById('cartBar').style.display = 'flex';
                document.getElementById('cartCount').innerText = totalQty;
                document.getElementById('cartTotal').innerText = totalPrice;
            } else {
                document.getElementById('cartBar').style.display = 'none';
            }
        }

        function openCheckoutModal() {
            let subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            let html = `
                <h3 style="margin-bottom:12px; color:var(--primary);">تأكيد الطلب</h3>
                <div style="text-align:right; font-size:12px; margin-bottom:10px;">
                    <label>نوع الطلب:</label>
                    <select id="orderType" class="form-input" style="margin-top:5px; margin-bottom:10px;" onchange="toggleTableInput()">
                        <option value="صالة">صالة</option>
                        <option value="توصيل دليفري">توصيل دليفري</option>
                        <option value="أونلاين">أونلاين</option>
                    </select>
                    <div id="tableContainer">
                        <label>رقم الطاولة:</label>
                        <input type="text" id="tableNum" class="form-input" value="1" style="margin-top:5px; margin-bottom:10px;">
                    </div>
                    <div id="addressContainer" style="display:none;">
                        <label>عنوان التوصيل:</label>
                        <input type="text" id="clientAddress" class="form-input" placeholder="أدخل عنوانك بالتفصيل" style="margin-top:5px; margin-bottom:10px;">
                    </div>
                </div>
            `;
            let btns = `
                <button class="custom-modal-btn modal-btn-cancel" onclick="closeCustomModal()">إلغاء</button>
                <button class="custom-modal-btn modal-btn-confirm" onclick="submitOrder(${subtotal})">إرسال الطلب</button>
            `;
            showModalHtml(html, btns);
        }

        function toggleTableInput() {
            let type = document.getElementById('orderType').value;
            if(type === 'توصيل دليفري') {
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('addressContainer').style.display = 'block';
            } else {
                document.getElementById('tableContainer').style.display = 'block';
                document.getElementById('addressContainer').style.display = 'none';
            }
        }

        function submitOrder(subtotal) {
            let orderType = document.getElementById('orderType').value;
            let table = orderType === 'توصيل دليفري' ? 'دليفري' : (document.getElementById('tableNum').value || '1');
            let address = orderType === 'توصيل دليفري' ? document.getElementById('clientAddress').value : '';
            let serviceFee = orderType === 'توصيل دليفري' ? 40 : 0;

            let newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                type: orderType,
                table: table,
                items: [...cart],
                serviceFee: serviceFee,
                total: subtotal + serviceFee,
                status: 'قيد التحضير',
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
                client: clientInfo
            };

            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            orders.push(newOrder);
            localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));

            cart = [];
            updateCartBar();
            closeCustomModal();
            showModalHtml("تم إرسال طلبك بنجاح للمطبخ! يمكنك متابعة حالته من قائمة 'طلباتي'.", `<button class="custom-modal-btn modal-btn-confirm" onclick="closeCustomModal()">حسناً</button>`);
        }

        function openHistoryModal() {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            if(orders.length === 0) {
                showModalHtml("لا توجد طلبات سابقة.", `<button class="custom-modal-btn modal-btn-confirm" onclick="closeCustomModal()">حسناً</button>`);
                return;
            }

            let html = `<h3 style="margin-bottom:12px; color:var(--primary);">سجل طلباتي السابقة</h3>`;
            orders.slice().reverse().forEach(o => {
                let canCancel = o.status === 'قيد التحضير';
                html += `
                    <div style="background:var(--dark-bg); border:1px solid var(--border); border-radius:12px; padding:10px; margin-bottom:10px; text-align:right;">
                        <div style="font-size:11px; color:var(--gray);">طلب #${o.id} | ${o.date}</div>
                        <div style="font-size:12px; font-weight:bold; margin:4px 0;">الإجمالي: ${o.total} ج.م | الحالة: <span style="color:var(--warning);">${o.status}</span></div>
                        ${canCancel ? `<button class="custom-modal-btn modal-btn-cancel" style="width:100%; margin-top:5px; padding:6px; background:rgba(255,71,87,0.2); color:var(--primary); border-color:var(--primary);" onclick="cancelOrder(${o.id})">إلغاء الطلب</button>` : ''}
                    </div>
                `;
            });
            showModalHtml(html, `<button class="custom-modal-btn modal-btn-confirm" onclick="closeCustomModal()">إغلاق</button>`);
        }

        function cancelOrder(orderId) {
            // بدلاً من confirm الافتراضي، نستخدم المودال المخصص لتأكيد الإلغاء
            showModalHtml("هل أنت متأكد من رغبتك في إلغاء هذا الطلب؟", `
                <button class="custom-modal-btn modal-btn-cancel" onclick="closeCustomModal()">تراجع</button>
                <button class="custom-modal-btn modal-btn-confirm" onclick="confirmCancel(${orderId})">تأكيد الإلغاء</button>
            `);
        }

        function confirmCancel(orderId) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if(order) {
                order.status = 'ملغي';
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                closeCustomModal();
                openHistoryModal();
            }
        }

        function openProfileModal() {
            let html = `
                <h3 style="margin-bottom:12px; color:var(--primary);">حساب العميل</h3>
                <div style="text-align:right; font-size:12px; margin-bottom:10px;">
                    <p><b>المطعم:</b> ${clientInfo.restaurantName}</p>
                    <p style="margin-top:5px;"><b>الاسم:</b> ${clientInfo.name}</p>
                    <p style="margin-top:5px;"><b>الهاتف:</b> ${clientInfo.phone}</p>
                </div>
            `;
            let btns = `
                <button class="custom-modal-btn modal-btn-cancel" onclick="closeCustomModal()">إغلاق</button>
                <button class="custom-modal-btn modal-btn-confirm" onclick="window.location.href='index.html?restaurant=${restaurant}'">تغيير البيانات</button>
            `;
            showModalHtml(html, btns);
        }

        window.onload = () => renderMenu(menuItems);
    </script>
</body>
</html>
