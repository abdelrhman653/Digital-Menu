<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الطعام الرقمية - العميل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const INITIAL_MENU = [
            { id: '1', name: 'تريبل زلازل برجر', category: 'البرجر 🍔', price: 140, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80', calories: '850 Cal' },
            { id: '2', name: 'بيتزا رانش دجاج', category: 'البيتزا 🍕', price: 110, image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80', calories: '620 Cal' }
        ];

        function CustomerApp() {
            const [menuItems, setMenuItems] = useState([]);
            const [activeCategory, setActiveCategory] = useState('الكل');

            useEffect(() => {
                const loadMenu = () => {
                    const saved = localStorage.getItem('nexus_menu_items');
                    if (saved) {
                        setMenuItems(JSON.parse(saved));
                    } else {
                        setMenuItems(INITIAL_MENU);
                        localStorage.setItem('nexus_menu_items', JSON.stringify(INITIAL_MENU));
                    }
                };

                loadMenu();
                // تحديث تلقائي لو حصل تغيير من صفحة الإدارة
                window.addEventListener('storage', loadMenu);
                return () => window.removeEventListener('storage', loadMenu);
            }, []);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#0b1320] text-slate-100 flex flex-col p-4 shadow-2xl border-x border-slate-800">
                    <header className="flex items-center justify-between pb-4 border-b border-slate-800 mb-5">
                        <div className="flex items-center gap-2">
                            <span className="text-purple-400 text-xl">🍽️</span>
                            <h1 className="font-bold text-base text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
                                قائمة العميل (Menu)
                            </h1>
                        </div>
                        <a href="admin.html" className="text-xs bg-slate-800 hover:bg-slate-700 text-purple-400 px-3 py-1.5 rounded-lg border border-slate-700 transition-all font-bold">
                            <i className="fa-solid fa-gear ml-1"></i> لوحة الإدارة
                        </a>
                    </header>

                    {/* Table Info */}
                    <div className="glass-panel p-3 rounded-xl flex items-center justify-between border border-purple-500/30 mb-4 text-xs">
                        <span className="bg-purple-500/20 text-purple-300 px-2.5 py-1 rounded font-bold">ترابيزة رقم 2 📍</span>
                        <span className="text-slate-400">تحديث لحظي من الإدارة ✨</span>
                    </div>

                    {/* Categories */}
                    <div className="flex gap-2 overflow-x-auto pb-3">
                        {['الكل', 'البرجر 🍔', 'البيتزا 🍕', 'الأسماك 🐟'].map(cat => (
                            <button
                                key={cat}
                                onClick={() => setActiveCategory(cat)}
                                className={`px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeCategory === cat ? 'bg-gradient-to-r from-purple-500 to-pink-600 text-white shadow-lg' : 'bg-slate-900 border border-slate-800 text-slate-400'}`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Menu Items Grid */}
                    <div className="grid grid-cols-2 gap-3 mt-2">
                        {menuItems
                            .filter(item => activeCategory === 'الكل' || item.category === activeCategory)
                            .map(item => (
                                <div key={item.id} className="bg-slate-900/90 rounded-2xl border border-slate-800 overflow-hidden flex flex-col justify-between">
                                    <div className="relative">
                                        <img src={item.image} alt={item.name} className="w-full h-28 object-cover" />
                                        {item.calories && (
                                            <span className="absolute top-2 left-2 bg-slate-950/80 text-amber-400 text-[10px] px-2 py-0.5 rounded-full font-bold">
                                                {item.calories}
                                            </span>
                                        )}
                                    </div>
                                    <div className="p-3 flex-1 flex flex-col justify-between space-y-2">
                                        <div>
                                            <h4 className="font-bold text-xs text-slate-100 truncate">{item.name}</h4>
                                            <p className="text-[10px] text-slate-400 mt-0.5">{item.category}</p>
                                        </div>
                                        <div className="flex items-center justify-between pt-1">
                                            <span className="font-extrabold text-cyan-400 text-xs">{item.price} ج.م</span>
                                            <button className="bg-gradient-to-r from-purple-500 to-pink-600 text-white px-2.5 py-1 rounded-lg text-xs">
                                                <i className="fa-solid fa-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<CustomerApp />);
    </script>
</body>
</html>
