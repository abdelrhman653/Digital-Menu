<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو الرقمي الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-glass: rgba(22, 31, 49, 0.75);
            --accent-neon: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ff0055;
            --green-glow: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table-badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* الأقسام */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 15px;
            white-space: nowrap;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-neon));
            color: white;
            border-color: transparent;
        }

        /* الأصناف */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .badge-discount {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .card-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 10px;
        }

        .current-price {
            color: var(--green-glow);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .old-price {
            color: var(--text-sub);
            text-decoration: line-through;
            font-size: 0.8rem;
        }

        .add-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* السلة */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent-neon);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .cart-count { font-size: 0.8rem; color: var(--text-sub); display: block; }
        .cart-total { font-size: 1.2rem; font-weight: 900; color: var(--green-glow); }

        .send-order-btn {
            background: linear-gradient(135deg, var(--accent-neon), #0072ff);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* النافذة المنبثقة الشيك */
        .custom-popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-popup-overlay.active { opacity: 1; pointer-events: all; }

        .custom-popup {
            background: #0f172a;
            border: 1px solid var(--accent-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            border-radius: 24px; padding: 25px;
            width: 85%; max-width: 360px; text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-popup-overlay.active .custom-popup { transform: scale(1); }
        .popup-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .popup-title { font-weight: 900; font-size: 1.2rem; color: #fff; margin-bottom: 8px; }
        .popup-msg { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
        .popup-btn {
            background: linear-gradient(135deg, var(--accent-neon), #0072ff);
            color: #000; border: none; padding: 10px 25px;
            border-radius: 12px; font-weight: 900; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">NEXUS MENU ⚡</div>
        <div class="table-badge" id="tableDisplay">ترابيزة رقم --</div>
    </header>

    <div class="categories">
        <button class="cat-btn active">🔥 الأكثر طلباً</button>
        <button class="cat-btn">🍔 البرجر</button>
        <button class="cat-btn">🍕 البيتزا</button>
        <button class="cat-btn">🥤 المشروبات</button>
    </div>

    <div class="menu-grid" id="menuGrid"></div>

    <div class="cart-bar">
        <div>
            <span class="cart-count" id="cartCount">0 أصناف مختارة</span>
            <span class="cart-total" id="cartTotal">0 ج.م</span>
        </div>
        <button class="send-order-btn" onclick="sendOrder()">إرسال الطلب 🚀</button>
    </div>

    <!-- نافذة التنبيه -->
    <div class="custom-popup-overlay" id="popupOverlay">
        <div class="custom-popup">
            <div class="popup-icon" id="popupIcon">🚀</div>
            <div class="popup-title" id="popupTitle">تنبيه</div>
            <div class="popup-msg" id="popupMsg">...</div>
            <button class="popup-btn" onclick="closePopup()">حسناً</button>
        </div>
    </div>

    <script>
        const items = [
            { id: 1, name: "تربل زلازل برجر", price: 140, oldPrice: 180, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 2, name: "بيتزا رانش دجاج", price: 110, oldPrice: 135, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" },
            { id: 3, name: "كشري أسطوري سبيشال", price: 40, oldPrice: 0, img: "https://images.unsplash.com/photo-1543353071-10c8ba85a904?w=400" },
            { id: 4, name: "موهيتو بلو نيون", price: 35, oldPrice: 50, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400" }
        ];

        let cart = [];

        // قرائة الترابيزة من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || '1';
        document.getElementById('tableDisplay').innerText = `ترابيزة رقم ${tableNumber}`;

        function showPopup(title, msg, icon = "✅") {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMsg').innerText = msg;
            document.getElementById('popupIcon').innerText = icon;
            document.getElementById('popupOverlay').classList.add('active');
        }

        function closePopup() {
            document.getElementById('popupOverlay').classList.remove('active');
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                let discountHtml = '';
                let priceHtml = `<span class="current-price">${item.price} ج.م</span>`;

                if(item.oldPrice > item.price) {
                    let discountPercent = Math.round(((item.oldPrice - item.price) / item.oldPrice) * 100);
                    discountHtml = `<div class="badge-discount">خصم %${discountPercent}</div>`;
                    priceHtml = `
                        <span class="current-price">${item.price} ج.م</span>
                        <span class="old-price">${item.oldPrice} ج.م</span>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${discountHtml}
                    <img src="${item.img}" class="card-img" alt="${item.name}">
                    <div class="card-title">${item.name}</div>
                    <div class="price-box">${priceHtml}</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">+ إضافة للسلة</button>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = items.find(i => i.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = `${cart.length} أصناف مختارة`;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = `${total} ج.م`;
        }

        function sendOrder() {
            if(cart.length === 0) {
                showPopup("السلة فارغة!", "من فضلك أضف بعض الأصناف لسلتك أولاً.", "⚠️");
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const newOrder = {
                id: Date.now(),
                table: tableNumber,
                time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                items: [...cart],
                total: total
            };

            // حفظ الطلب للسيرفر / المطبخ
            let orders = JSON.parse(localStorage.getItem('nexus_orders') || '[]');
            orders.push(newOrder);
            localStorage.setItem('nexus_orders', JSON.stringify(orders));

            cart = [];
            updateCartUI();

            showPopup(
                "تم إرسال الطلب بنجاح! 🚀", 
                `أوردرك من (ترابيزة ${tableNumber}) وصل للمطبخ وجاري التحضير الآن.`, 
                "🎉"
            );
        }

        renderMenu();
    </script>
</body>
</html>
