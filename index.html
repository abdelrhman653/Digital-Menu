<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة والذكاء الاصطناعي - المنصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة توليد أكواد الـ QR حقيقية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --ai-gradient: linear-gradient(135deg, #4A00E0 0%, #8E2DE2 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 50px; }
        
        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 18px; font-weight: 700; }
        
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        
        .card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        
        /* قسم الذكاء الاصطناعي */
        .ai-card {
            background: linear-gradient(145deg, #1A1F2C 0%, #121620 100%);
            border: 1px solid #4A00E0;
            text-align: center;
        }
        .ai-btn {
            background: var(--ai-gradient);
            color: var(--white);
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            transition: 0.3s;
        }
        .ai-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* الأزرار العامة */
        .btn {
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            font-size: 15px;
        }
        .btn-success { background: var(--secondary); color: #000; }
        
        input, select {
            width: 100%;
            background: #0D1117;
            border: 1px solid var(--border);
            color: var(--white);
            padding: 12px;
            border-radius: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        /* إدارة الأصناف الحالية */
        .item-row {
            background: #1C2128;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-info img { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; }
        .item-name { font-weight: 700; font-size: 14px; }
        .item-price { color: var(--secondary); font-size: 13px; font-weight: 600; margin-top: 3px; }
        
        .delete-btn {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }

        /* توليد الـ QR للترابيزات */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .qr-box {
            background: #0D1117;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        .qr-img-container {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .table-link {
            color: var(--secondary);
            font-size: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 8px;
            font-weight: 600;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ لوحة الإدارة (Admin)</h1>
        <a href="orders.html?restaurant=abdo" target="_blank" class="btn" style="width: auto; padding: 8px 14px; font-size: 13px;"><i class="fa-solid fa-eye"></i> معاينة المنيو</a>
    </header>

    <div class="container">
        
        <!-- 1. استخراج المنيو بالذكاء الاصطناعي من صورة -->
        <div class="card ai-card">
            <h3><i class="fa-solid fa-wand-magic-sparkles"></i> استخراج المنيو بالذكاء الاصطناعي</h3>
            <p style="color: var(--gray); font-size: 13px; margin: 8px 0 15px;">ارفع صورة منيو مطعمك القديم، وسيقوم النظام باستخراج الأصناف وتحديث قائمة العملاء تلقائياً.</p>
            
            <input type="file" id="oldMenuImageInput" accept="image/*" style="display: none;" onchange="processAIImage(event)">
            <button class="ai-btn" onclick="document.getElementById('oldMenuImageInput').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i> رفع صورة المنيو القديم
            </button>
            <div id="aiLoading" class="hidden" style="margin-جوت: 10px; color: var(--secondary); font-size: 13px;">
                <i class="fa-solid fa-spinner fa-spin"></i> جاري تحليل الصورة واستخراج الأصناف بالذكاء الاصطناعي...
            </div>
        </div>

        <!-- إضافة صنف جديد يدوياً -->
        <div class="card">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-plus-circle" style="color: var(--primary);"></i> إضافة صنف جديد للقائمة</h3>
            <label>اسم الصنف:</label>
            <input type="text" id="newItemName" placeholder="مثال: برجر دجاج سبايسي">
            
            <label>السعر الأساسي (ج.م):</label>
            <input type="number" id="newItemPrice" placeholder="120">
            
            <label>صورة الصنف (رابط أو رفع ملف):</label>
            <input type="text" id="newItemImg" placeholder="https://images.unsplash.com/...">
            
            <button class="btn" onclick="addNewItem()"><i class="fa-solid fa-rocket"></i> إضافة الصنف للمنيو</button>
        </div>

        <!-- 2. إدارة الأصناف الحالية -->
        <div class="card">
            <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-clipboard-list" style="color: var(--primary);"></i> إدارة الأصناف الحالية (<span id="itemsCount">0</span>)</h3>
            <div id="currentItemsList">
                <!-- الأصناف ستظهر هنا ديناميكياً -->
            </div>
        </div>

        <!-- 3. مولد QR كود للترابيزات -->
        <div class="card">
            <h3><i class="fa-solid fa-qrcode" style="color: var(--primary);"></i> مولد QR كود للترابيزات</h3>
            <label>عدد ترابيزات المطعم:</label>
            <input type="number" id="tablesCountInput" value="2" min="1" oninput="generateTablesQR()">
            
            <div id="qrResultsContainer" class="qr-grid">
                <!-- سيتم توليد الأكواد هنا تلقائياً -->
            </div>
        </div>

    </div>

    <script>
        // قاعدة بيانات محلية للأصناف
        let menuItems = JSON.parse(localStorage.getItem('admin_menu_items')) || [
            { id: 1, name: "وجبة شاورما دابل", price: 130, img: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=500" },
            { id: 2, name: "بيتزا مكس جبن", price: 125, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" }
        ];

        window.onload = function() {
            renderItems();
            generateTablesQR();
        }

        // دالة محاكاة رفع صورة المنيو القديم بالذكاء الاصطناعي
        function processAIImage(event) {
            let file = event.target.files[0];
            if(!file) return;
            
            let loading = document.getElementById('aiLoading');
            loading.classList.remove('hidden');

            setTimeout(() => {
                loading.classList.add('hidden');
                // إضافة أصناف افتراضية مستخرجة من الصورة كمثال واقعي
                menuItems.push(
                    { id: Date.now(), name: "وجبة كينج برجر (مستخرجة بالذكاء الاصطناعي)", price: 175, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
                    { id: Date.now() + 1, name: "تشيكن رويال (مستخرجة بالذكاء الاصطناعي)", price: 160, img: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=500" }
                );
                saveAndRender();
                alert('تم تحليل صورة المنيو القديم واستخراج الأصناف وإضافتها بنجاح!');
            }, 2000);
        }

        function addNewItem() {
            let name = document.getElementById('newItemName').value;
            let price = document.getElementById('newItemPrice').value;
            let img = document.getElementById('newItemImg').value || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500";

            if(!name || !price) {
                alert('الرجاء إدخال اسم الصنف والسعر!');
                return;
            }

            menuItems.push({ id: Date.now(), name, price: Number(price), img });
            saveAndRender();

            document.getElementById('newItemName').value = '';
            document.getElementById('newItemPrice').value = '';
            document.getElementById('newItemImg').value = '';
        }

        function deleteItem(id) {
            menuItems = menuItems.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('admin_menu_items', JSON.stringify(menuItems));
            renderItems();
        }

        function renderItems() {
            let listContainer = document.getElementById('currentItemsList');
            document.getElementById('itemsCount').innerText = menuItems.length;
            
            if(menuItems.length === 0) {
                listContainer.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 15px;">لا توجد أصناف حالياً.</p>`;
                return;
            }

            let html = '';
            menuItems.forEach(item => {
                html += `
                    <div class="item-row">
                        <div class="item-info">
                            <img src="${item.img}" alt="${item.name}">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">${item.price} ج.م</div>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id})"><i class="fa-solid fa-trash-can"></i> حذف</button>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // توليد الـ QR الحقيقي لكل ترابيزة
        function generateTablesQR() {
            let count = parseInt(document.getElementById('tablesCountInput').value) || 2;
            let container = document.getElementById('qrResultsContainer');
            container.innerHTML = '';

            let baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

            for(let i = 1; i <= count; i++) {
                let tableUrl = `${baseUrl}orders.html?restaurant=abdo&table=${i}`;
                
                let box = document.createElement('div');
                box.className = 'qr-box';
                box.innerHTML = `
                    <div style="font-weight: 700; font-size: 14px; margin-bottom: 5px;">ترابيزة ${i}</div>
                    <div class="qr-img-container" id="qrcode-${i}"></div>
                    <a href="${tableUrl}" target="_blank" class="table-link"><i class="fa-solid fa-link"></i> فتح الرابط</a>
                `;
                container.appendChild(box);

                // توليد كود الـ QR الفعلي داخل العنصر
                new QRCode(document.getElementById(`qrcode-${i}`), {
                    text: tableUrl,
                    width: 110,
                    height: 110,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }
    </script>
</body>
</html>
