<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Shop | طلب الطعام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DELIVERY_FEE = 40; // خدمة التوصيل للديليفري
        const SERVICE_RATE = 0.12; // خدمة الصالة 12%

        // قائمة الأصناف
        const INITIAL_MENU = [
            { id: 1, name: "برجر كلاسيك سينجل", price: 120, category: "برجر", image: "🍔", description: "شريحة لحم بقر مشوي مع صوص كلاسيك وخس وطماطم" },
            { id: 2, name: "برجر دبل تشيز", price: 175, category: "برجر", image: "🧀", description: "شريحتين لحم مع طبقات جبنة شيدر صريحة" },
            { id: 3, name: "تيكن كريسبي ساندوتش", price: 110, category: "دجاج", image: "🍗", description: "صدر دجاج مقرمش مع صوص المايونيز والماسترد" },
            { id: 4, name: "بطاطس فارم فريتس", price: 45, category: "مقبلات", image: "🍟", description: "بطاطس مقرمشة مبهرة" },
            { id: 5, name: "كوكاكولا كانز", price: 25, category: "مشروبات", image: "🥤", description: "مشروب غازي منعش 330 مل" }
        ];

        function App() {
            const [cart, setCart] = useState([]);
            const [tableNum, setTableNum] = useState(null); // رقم الترابيزة من الرابط إن وجد
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [customerAddress, setCustomerAddress] = useState('');
            const [currentOrder, setCurrentOrder] = useState(null);

            // تحديد نوع الطلب تلقائياً حسب الرابط
            useEffect(() => {
                const queryParams = new URLSearchParams(window.location.search);
                const table = queryParams.get('table');
                if (table) {
                    setTableNum(table); // العميل داخل من QR code ترابيزة
                }

                const activeOrder = JSON.parse(localStorage.getItem('nexus_active_order') || 'null');
                if (activeOrder) {
                    setCurrentOrder(activeOrder);
                }
            }, []);

            // المتابعة الحية لحالة الطلب
            useEffect(() => {
                if (!currentOrder) return;
                const interval = setInterval(() => {
                    const allKitchenOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                    const match = allKitchenOrders.find(o => o.id === currentOrder.id);
                    if (match) {
                        setCurrentOrder(match);
                        localStorage.setItem('nexus_active_order', JSON.stringify(match));
                    }
                }, 1500);
                return () => clearInterval(interval);
            }, [currentOrder]);

            const addToCart = (product) => {
                const exist = cart.find(x => x.id === product.id);
                if (exist) {
                    setCart(cart.map(x => x.id === product.id ? { ...exist, quantity: exist.quantity + 1 } : x));
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
            };

            const removeFromCart = (productId) => {
                const exist = cart.find(x => x.id === productId);
                if (exist.quantity === 1) {
                    setCart(cart.filter(x => x.id !== productId));
                } else {
                    setCart(cart.map(x => x.id === productId ? { ...exist, quantity: exist.quantity - 1 } : x));
                }
            };

            const isDelivery = !tableNum; // لو مفيش رقم ترابيزة يبقى أونلاين ديليفري
            const itemsSubtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            const extraFee = isDelivery ? DELIVERY_FEE : Math.round(itemsSubtotal * SERVICE_RATE);
            const grandTotal = itemsSubtotal + extraFee;

            const handleSendOrder = () => {
                if (cart.length === 0) return alert('السلة فارغة!');

                if (isDelivery && (!customerName || !customerPhone || !customerAddress)) {
                    return alert('يرجى كتابة الاسم ورقم الهاتف والعنوان بالكامل لاستلام الديليفري!');
                }

                const newOrder = {
                    id: Date.now(),
                    tableNumber: isDelivery ? 'طلب توصيل (ديليفري)' : `طاولة ${tableNum}`,
                    customerInfo: isDelivery ? { name: customerName, phone: customerPhone, address: customerAddress } : null,
                    items: cart,
                    subtotal: itemsSubtotal,
                    extraFee: extraFee,
                    feeType: isDelivery ? 'خدمة توصيل' : 'خدمة صالة (12%)',
                    totalPrice: grandTotal,
                    status: 'pending',
                    time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                };

                const existingOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify([newOrder, ...existingOrders]));

                setCurrentOrder(newOrder);
                localStorage.setItem('nexus_active_order', JSON.stringify(newOrder));
                setCart([]);
            };

            const handleCancelOrder = () => {
                if (!currentOrder) return;
                const existingOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                const updatedOrders = existingOrders.map(o => o.id === currentOrder.id ? { ...o, status: 'cancelled' } : o);
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updatedOrders));
                
                const cancelled = { ...currentOrder, status: 'cancelled' };
                setCurrentOrder(cancelled);
                localStorage.setItem('nexus_active_order', JSON.stringify(cancelled));
            };

            return (
                <div className="max-w-md mx-auto p-4 space-y-6">
                    {/* Header */}
                    <header className="flex justify-between items-center bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                        <div>
                            <h1 className="text-lg font-black text-slate-100 flex items-center gap-2">
                                <span>Abdo Shop</span> 🍔
                            </h1>
                            <p className="text-[10px] text-slate-400">أطيب المأكولات وأسرع خدمة</p>
                        </div>
                        <span className="text-xs px-3 py-1.5 rounded-xl bg-pink-500/10 text-pink-400 border border-pink-500/20 font-bold">
                            {tableNum ? `🍽️ طاولة #${tableNum}` : '🛵 طلب أونلاين'}
                        </span>
                    </header>

                    {/* متابعة الأوردر المباشر */}
                    {currentOrder && (
                        <div className="glass-card rounded-2xl p-4 space-y-3 border border-pink-500/30 bg-pink-500/5">
                            <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                                <span className="text-xs font-bold text-slate-200">حالة أوردرك الحالي</span>
                                <span className="text-xs font-mono text-slate-400">#{String(currentOrder.id).slice(-6)}</span>
                            </div>

                            <div className="text-center py-2">
                                {currentOrder.status === 'pending' && <p className="text-amber-400 font-bold text-sm">⏳ قيد التحضير في المطبخ...</p>}
                                {currentOrder.status === 'ready' && <p className="text-cyan-400 font-bold text-sm">🍳 الأوردر جاهز الآن!</p>}
                                {currentOrder.status === 'out_for_delivery' && <p className="text-purple-400 font-bold text-sm">🏃 الأوردر خرج مع الطيار للتوصيل!</p>}
                                {currentOrder.status === 'delivered' && <p className="text-emerald-400 font-bold text-sm">✅ تم تسليم الأوردر.. وبالهناء والشفاء!</p>}
                                {currentOrder.status === 'cancelled' && <p className="text-rose-400 font-bold text-sm">❌ تم إلغاء هذا الطلب</p>}
                            </div>

                            {currentOrder.status === 'pending' && (
                                <button onClick={handleCancelOrder} className="w-full py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition-all">
                                    إلغاء الطلب
                                </button>
                            )}
                        </div>
                    )}

                    {/* طلب بيانات العميل فقط إذا كان أونلاين ديليفري */}
                    {isDelivery ? (
                        <div className="bg-slate-900/60 p-3.5 rounded-2xl border border-slate-800/80 space-y-2">
                            <p className="text-xs font-bold text-pink-400 flex items-center gap-1.5">
                                <i className="fa-solid fa-truck-fast"></i> بيانات التوصيل للديليفري:
                            </p>
                            <input 
                                type="text" 
                                value={customerName} 
                                onChange={(e) => setCustomerName(e.target.value)} 
                                placeholder="الاسم بالكامل" 
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500"
                            />
                            <input 
                                type="tel" 
                                value={customerPhone} 
                                onChange={(e) => setCustomerPhone(e.target.value)} 
                                placeholder="رقم الموبايل" 
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500"
                            />
                            <textarea 
                                value={customerAddress} 
                                onChange={(e) => setCustomerAddress(e.target.value)} 
                                placeholder="العنوان بالتفصيل (الشارع، الدور، رقم الشقة)..." 
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500 h-16 resize-none"
                            ></textarea>
                        </div>
                    ) : (
                        <div className="bg-emerald-500/10 border border-emerald-500/30 p-3 rounded-2xl text-center">
                            <p className="text-xs font-bold text-emerald-400">أهلاً بك! أنت تجلس حالياً على طاولة رقم #{tableNum}</p>
                            <p className="text-[10px] text-slate-400 mt-0.5">اطلب مباشرة وسيصل الطلب لطاولتك فور تحضيره</p>
                        </div>
                    )}

                    {/* المنيو */}
                    <div className="space-y-3">
                        <h2 className="text-sm font-extrabold text-slate-200">المنيو 📜</h2>
                        <div className="space-y-2.5">
                            {INITIAL_MENU.map((item) => (
                                <div key={item.id} className="glass-card rounded-2xl p-3 flex items-center justify-between gap-3">
                                    <div className="text-3xl bg-slate-800/60 p-2 rounded-xl">{item.image}</div>
                                    <div className="flex-1">
                                        <h3 className="text-xs font-bold text-slate-100">{item.name}</h3>
                                        <p className="text-[10px] text-slate-400 line-clamp-1">{item.description}</p>
                                        <span className="text-xs font-black text-pink-400 mt-1 block">{item.price} ج.م</span>
                                    </div>
                                    <button 
                                        onClick={() => addToCart(item)}
                                        className="w-8 h-8 rounded-xl bg-pink-500/20 text-pink-400 hover:bg-pink-500 hover:text-white font-bold flex items-center justify-center transition-all"
                                    >
                                        +
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* سلة المشتريات */}
                    {cart.length > 0 && (
                        <div className="glass-card rounded-2xl p-4 space-y-3 border border-pink-500/40">
                            <h3 className="text-xs font-black text-slate-100 border-b border-slate-800 pb-2">سلة طلباتك 🛒</h3>
                            
                            <div className="space-y-2">
                                {cart.map(item => (
                                    <div key={item.id} className="flex justify-between items-center text-xs">
                                        <span className="text-slate-300 font-medium">{item.name}</span>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => removeFromCart(item.id)} className="w-5 h-5 bg-slate-800 rounded text-slate-300 font-bold">-</button>
                                            <span className="font-bold text-pink-400">{item.quantity}</span>
                                            <button onClick={() => addToCart(item)} className="w-5 h-5 bg-slate-800 rounded text-slate-300 font-bold">+</button>
                                            <span className="w-12 text-left font-mono">{item.price * item.quantity} ج</span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* حساب الرسوم بناءً على رابط الدخول */}
                            <div className="pt-2 border-t border-slate-800 text-xs space-y-1.5">
                                <div className="flex justify-between text-slate-400">
                                    <span>مجموع الأصناف:</span>
                                    <span>{itemsSubtotal} ج.م</span>
                                </div>

                                {isDelivery ? (
                                    <div className="flex justify-between text-amber-400 font-bold">
                                        <span>🛵 مصاريف توصيل (ديليفري):</span>
                                        <span>+{DELIVERY_FEE} ج.م</span>
                                    </div>
                                ) : (
                                    <div className="flex justify-between text-amber-400 font-bold">
                                        <span>🍽️ خدمة صالة (12%):</span>
                                        <span>+{extraFee} ج.م</span>
                                    </div>
                                )}

                                <div className="flex justify-between text-sm font-black text-cyan-400 pt-1 border-t border-slate-800/80">
                                    <span>الإجمالي النهائي:</span>
                                    <span>{grandTotal} ج.م</span>
                                </div>
                            </div>

                            <button 
                                onClick={handleSendOrder}
                                className="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-black text-xs rounded-xl shadow-lg transition-all"
                            >
                                تأكيد وإرسال الطلب 🚀
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
