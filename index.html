<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إشراف مطاعم Abdo</title>
    <!-- مكتبة لإنشاء الـ QR Code -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: Tahoma, sans-serif; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-bold text-yellow-400">⚡ لوحة الإدارة</h1>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">خروج</button>
    </div>

    <!-- الأزرار الرئيسية -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <button onclick="openKitchen()" class="bg-green-600 p-3 rounded-lg font-bold text-center">شاشة المطبخ</button>
        <button onclick="openMenu()" class="bg-red-500 p-3 rounded-lg font-bold text-center">المنيو أونلاين</button>
    </div>

    <!-- إضافة صنف جديد -->
    <div class="bg-slate-800 p-4 rounded-xl mb-6 border border-slate-700">
        <h2 class="text-lg font-bold mb-3 text-red-400">➕ إضافة صنف جديد للقائمة</h2>
        <input type="text" id="itemName" placeholder="اسم الصنف (مثال: برجر دابل)" class="w-full p-2 mb-3 bg-slate-900 border border-slate-700 rounded text-white">
        <select id="itemCategory" class="w-full p-2 mb-3 bg-slate-900 border border-slate-700 rounded text-white">
            <option value="وجبات">وجبات</option>
            <option value="مشروبات">مشروبات</option>
            قبلات ومقبلات
            <option value="حلويات">حلويات</option>
        </select>
        <input type="number" id="itemPrice" placeholder="السعر (ج.م)" class="w-full p-2 mb-3 bg-slate-900 border border-slate-700 rounded text-white">
        <button onclick="addItem()" class="w-full bg-red-500 hover:bg-red-600 text-white p-2 rounded-lg font-bold">🚀 إضافة الصنف للمنيو</button>
    </div>

    <!-- إدارة الأصناف الحالية -->
    <div class="bg-slate-800 p-4 rounded-xl mb-6 border border-slate-700">
        <h2 class="text-lg font-bold mb-3 text-red-400">📋 إدارة الأصناف الحالية (<span id="itemsCount">0</span>)</h2>
        <div id="itemsList" class="space-y-2 max-h-40 overflow-y-auto">
            <!-- سيتم إدراج الأصناف هنا ديناميكياً -->
        </div>
    </div>

    <!-- مولد QR كود للترابيزات -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <h2 class="text-lg font-bold mb-3 text-red-400">📱 مولد QR كود للترابيزات</h2>
        <input type="number" id="tableNum" placeholder="رقم أو عدد الترابيزات" class="w-full p-2 mb-3 bg-slate-900 border border-slate-700 rounded text-white">
        <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg font-bold mb-3">توليد الـ QR</button>
        <div id="qrcode" class="flex justify-center bg-white p-2 rounded"></div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('restaurant_items')) || [];

        function renderItems() {
            const list = document.getElementById('itemsList');
            const count = document.getElementById('itemsCount');
            list.innerHTML = '';
            count.innerText = items.length;

            if (items.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-sm text-center">لا توجد أصناف مضافة حالياً</p>';
                return;
            }

            items.forEach((item, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700 text-sm">
                        <span>${item.name} - ${item.price} ج.م (${item.category})</span>
                        <button onclick="deleteItem(${index})" class="text-red-400 hover:text-red-600 font-bold px-2">حذف</button>
                    </div>
                `;
            });
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const price = document.getElementById('itemPrice').value;

            if (!name || !price) {
                alert("الرجاء إدخال اسم الصنف والسعر بشكل صحيح!");
                return;
            }

            items.push({ name, category, price });
            localStorage.setItem('restaurant_items', JSON.stringify(items));
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            renderItems();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            localStorage.setItem('restaurant_items', JSON.stringify(items));
            renderItems();
        }

        function generateQR() {
            const val = document.getElementById('tableNum').value;
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            if (!val) {
                alert("يرجى إدخال رقم الترابيزة أولاً");
                return;
            }
            new QRCode(qrContainer, {
                text: window.location.href + "?table=" + val,
                width: 128,
                height: 128
            });
        }

        function logout() {
            localStorage.removeItem('restaurant_items');
            window.location.reload();
        }

        function openKitchen() {
            alert("تم الانتقال لشاشة المطبخ (جارٍ تطوير الشاشة)");
        }

        function openMenu() {
            alert("تم الانتقال للمنيو أونلاين");
        }

        // تحميل الأصناف عند فتح الصفحة
        renderItems();
    </script>
</body>
</html>
