<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Shop - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area i { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
        .logo-area h1 { font-size: 20px; font-weight: 900; }
        .logo-area p { color: var(--gray); font-size: 12px; margin-top: 5px; }

        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 12px; color: var(--gray); margin-bottom: 6px; font-weight: 600; }
        .form-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: var(--white);
            font-size: 13px;
        }
        .form-input:focus { border-color: var(--primary); outline: none; }

        .submit-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: var(--white);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* نافذة الرسائل المخصصة (Modal) */
        .custom-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .custom-modal-content {
            background: var(--dark-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 320px; text-align: center;
        }
        .custom-modal-text { font-size: 13px; margin-bottom: 20px; color: var(--white); line-height: 1.6; }
        .custom-modal-btns { display: flex; gap: 10px; }
        .custom-modal-btn {
            flex: 1; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; border: none;
        }
        .modal-btn-confirm { background: var(--primary); color: var(--white); }
        .modal-btn-cancel { background: var(--dark-bg); color: var(--gray); border: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <i class="fa-solid fa-store"></i>
            <h1 id="mainTitle">Abdo Shop</h1>
            <p>سجل بياناتك للبدء في طلبات المطعم</p>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label class="form-label">اسم المطعم / المتجر</label>
                <input type="text" id="restaurantName" class="form-input" value="Abdo Shop" required>
            </div>
            <div class="form-group">
                <label class="form-label">اسم العميل</label>
                <input type="text" id="clientName" class="form-input" placeholder="أدخل اسمك الكريم" required>
            </div>
            <div class="form-group">
                <label class="form-label">رقم الهاتف</label>
                <input type="tel" id="clientPhone" class="form-input" placeholder="01xxxxxxxxx" required>
            </div>
            <button type="submit" class="submit-btn">دخول إلى المنيو والطلب <i class="fa-solid fa-arrow-left"></i></button>
        </form>
    </div>

    <!-- نافذة منسدلة مخصصة للرسائل -->
    <div id="customModal" class="custom-modal">
        <div class="custom-modal-content">
            <div id="modalText" class="custom-modal-text">رسالة تنبيه</div>
            <div id="modalBtns" class="custom-modal-btns">
                <button class="custom-modal-btn modal-btn-confirm" onclick="closeModal(true)">حسناً</button>
            </div>
        </div>
    </div>

    <script>
        function showCustomAlert(text, callback = null) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalBtns').innerHTML = `<button class="custom-modal-btn modal-btn-confirm" onclick="closeModal(true)">حسناً</button>`;
            document.getElementById('customModal').style.display = 'flex';
            window.modalCallback = callback;
        }
        function closeModal(val) {
            document.getElementById('customModal').style.display = 'none';
            if(window.modalCallback) window.modalCallback(val);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';

        window.onload = function() {
            let saved = JSON.parse(localStorage.getItem(`client_${restaurant}`));
            if(saved) {
                document.getElementById('restaurantName').value = saved.restaurantName || 'Abdo Shop';
                document.getElementById('clientName').value = saved.name || '';
                document.getElementById('clientPhone').value = saved.phone || '';
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            let data = {
                restaurantName: document.getElementById('restaurantName').value.trim(),
                name: document.getElementById('clientName').value.trim(),
                phone: document.getElementById('clientPhone').value.trim()
            };
            localStorage.setItem(`client_${restaurant}`, JSON.stringify(data));
            window.location.href = `menu.html?restaurant=${restaurant}`;
        }
    </script>
</body>
</html>
