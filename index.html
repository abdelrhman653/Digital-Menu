<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdo Shop - المنيو والطلب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: {
                        brand: { dark: '#0b1320', card: '#1e293b', pink: '#ec4899', cyan: '#06b6d4', amber: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-28">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEFAULT_MENU = [
            { id: 1, name: "Chicken Royale", price: 160, category: "البرجر", calories: "Cal 440", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { id: 2, name: "Chicken Whopper", price: 175, category: "البرجر", calories: "Cal 430", image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500" },
            { id: 3, name: "Chicken Burger", price: 120, category: "البرجر", calories: "Cal 390", image: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=500" },
            { id: 4, name: "Chicken Royale Steakhouse", price: 210, category: "البرجر", calories: "Cal 850", image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=500" },
            { id: 5, name: "Crunchy Chicken", price: 170, category: "البرجر", calories: "Cal 670", image: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=500" },
            { id: 6, name: "Big Fish Burger", price: 155, category: "الأسماك", calories: "Cal 515", image: "https://images.unsplash.com/photo-1521305916504-4a1121188589?w=500" }
        ];

        const DELIVERY_FEE = 40;
        const SERVICE_PERCENTAGE = 0.12;

        function MainApp() {
            const [menuItems, setMenuItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('الكل');
            
            const [orderType, setOrderType] = useState('delivery'); 
            const [tableNumber, setTableNumber] = useState('');
            
            const [customerInfo, setCustomerInfo] = useState({
                name: localStorage.getItem('abdo_shop_cust_name') || '',
                phone: localStorage.getItem('abdo_shop_cust_phone') || '',
                address: localStorage.getItem('abdo_shop_cust_address') || ''
            });

            const [activeOrder, setActiveOrder] = useState(null);
            const [successMsg, setSuccessMsg] = useState(false);
            const [showOrdersModal, setShowOrdersModal] = useState(false);
            const [allMyOrders, setAllMyOrders] = useState([]);

            const loadMenu = () => {
                const saved = localStorage.getItem('nexus_menu_items');
                if (saved) {
                    try { setMenuItems(JSON.parse(saved)); } catch(e) { setMenuItems(DEFAULT_MENU); }
                } else {
                    setMenuItems(DEFAULT_MENU);
                }
            };

            const syncOrderState = () => {
                const orders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                setAllMyOrders(orders);
                if (activeOrder) {
                    const current = orders.find(o => o.id === activeOrder.id);
                    if (current) {
                        setActiveOrder(current);
                    }
                }
            };

            useEffect(() => {
                loadMenu();
                
                const params = new URLSearchParams(window.location.search);
                const t = params.get('table');
                if (t) {
                    setTableNumber(`ترابيزة رقم ${t}`);
                    setOrderType('table');
                } else {
                    setOrderType('delivery');
                }

                const orders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                setAllMyOrders(orders);

                const interval = setInterval(() => {
                    loadMenu();
                    syncOrderState();
                }, 1500);

                return () => clearInterval(interval);
            }, []);

            const handleCustomerChange = (field, val) => {
                const updated = { ...customerInfo, [field]: val };
                setCustomerInfo(updated);
                localStorage.setItem(`abdo_shop_cust_${field}`, val);
            };

            const categories = ['الكل', ...new Set(menuItems.map(item => item.category || 'عام'))];
            const filteredItems = selectedCategory === 'الكل' ? menuItems : menuItems.filter(item => item.category === selectedCategory);

            const addToCart = (product) => {
                setCart(prev => {
                    const exist = prev.find(x => x.id === product.id);
                    if (exist) return prev.map(x => x.id === product.id ? { ...x, quantity: x.quantity + 1 } : x);
                    return [...prev, { ...product, quantity: 1 }];
                });
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(x => x.id !== id));

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const extraFee = orderType === 'delivery' ? DELIVERY_FEE : Math.round(subtotal * SERVICE_PERCENTAGE);
            const grandTotal = subtotal + (cart.length > 0 ? extraFee : 0);

            const submitOrder = () => {
                if (cart.length === 0) return alert('السلة فارغة!');
                if (orderType === 'delivery' && (!customerInfo.name || !customerInfo.phone || !customerInfo.address)) {
                    return alert('الرجاء إدخال بيانات التوصيل كاملة (الاسم، الموبايل، العنوان)');
                }

                const now = new Date();
                const newOrder = {
                    id: Date.now(),
                    tableNumber: orderType === 'delivery' ? 'طلب أونلاين 🛵' : tableNumber,
                    items: cart,
                    subtotal: subtotal,
                    extraFee: extraFee,
                    totalPrice: grandTotal,
                    status: 'pending', // يبدأ كـ قيد التحضير
                    date: now.toISOString().split('T')[0],
                    time: now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                    customerInfo: orderType === 'delivery' ? customerInfo : null
                };

                const existing = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                const updatedOrders = [newOrder, ...existing];
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updatedOrders));

                setActiveOrder(newOrder);
                setAllMyOrders(updatedOrders);
                setCart([]);
                setSuccessMsg(true);
                setTimeout(() => setSuccessMsg(false), 4000);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col p-4">
                    
                    {/* رأس الصفحة مع زرار "سجل طلباتي" */}
                    <div className="flex justify-between items-center bg-slate-900/90 border border-slate-800 p-3 rounded-2xl mb-4">
                        <div className="flex items-center gap-2">
                            <span className="text-base">📍</span>
                            <span className="text-xs font-extrabold text-brand-pink">
                                {orderType === 'table' ? tableNumber : 'طلب ديلفري أونلاين 🛵'}
                            </span>
                        </div>
                        <button 
                            onClick={() => setShowOrdersModal(true)}
                            className="bg-brand-cyan/20 border border-brand-cyan/40 text-brand-cyan px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 active:scale-95 shadow-sm">
                            <i className="fa-solid fa-clock-rotate-left"></i>
                            <span>سجل طلباتي</span>
                        </button>
                    </div>

                    {/* شريط حالة الطلب الأخير (يظهر فقط إذا قام العميل بطلب جديد في الجلسة الحالية) */}
                    {activeOrder && (
                        <div className="glass-card p-3.5 rounded-2xl mb-4 border border-brand-cyan/30 space-y-2.5 animate-fadeIn">
                            <div className="flex justify-between items-center text-xs">
                                <span className="font-bold text-slate-200">تتبع طلبك الحالي (#{activeOrder.id.toString().slice(-6)})</span>
                                <span className="text-slate-400 font-mono text-[10px]">{activeOrder.time}</span>
                            </div>

                            {/* مربعات الحالة الأربعة بدقة (قيد التحضير - جاهز - جاري الديلفري - تم التسليم) */}
                            <div className="grid grid-cols-4 gap-1 pt-1">
                                <div className={`py-1.5 px-0.5 rounded-lg text-center text-[10px] font-bold transition-all ${
                                    activeOrder.status === 'pending' 
                                    ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/30 scale-105' 
                                    : 'bg-slate-950/60 text-slate-500 border border-slate-800'
                                }`}>
                                    ⏳ قيد التحضير
                                </div>
                                <div className={`py-1.5 px-0.5 rounded-lg text-center text-[10px] font-bold transition-all ${
                                    activeOrder.status === 'ready' 
                                    ? 'bg-cyan-500 text-slate-950 shadow-lg shadow-cyan-500/30 scale-105' 
                                    : 'bg-slate-950/60 text-slate-500 border border-slate-800'
                                }`}>
                                    🔥 جاهز
                                </div>
                                <div className={`py-1.5 px-0.5 rounded-lg text-center text-[10px] font-bold transition-all ${
                                    activeOrder.status === 'out_for_delivery' 
                                    ? 'bg-blue-500 text-slate-950 shadow-lg shadow-blue-500/30 scale-105' 
                                    : 'bg-slate-950/60 text-slate-500 border border-slate-800'
                                }`}>
                                    ⚡ جاري التوصيل
                                </div>
                                <div className={`py-1.5 px-0.5 rounded-lg text-center text-[10px] font-bold transition-all ${
                                    activeOrder.status === 'delivered' 
                                    ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/30 scale-105' 
                                    : 'bg-slate-950/60 text-slate-500 border border-slate-800'
                                }`}>
                                    ✅ تم التسليم
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نموذج بيانات التوصيل */}
                    {orderType === 'delivery' && (
                        <div className="glass-card p-3.5 rounded-2xl mb-4 space-y-2.5">
                            <h3 className="text-xs font-black text-brand-cyan">🛵 بيانات التوصيل:</h3>
                            <input 
                                type="text" placeholder="الاسم بالكامل" 
                                value={customerInfo.name} 
                                onChange={(e) => handleCustomerChange('name', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-brand-pink"
                            />
                            <input 
                                type="tel" placeholder="رقم الموبايل (يتم حفظه تلقائياً)" 
                                value={customerInfo.phone} 
                                onChange={(e) => handleCustomerChange('phone', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100 font-mono focus:outline-none focus:border-brand-pink"
                            />
                            <textarea 
                                rows="2" placeholder="العنوان بالتفصيل..." 
                                value={customerInfo.address} 
                                onChange={(e) => handleCustomerChange('address', e.target.value)}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-100 focus:outline-none focus:border-brand-pink"
                            ></textarea>
                        </div>
                    )}

                    {successMsg && (
                        <div className="bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 p-2.5 rounded-xl mb-4 text-center text-xs font-bold animate-pulse">
                            🎉 تم إرسال طلبك بنجاح للمطبخ!
                        </div>
                    )}

                    {/* الفئات */}
                    <div className="flex gap-2 overflow-x-auto pb-3 mb-2">
                        {categories.map((cat, i) => (
                            <button key={i} onClick={() => setSelectedCategory(cat)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap ${selectedCategory === cat ? 'bg-brand-pink text-white shadow-lg' : 'bg-slate-900 border border-slate-800 text-slate-400'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* المنيو والأصناف */}
                    <div className="grid grid-cols-2 gap-3 mb-6">
                        {filteredItems.map(item => (
                            <div key={item.id} className="glass-card rounded-2xl overflow-hidden flex flex-col justify-between border border-slate-800">
                                <div className="relative h-28 bg-slate-900">
                                    <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                    {item.calories && <span className="absolute top-2 left-2 bg-slate-950/80 text-[9px] font-mono font-bold text-amber-400 px-2 py-0.5 rounded-full">{item.calories}</span>}
                                </div>
                                <div className="p-2.5 flex-1 flex flex-col justify-between space-y-2">
                                    <div>
                                        <h4 className="text-xs font-bold text-slate-100 line-clamp-1">{item.name}</h4>
                                        <p className="text-[10px] text-slate-400">{item.category}</p>
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-xs font-black text-brand-cyan font-mono">{item.price} ج.م</span>
                                        <button onClick={() => addToCart(item)} className="w-7 h-7 bg-brand-pink text-white rounded-xl flex items-center justify-center text-xs font-bold shadow-md active:scale-95">
                                            <i className="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* نافذة سجل طلباتي */}
                    {showOrdersModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="glass-card w-full max-w-sm rounded-2xl p-4 border border-slate-700 max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
                                    <h3 className="text-sm font-bold text-brand-cyan">📋 سجل طلباتي السابقة</h3>
                                    <button onClick={() => setShowOrdersModal(false)} className="text-slate-400 hover:text-white text-sm">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                                    {allMyOrders.length === 0 ? (
                                        <p className="text-center text-xs text-slate-500 py-6">لا توجد طلبات سابقة مسجلة.</p>
                                    ) : (
                                        allMyOrders.map(ord => (
                                            <div key={ord.id} className="bg-slate-900/90 border border-slate-800 p-3 rounded-xl space-y-2">
                                                <div className="flex justify-between items-center text-xs">
                                                    <span className="font-bold text-slate-300">طلب #{ord.id.toString().slice(-6)}</span>
                                                    <span className="text-[10px] text-slate-400 font-mono">{ord.time} - {ord.date}</span>
                                                </div>
                                                <div className="text-[11px] text-slate-400 border-t border-slate-800 pt-1.5 space-y-1">
                                                    {ord.items.map((it, idx) => (
                                                        <div key={idx} className="flex justify-between">
                                                            <span>{it.name} (x{it.quantity})</span>
                                                            <span className="font-mono text-brand-cyan">{it.price * it.quantity} ج.م</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-800 text-xs font-bold">
                                                    <span className="text-slate-300">الإجمالي: <span className="text-brand-pink font-mono">{ord.totalPrice} ج.م</span></span>
                                                    <span className={`px-2 py-0.5 rounded-lg text-[10px] ${
                                                        ord.status === 'pending' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                                        ord.status === 'ready' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' :
                                                        ord.status === 'out_for_delivery' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' :
                                                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                                                    }`}>
                                                        {ord.status === 'pending' ? 'قيد التحضير' : ord.status === 'ready' ? 'جاهز' : ord.status === 'out_for_delivery' ? 'جاري التوصيل' : 'تم التسليم'}
                                                    </span>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <button onClick={() => setShowOrdersModal(false)} className="w-full mt-3 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-bold hover:bg-slate-700">
                                    إغلاق
                                </button>
                            </div>
                        </div>
                    )}

                    {/* سلة الطلبات المثبتة أسفل الشاشة */}
                    {cart.length > 0 && (
                        <div className="fixed bottom-3 left-4 right-4 max-w-md mx-auto glass-card p-3 rounded-2xl border border-brand-pink/40 shadow-2xl space-y-2 z-40">
                            <div className="max-h-24 overflow-y-auto space-y-1.5 pr-1 border-b border-slate-800 pb-2">
                                {cart.map(i => (
                                    <div key={i.id} className="flex justify-between items-center text-xs">
                                        <span className="text-slate-200 font-semibold">{i.name} (x{i.quantity})</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-brand-cyan font-mono">{i.price * i.quantity} ج.م</span>
                                            <button onClick={() => removeFromCart(i.id)} className="text-rose-400 text-[10px]"><i className="fa-solid fa-xmark"></i></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between text-[11px] text-slate-400">
                                <span>{orderType === 'delivery' ? 'رسوم التوصيل:' : 'خدمة صالة (12%):'}</span>
                                <span className="font-mono text-amber-400">{extraFee} ج.م</span>
                            </div>
                            <div className="flex items-center justify-between pt-1">
                                <div>
                                    <span className="text-[10px] text-slate-400 block">الإجمالي الكلي:</span>
                                    <span className="text-sm font-black text-brand-pink font-mono">{grandTotal} ج.م</span>
                                </div>
                                <button onClick={submitOrder} className="px-5 py-2.5 bg-emerald-500 text-slate-950 font-black text-xs rounded-xl shadow-lg active:scale-95 flex items-center gap-1.5">
                                    <span>تأكيد الطلب</span>
                                    <i className="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
    </script>
</body>
</html>
