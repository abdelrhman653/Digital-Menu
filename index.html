<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو المستقبلي الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-glass: rgba(22, 31, 49, 0.7);
            --accent-neon: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --danger: #ff0055;
            --green-glow: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 15px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* الهيدر ورقم الترابيزة */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .brand-logo {
            font-size: 1.2rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table-badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--accent-neon);
            color: var(--accent-neon);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* الأقسام (Categories) */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 15px;
            white-space: nowrap;
            font-weight: bold;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-neon));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }

        /* شبكة الأصناف */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:active {
            transform: scale(0.97);
        }

        .badge-discount {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(255, 0, 85, 0.4);
            z-index: 2;
        }

        .card-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 14px;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .price-box {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 10px;
        }

        .current-price {
            color: var(--green-glow);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .old-price {
            color: var(--text-sub);
            text-decoration: line-through;
            font-size: 0.8rem;
        }

        .add-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover, .add-btn:active {
            background: var(--accent-neon);
            color: #000;
            border-color: var(--accent-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        /* السلة العائمة السفلي */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent-neon);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 242, 254, 0.2);
            z-index: 100;
        }

        .cart-info span {
            display: block;
        }

        .cart-count {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--green-glow);
        }

        .send-order-btn {
            background: linear-gradient(135deg, var(--accent-neon), #0072ff);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="brand-logo">NEXUS MENU ⚡</div>
        <div class="table-badge" id="tableDisplay">ترابيزة رقم --</div>
    </header>

    <!-- الأقسام -->
    <div class="categories">
        <button class="cat-btn active">🔥 الأشد طلباً</button>
        <button class="cat-btn">🍔 البرجر</button>
        <button class="cat-btn">🍕 البيتزا</button>
        <button class="cat-btn">🥤 المشروبات</button>
    </div>

    <!-- الأصناف -->
    <div class="menu-grid" id="menuGrid">
        <!-- بتنزل تلقائي بالـ JS -->
    </div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar">
        <div class="cart-info">
            <span class="cart-count" id="cartCount">0 أصناف مختارة</span>
            <span class="cart-total" id="cartTotal">0.00 ج.م</span>
        </div>
        <button class="send-order-btn" onclick="sendOrder()">إرسال الطلب 🚀</button>
    </div>

    <script>
        // 1. قراءة رقم الترابيزة تلقائياً من الرابط (e.g. ?table=5)
        const urlParams = new URLSearchParams(window.location.search);
        const tableNumber = urlParams.get('table') || '1'; // افتراضي 1 للتجربة
        document.getElementById('tableDisplay').innerText = `ترابيزة رقم ${tableNumber}`;

        // 2. داتا الأصناف والخصومات
        const items = [
            { id: 1, name: "تربل زلازل برجر", price: 140, oldPrice: 180, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" },
            { id: 2, name: "بيتزا رانش دجاج", price: 110, oldPrice: 135, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" },
            { id: 3, name: "كشري أسطوري سبيشال", price: 40, oldPrice: 0, img: "https://images.unsplash.com/photo-1543353071-10c8ba85a904?w=400" },
            { id: 4, name: "موهيتو بلو نيون", price: 35, oldPrice: 50, img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400" }
        ];

        let cart = [];

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                let discountHtml = '';
                let priceHtml = `<span class="current-price">${item.price} ج.م</span>`;

                if(item.oldPrice > item.price) {
                    let discountPercent = Math.round(((item.oldPrice - item.price) / item.oldPrice) * 100);
                    discountHtml = `<div class="badge-discount">خصم %${discountPercent}</div>`;
                    priceHtml = `
                        <span class="current-price">${item.price} ج.م</span>
                        <span class="old-price">${item.oldPrice} ج.م</span>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${discountHtml}
                    <img src="${item.img}" class="card-img" alt="${item.name}">
                    <div class="card-title">${item.name}</div>
                    <div class="price-box">${priceHtml}</div>
                    <button class="add-btn" onclick="addToCart(${item.id})">+ إضافة للسلة</button>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(id) {
            const product = items.find(i => i.id === id);
            cart.push(product);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = `${cart.length} أصناف مختارة`;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = `${total} ج.م`;
        }

        function sendOrder() {
            if(cart.length === 0) {
                alert("السلة فارغة! أضف أكل الأول 😉");
                return;
            }
            alert(`✅ تم إرسال طلبك بنجاح من (ترابيزة ${tableNumber})! السيستم في المطبخ شغال عليه دلوقت.`);
            cart = [];
            updateCartUI();
        }

        renderMenu();
    </script>
</body>
</html>
