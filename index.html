<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">المنيو الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] },
                    colors: { brand: { dark: '#0b1320', card: '#1e293b', pink: '#ec4899', cyan: '#06b6d4', amber: '#f59e0b' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function MenuApp() {
            const [restaurantName, setRestaurantName] = useState('Abdo Shop');
            const [menuItems, setMenuItems] = useState([]);
            const [cart, setCart] = useState([]);
            const [activeCategory, setActiveCategory] = useState('الكل');
            const [tableNumber, setTableNumber] = useState('1');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [customerInfo, setCustomerInfo] = useState({ name: '', phone: '', address: '' });
            const [orderSuccess, setOrderSuccess] = useState(false);

            useEffect(() => {
                const savedName = localStorage.getItem('nexus_restaurant_name');
                if (savedName) setRestaurantName(savedName);

                const urlParams = new URLSearchParams(window.location.search);
                const table = urlParams.get('table');
                if (table) setTableNumber(table);

                const savedMenu = localStorage.getItem('nexus_menu_items');
                if (savedMenu) {
                    setMenuItems(JSON.parse(savedMenu));
                } else {
                    setMenuItems([
                        { id: '1', name: 'تريبل زلازل برجر', category: 'البرجر 🍔', price: 140, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80', calories: '850 Cal' },
                        { id: '2', name: 'بيتزا رانش دجاج', category: 'البيتزا 🍕', price: 110, image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80', calories: '620 Cal' }
                    ]);
                }
            }, []);

            const categories = ['الكل', ...new Set(menuItems.map(item => item.category))];
            const filteredItems = activeCategory === 'الكل' ? menuItems : menuItems.filter(i => i.category === activeCategory);

            const addToCart = (item) => {
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    setCart(cart.map(c => c.id === item.id ? { ...c, quantity: c.quantity + 1 } : c));
                } else {
                    setCart([...cart, { ...item, quantity: 1 }]);
                }
            };

            const updateQuantity = (id, delta) => {
                setCart(cart.map(c => {
                    if (c.id === id) {
                        const newQ = c.quantity + delta;
                        return newQ > 0 ? { ...c, quantity: newQ } : null;
                    }
                    return c;
                }).filter(Boolean));
            };

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            const handleCheckout = (e) => {
                e.preventDefault();
                if (cart.length === 0) return;

                const newOrder = {
                    id: Date.now(),
                    tableNumber: `ترابيزة رقم ${tableNumber}`,
                    items: cart,
                    totalPrice: totalPrice,
                    customerInfo: customerInfo,
                    status: 'pending',
                    date: new Date().toLocaleDateString('ar-EG'),
                    time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                };

                const existingOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify([newOrder, ...existingOrders]));

                setCart([]);
                setOrderSuccess(true);
                setIsCartOpen(false);
                setTimeout(() => setOrderSuccess(false), 5000);
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col p-4">
                    <header className="glass-card p-4 rounded-2xl flex justify-between items-center mb-4">
                        <div>
                            <h1 className="text-base font-black text-brand-cyan flex items-center gap-2">
                                <i className="fa-solid fa-store"></i> <span>{restaurantName}</span>
                            </h1>
                            <p className="text-[11px] text-slate-400">ترابيزة رقم: <strong className="text-brand-pink">{tableNumber}</strong></p>
                        </div>
                        <div className="flex gap-2">
                            <a href="kitchen.html" target="_blank" className="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-xs text-brand-cyan font-bold">
                                <i className="fa-solid fa-fire ml-1"></i> المطبخ
                            </a>
                            <button onClick={() => setIsCartOpen(true)} className="relative bg-brand-pink text-white px-3 py-1.5 rounded-xl text-xs font-bold">
                                <i className="fa-solid fa-cart-shopping"></i>
                                {cart.length > 0 && <span className="absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{cart.reduce((a,b)=>a+b.quantity,0)}</span>}
                            </button>
                        </div>
                    </header>

                    {orderSuccess && (
                        <div className="bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 p-3 rounded-xl text-xs text-center font-bold mb-4 animate-bounce">
                            🎉 تم إرسال طلبك بنجاح إلى المطبخ!
                        </div>
                    )}

                    <div className="flex gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
                        {categories.map(cat => (
                            <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${activeCategory === cat ? 'bg-brand-pink text-white shadow-lg shadow-pink-500/20' : 'glass-card text-slate-300'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-2 gap-3 flex-1">
                        {filteredItems.map(item => (
                            <div key={item.id} className="glass-card rounded-2xl overflow-hidden flex flex-col justify-between border border-slate-800">
                                <img src={item.image} alt={item.name} className="w-full h-28 object-cover" />
                                <div className="p-3 space-y-1">
                                    <h3 className="font-bold text-xs truncate text-slate-100">{item.name}</h3>
                                    {item.calories && <span className="text-[10px] text-slate-400 block">{item.calories}</span>}
                                    <div className="flex justify-between items-center pt-2">
                                        <span className="text-brand-cyan font-black text-xs">{item.price} ج.م</span>
                                        <button onClick={() => addToCart(item)} className="bg-brand-pink/20 text-brand-pink border border-brand-pink/30 p-1.5 rounded-xl text-xs hover:bg-brand-pink hover:text-white transition-all">
                                            <i className="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* سلة المشتريات Modal */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
                            <div className="w-full max-w-sm bg-brand-dark h-full p-4 flex flex-col justify-between border-l border-slate-800">
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                                        <h2 className="text-sm font-bold text-white"><i className="fa-solid fa-cart-shopping text-brand-pink ml-1"></i> سلة طلباتك</h2>
                                        <button onClick={() => setIsCartOpen(false)} className="text-slate-400 hover:text-white text-sm"><i className="fa-solid fa-xmark"></i></button>
                                    </div>

                                    <div className="space-y-2 max-h-48 overflow-y-auto">
                                        {cart.length === 0 ? (
                                            <p className="text-center text-xs text-slate-500 py-8">السلة فارغة حالياً</p>
                                        ) : (
                                            cart.map(item => (
                                                <div key={item.id} className="flex justify-between items-center bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-xs">
                                                    <div>
                                                        <h4 className="font-bold text-slate-200">{item.name}</h4>
                                                        <span className="text-brand-cyan">{item.price * item.quantity} ج.م</span>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => updateQuantity(item.id, -1)} className="w-6 h-6 bg-slate-800 rounded-lg text-slate-300">-</button>
                                                        <span className="font-bold">{item.quantity}</span>
                                                        <button onClick={() => updateQuantity(item.id, 1)} className="w-6 h-6 bg-slate-800 rounded-lg text-slate-300">+</button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {cart.length > 0 && (
                                        <form onSubmit={handleCheckout} className="space-y-3 border-t border-slate-800 pt-3">
                                            <h3 className="text-xs font-bold text-slate-300">بيانات العميل (اختياري)</h3>
                                            <input type="text" placeholder="الاسم" value={customerInfo.name} onChange={(e)=>setCustomerInfo({...customerInfo, name: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white" />
                                            <input type="text" placeholder="رقم الهاتف" value={customerInfo.phone} onChange={(e)=>setCustomerInfo({...customerInfo, phone: e.target.value})} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white" />
                                        </form>
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div className="space-y-3 border-t border-slate-800 pt-4">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span>الإجمالي:</span>
                                            <span className="text-brand-pink text-sm">{totalPrice} ج.م</span>
                                        </div>
                                        <button onClick={handleCheckout} className="w-full py-3 bg-brand-pink text-white rounded-xl text-xs font-bold shadow-lg shadow-pink-500/20">
                                            إرسال الطلب للمطبخ 🚀
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <footer className="mt-8 text-center text-[11px] text-slate-500 border-t border-slate-800/60 pt-4">
                        تطوير Abdelrhman Mohamed | Web Developer
                    </footer>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<MenuApp />);
    </script>
</body>
</html>
