<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم - طلبات العملاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 100px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 15px;
            text-align: center;
        }
        header h1 { font-size: 16px; font-weight: 700; }

        .container { max-width: 500px; margin: 12px auto; padding: 0 10px; }

        /* نافذة تسجيل بيانات العميل */
        #authModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.95);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-box h3 { margin-bottom: 15px; font-size: 16px; }
        .auth-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--white);
            margin-bottom: 12px;
            font-size: 14px;
        }
        .auth-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--dark-card);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
        .table-badge { color: var(--primary); font-weight: 700; }

        /* شبكة الأطقم والأطباق مقاسات مظبوطة */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media(max-width: 350px) { .menu-grid { grid-template-columns: 1fr; } }

        .menu-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .menu-content { padding: 8px; }
        .menu-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 8px 8px;
        }
        .menu-price { color: var(--secondary); font-weight: 700; font-size: 13px; }

        /* أزرار الكمية + و - */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px 6px;
        }
        .qty-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 12px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-num { font-size: 13px; font-weight: 700; min-width: 15px; text-align: center; }

        .add-initial-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        /* شريط السلة السفلي مع التفاصيل والحسابات */
        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            padding: 12px 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .cart-details {
            font-size: 12px;
            color: var(--gray);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .cart-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-submit {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- نافذة تسجيل بيانات العميل أول ما يفتح -->
    <div id="authModal">
        <div class="auth-box">
            <h3>أهلاً بك! يرجى إدخال بياناتك للمتابعة</h3>
            <input type="text" id="clientName" class="auth-input" placeholder="اسم العميل (مثال: أحمد محمد)">
            <input type="tel" id="clientPhone" class="auth-input" placeholder="رقم الهاتف (مثال: 01012345678)">
            <button class="auth-btn" onclick="saveClientData()">دخول للمنيو <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <header>
        <h1>منيو المطعم - طلبات العملاء</h1>
    </header>

    <div class="container">
        <div class="badge-box">
            <span id="orderTypeBadge" style="font-weight: 700;">نوع الطلب: صالة</span>
            <span id="tableDisplayBadge" class="table-badge">الترابيزة: 1</span>
        </div>

        <div id="customerMenuGrid" class="menu-grid">
            <!-- الأصناف تحمل هنا تلقائياً -->
        </div>
    </div>

    <!-- شريط السلة -->
    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-details" id="cartBreakdown">
            <!-- تفاصيل الخدمة والإجمالي -->
        </div>
        <div class="cart-main-row">
            <div>
                <div style="font-size: 11px; color: var(--gray);">الإجمالي النهائي</div>
                <div style="font-weight: 900; color: var(--secondary); font-size: 16px;" id="cartTotal">0.0 ج.م</div>
            </div>
            <button class="btn-submit" onclick="submitOrder()">إرسال الطلب <i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        const table = urlParams.get('table');
        const isOnline = !table || table === 'online';

        // تحديد نوع الطلب
        let orderType = isOnline ? 'أونلاين' : 'صالة';
        document.getElementById('orderTypeBadge').innerText = `نوع الطلب: ${orderType}`;
        document.getElementById('tableDisplayBadge').innerText = isOnline ? 'خدمة توصيل' : `الترابيزة: ${table}`;

        // التحقق من تسجيل العميل مسبقاً
        let currentUser = JSON.parse(localStorage.getItem(`current_client_${restaurant}`));
        if (currentUser) {
            document.getElementById('authModal').classList.add('hidden');
        }

        function saveClientData() {
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            if(!name || phone.length < 10) {
                alert('الرجاء إدخال الاسم ورقم هاتف صحيح.');
                return;
            }
            currentUser = { name, phone };
            localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
            document.getElementById('authModal').classList.add('hidden');
        }

        let cart = {};

        function loadMenu() {
            let items = JSON.parse(localStorage.getItem(`menu_items_${restaurant}`)) || [
                { id: 1, name: "برجر كبير", price: 150, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" }
            ];

            let grid = document.getElementById('customerMenuGrid');
            let html = '';
            items.forEach(item => {
                let qty = cart[item.id] ? cart[item.id].qty : 0;
                html += `
                    <div class="menu-card">
                        <img src="${item.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}" alt="${item.name}">
                        <div class="menu-content">
                            <div class="menu-title">${item.name}</div>
                        </div>
                        <div class="menu-footer">
                            <div class="menu-price">${item.price} ج.م</div>
                            <div id="btn-container-${item.id}">
                                ${qty === 0 ? 
                                    `<button class="add-initial-btn" onclick="changeQty(${item.id}, '${item.name}', ${item.price}, 1)">إضافة</button>` :
                                    `<div class="qty-controls">
                                        <button class="qty-btn" onclick="changeQty(${item.id}, '${item.name}', ${item.price}, -1)"><i class="fa-solid fa-minus"></i></button>
                                        <span class="qty-num">${qty}</span>
                                        <button class="qty-btn" onclick="changeQty(${item.id}, '${item.name}', ${item.price}, 1)"><i class="fa-solid fa-plus"></i></button>
                                     </div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function changeQty(id, name, price, change) {
            if (!cart[id]) {
                if (change > 0) {
                    cart[id] = { id, name, price, qty: 1 };
                }
            } else {
                cart[id].qty += change;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
            }
            loadMenu();
            updateCartBar();
        }

        function updateCartBar() {
            let itemsArray = Object.values(cart);
            let subtotal = itemsArray.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (itemsArray.length > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
                
                let serviceFee = 0;
                let serviceText = '';
                if (isOnline) {
                    serviceFee = 40; // خدمة توصيل أونلاين
                    serviceText = `المجموع: ${subtotal} + توصيل: 40 ج.م`;
                } else {
                    serviceFee = Math.round(subtotal * 0.10); // 10% خدمة صالة
                    serviceText = `المجموع: ${subtotal} + خدمة صالة 10% (${serviceFee} ج.م)`;
                }
                
                let finalTotal = subtotal + serviceFee;
                document.getElementById('cartBreakdown').innerText = serviceText;
                document.getElementById('cartTotal').innerText = `${finalTotal} ج.م`;
            } else {
                document.getElementById('cartBar').classList.add('hidden');
            }
        }

        function submitOrder() {
            if (!currentUser) {
                document.getElementById('authModal').classList.remove('hidden');
                return;
            }
            let itemsArray = Object.values(cart);
            if (itemsArray.length === 0) return;

            let subtotal = itemsArray.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let serviceFee = isOnline ? 40 : Math.round(subtotal * 0.10);
            let finalTotal = subtotal + serviceFee;

            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                client: currentUser,
                type: orderType,
                table: isOnline ? 'أونلاين' : table,
                items: itemsArray,
                subtotal: subtotal,
                serviceFee: serviceFee,
                total: finalTotal,
                time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
                date: new Date().toISOString().split('T')[0],
                status: 'قيد التحضير'
            };

            orders.push(newOrder);
            localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));

            alert('تم إرسال طلبك بنجاح! سيتم تحضيره فوراً.');
            cart = {};
            updateCartBar();
            loadMenu();
        }

        window.onload = loadMenu;
    </script>
</body>
</html>
