<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل طلباتي - Abdo Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1320; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen p-4 pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function CustomerOrdersApp() {
            const [myOrders, setMyOrders] = useState([]);
            const userPhone = localStorage.getItem('abdo_shop_cust_phone') || '';

            const loadOrders = () => {
                const allOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                // تصفية الطلبات الخاصة برقم تليفون العميل المسجل أو عرض الطلبات الأونلاين بشكل عام
                const filtered = allOrders.filter(o => {
                    if (o.customerInfo && o.customerInfo.phone) {
                        return o.customerInfo.phone === userPhone;
                    }
                    return true; // عرض الكل لو لم يكن مسجلاً بديلفري خاص
                });
                setMyOrders(filtered);
            };

            useEffect(() => {
                loadOrders();
                const interval = setInterval(loadOrders, 2000);
                return () => clearInterval(interval);
            }, [userPhone]);

            // ميزة إلغاء الطلب إذا كان لا يزال قيد التحضير (pending) فقط
            const cancelOrder = (orderId) => {
                if (!confirm('هل أنت متأكد من إلغاء هذا الطلب؟')) return;
                const allOrders = JSON.parse(localStorage.getItem('nexus_kitchen_orders') || '[]');
                const updated = allOrders.map(o => {
                    if (o.id === orderId) {
                        if (o.status !== 'pending') {
                            alert('عذراً، لا يمكن إلغاء الطلب لأنه خرج من مرحلة التحضير.');
                            return o;
                        }
                        return { ...o, status: 'cancelled' };
                    }
                    return o;
                });
                localStorage.setItem('nexus_kitchen_orders', JSON.stringify(updated));
                loadOrders();
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col space-y-4">
                    {/* Header */}
                    <header className="flex items-center justify-between pb-3 border-b border-slate-800">
                        <div className="flex items-center gap-2">
                            <div className="w-9 h-9 bg-pink-500/20 text-pink-400 rounded-xl flex items-center justify-center font-bold">
                                <i className="fa-solid fa-receipt"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-sm text-slate-100">سجل طلباتي السابقة 📄</h1>
                                <p className="text-[10px] text-slate-400">متابعة حالة الطلبات وإمكانية الإلغاء</p>
                            </div>
                        </div>
                        <a href="index.html" className="text-xs bg-slate-900 border border-slate-800 text-cyan-400 px-3 py-1.5 rounded-xl font-bold">
                            العودة للمنيو 🔙
                        </a>
                    </header>

                    {userPhone && (
                        <div className="bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-300 flex justify-between items-center font-mono">
                            <span>📱 الهاتف المسجل: {userPhone}</span>
                            <span className="text-emerald-400 text-[10px]">محفوظ تلقائياً</span>
                        </div>
                    )}

                    {myOrders.length === 0 ? (
                        <div className="text-center py-20 glass-card rounded-2xl p-6 space-y-3">
                            <i className="fa-solid fa-box-open text-4xl text-slate-600"></i>
                            <h3 className="font-bold text-slate-300 text-sm">لا توجد طلبات سابقة مسجلة</h3>
                            <a href="index.html" className="inline-block px-4 py-2 bg-pink-500 text-white text-xs font-bold rounded-xl">اطلب الآن</a>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {myOrders.map(order => {
                                const isPending = order.status === 'pending';
                                return (
                                    <div key={order.id} className="glass-card p-3.5 rounded-2xl space-y-2.5 border border-slate-800">
                                        <div className="flex justify-between items-center border-b border-slate-800/80 pb-2">
                                            <div>
                                                <span className="text-xs font-black text-pink-400 block">{order.tableNumber}</span>
                                                <span className="text-[10px] text-slate-400 font-mono">📅 {order.date} | ⏰ {order.time}</span>
                                            </div>
                                            <div>
                                                {order.status === 'pending' && <span className="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold">⏳ قيد التحضير</span>}
                                                {order.status === 'ready' && <span className="bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold">🍳 الطلب جاهز</span>}
                                                {order.status === 'out_for_delivery' && <span className="bg-purple-500/20 text-purple-400 border border-purple-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold">🏃 في الطريق</span>}
                                                {order.status === 'delivered' && <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold">✅ تم التسليم</span>}
                                                {order.status === 'cancelled' && <span className="bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-lg text-[10px] font-bold">❌ تم الإلغاء</span>}
                                            </div>
                                        </div>

                                        <div className="space-y-1 bg-slate-950/40 p-2.5 rounded-xl text-xs">
                                            {order.items.map((item, idx) => (
                                                <div key={idx} className="flex justify-between text-slate-200">
                                                    <span>{item.name} (x{item.quantity})</span>
                                                    <span className="font-mono text-cyan-400">{item.price * item.quantity} ج.م</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex justify-between items-center pt-1 text-xs">
                                            <span className="font-black text-pink-400 font-mono">الإجمالي: {order.totalPrice} ج.م</span>
                                            
                                            {/* زر إلغاء الطلب يظهر فقط لو كان الطلب قيد التحضير ولم يتم تسليمه */}
                                            {isPending && (
                                                <button onClick={() => cancelOrder(order.id)} className="px-3 py-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 rounded-xl text-[11px] font-bold">
                                                    <i className="fa-solid fa-ban ml-1"></i> إلغاء الطلب
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CustomerOrdersApp />);
    </script>
</body>
</html>
