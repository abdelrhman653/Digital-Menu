<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم - طلبات العملاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --secondary: #2ED573;
            --dark: #2F3542;
            --light: #F1F2F6;
            --white: #FFFFFF;
            --gray: #A4B0BE;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #F8F9FA; color: var(--dark); padding-bottom: 80px; }
        header {
            background: linear-gradient(135deg, var(--dark), #1E272E);
            color: var(--white);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .table-badge {
            background: #FFE5E8;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .food-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .food-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .food-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .food-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .price-area { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .old-price { text-decoration: line-through; color: var(--gray); font-size: 14px; }
        .new-price { color: var(--secondary); font-size: 18px; font-weight: 900; }
        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-success { background: var(--secondary); }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--dark);
            color: var(--white);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1 id="restaurantTitleName">منيو المطعم</h1>
    </header>

    <div class="container">
        <div id="tableInfoArea" class="hidden">
            <span class="table-badge" id="tableNumBadge">الترابيزة رقم: --</span>
        </div>

        <div class="menu-grid" id="customerMenuGrid">
            <!-- Items loaded dynamically -->
        </div>
    </div>

    <div id="cartBar" class="cart-bar hidden">
        <div>
            <span style="font-weight: 700;">أصناف السلة: <span id="cartCount">0</span></span> | 
            <span style="font-weight: 700; color: var(--secondary);">الإجمالي: <span id="cartTotal">0</span> ج.م</span>
        </div>
        <button class="btn btn-success" style="width: auto;" onclick="submitOrder()">إرسال الطلب للمطبخ <i class="fa-solid fa-check"></i></button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantSlug = urlParams.get('restaurant');
        const tableNumber = urlParams.get('table');

        let cart = [];

        window.onload = function() {
            if(!restaurantSlug) {
                document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px; color:var(--primary);">عذراً، رابط المطعم غير صحيح!</h2>';
                return;
            }

            // Load restaurant name
            let restaurants = JSON.parse(localStorage.getItem('all_restaurants') || '{}');
            if(restaurants[restaurantSlug]) {
                document.getElementById('restaurantTitleName').innerText = `منيو: ${restaurants[restaurantSlug].name}`;
            }

            if(tableNumber) {
                document.getElementById('tableInfoArea').classList.remove('hidden');
                document.getElementById('tableNumBadge').innerText = `الترابيزة رقم: ${tableNumber}`;
            }

            loadCustomerMenu();
        }

        function loadCustomerMenu() {
            let items = JSON.parse(localStorage.getItem(`menu_items_${restaurantSlug}`) || '[]');
            let grid = document.getElementById('customerMenuGrid');
            grid.innerHTML = '';

            if(items.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:var(--gray); grid-column: 1/-1;">عذراً، لا توجد أصناف متاحة في المنيو حالياً.</p>';
                return;
            }

            items.forEach((item, index) => {
                let finalPrice = item.price;
                let priceHtml = `<span class="new-price">${item.price} ج.م</span>`;
                if(item.discount && item.discount > 0) {
                    finalPrice = item.price - (item.price * item.discount / 100);
                    priceHtml = `
                        <span class="old-price">${item.price} ج.م</span>
                        <span class="new-price">${finalPrice.toFixed(1)} ج.م</span>
                    `;
                }

                grid.innerHTML += `
                    <div class="food-card">
                        <img src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'}" alt="">
                        <div class="food-body">
                            <div>
                                <div class="food-title">${item.name}</div>
                                <div class="price-area">${priceHtml}</div>
                            </div>
                            <button class="btn" onclick="addToCart('${item.name}', ${finalPrice})"><i class="fa-solid fa-cart-plus"></i> إضافة للسلة</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartTotal').innerText = total.toFixed(1);

            if(cart.length > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
            } else {
                document.getElementById('cartBar').classList.add('hidden');
            }
        }

        function submitOrder() {
            if(cart.length === 0) return;

            let orders = JSON.parse(localStorage.getItem(`orders_${restaurantSlug}`) || '[]');
            let newOrder = {
                id: Date.now(),
                table: tableNumber || 'سفري / صالة',
                items: cart,
                total: cart.reduce((sum, item) => sum + item.price, 0),
                time: new Date().toLocaleTimeString('ar-EG'),
                status: 'pending'
            };

            orders.push(newOrder);
            localStorage.setItem(`orders_${restaurantSlug}`, JSON.stringify(orders));

            alert('تم إرسال طلبك بنجاح إلى المطبخ! بالعافية.');
            cart = [];
            updateCartUI();
        }
    </script>
</body>
</html>
