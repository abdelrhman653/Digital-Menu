<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو والطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --warning: #FFA502;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 120px; }

        button { touch-action: manipulation; }
        img { user-select: none; -webkit-user-drag: none; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
        header h1 { font-size: 15px; font-weight: 700; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 480px; margin: 12px auto; padding: 0 10px; }

        #authModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.96);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .auth-box h3 { margin-bottom: 15px; font-size: 15px; color: var(--white); }
        .auth-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--white);
            margin-bottom: 12px;
            font-size: 13px;
        }
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--dark-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
        .history-btn-top {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .categories-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }
        .cat-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media(max-width: 340px) { .menu-grid { grid-template-columns: 1fr; } }

        .menu-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card img { width: 100%; height: 105px; object-fit: cover; }
        .menu-content { padding: 8px; }
        .menu-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 8px 8px;
        }
        .menu-price { color: var(--secondary); font-weight: 700; font-size: 13px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px 6px;
        }
        .qty-btn { background: none; border: none; color: var(--white); cursor: pointer; font-size: 12px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .qty-num { font-size: 13px; font-weight: 700; min-width: 15px; text-align: center; }

        .add-initial-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        #historyModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.95);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .history-card-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .history-item-row {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            padding: 12px 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            z-index: 990;
        }
        .cart-details { font-size: 11px; color: var(--gray); margin-bottom: 6px; line-height: 1.5; }
        .cart-main-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-submit {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        #customAlertModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .custom-alert-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .custom-alert-box p { font-size: 14px; margin-bottom: 20px; color: var(--white); line-height: 1.6; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="customAlertModal" class="hidden">
        <div class="custom-alert-box">
            <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 16px;"><i class="fa-solid fa-circle-exclamation"></i> <span data-i18n="alert_title">تنبيه</span></h3>
            <p id="customAlertMessage">رسالة التنبيه هنا</p>
            <button class="auth-btn" onclick="closeCustomAlert()" data-i18n="btn_ok">حسناً</button>
        </div>
    </div>

    <div id="authModal">
        <div class="auth-box">
            <div id="authChoiceView">
                <h3 id="authModalTitle" style="margin-bottom: 20px;" data-i18n="welcome_auth">مرحباً بك في المنيو</h3>
                <button class="auth-btn" style="margin-bottom: 10px;" onclick="showAuthForm('login')" data-i18n="login_btn">تسجيل الدخول</button>
                <button class="auth-btn" style="background: transparent; border: 1px solid var(--primary); color: var(--white); margin-bottom: 10px;" onclick="showAuthForm('register')" data-i18n="register_btn">إنشاء حساب جديد</button>
                <button class="auth-btn" style="background: transparent; border: 1px solid var(--gray); color: var(--gray);" onclick="showAuthForm('forgot')" data-i18n="forgot_password_btn">نسيت كلمة المرور</button>
            </div>

            <div id="loginFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="login_title">تسجيل الدخول</h3>
                <input type="tel" id="loginPhone" class="auth-input" placeholder="رقم الموبايل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="loginPassword" class="auth-input" placeholder="كلمة المرور" data-i18n-placeholder="password_placeholder">
                <button class="auth-btn" onclick="processLogin()" data-i18n="enter_btn">دخول</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="registerFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="register_title">إنشاء حساب جديد</h3>
                <input type="text" id="regName" class="auth-input" placeholder="اسمك الكريم" data-i18n-placeholder="name_placeholder">
                <input type="tel" id="regPhone" class="auth-input" placeholder="رقم الموبايل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="regPassword" class="auth-input" placeholder="كلمة المرور" data-i18n-placeholder="password_placeholder">
                <input type="password" id="regConfirmPassword" class="auth-input" placeholder="تأكيد كلمة المرور" data-i18n-placeholder="confirm_password_placeholder">
                <input type="text" id="regAddress" class="auth-input" placeholder="العنوان بالتفصيل (للأونلاين فقط)" data-i18n-placeholder="address_placeholder">
                <button class="auth-btn" onclick="processRegister()" data-i18n="create_account_btn">إنشاء الحساب</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="forgotFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="forgot_title">استعادة كلمة المرور</h3>
                <input type="tel" id="forgotPhone" class="auth-input" placeholder="رقم الموبايل المسجل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="forgotNewPassword" class="auth-input" placeholder="كلمة المرور الجديدة" data-i18n-placeholder="new_password_placeholder">
                <input type="password" id="forgotConfirmPassword" class="auth-input" placeholder="تأكيد كلمة المرور الجديدة" data-i18n-placeholder="confirm_new_password_placeholder">
                <button class="auth-btn" onclick="processForgotPassword()" data-i18n="reset_password_btn">تحديث كلمة المرور</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="editProfileFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="edit_profile_title">تعديل البيانات الشخصية</h3>
                <input type="text" id="editName" class="auth-input" placeholder="الاسم الكريم" data-i18n-placeholder="name_placeholder">
                <input type="text" id="editAddress" class="auth-input" placeholder="العنوان بالتفصيل" data-i18n-placeholder="address_placeholder">
                <button class="auth-btn" onclick="processEditProfile()" data-i18n="save_changes_btn">حفظ التعديلات</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="toggleEditProfile(false)" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="changePasswordFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="change_password_title">تغيير كلمة المرور</h3>
                <input type="password" id="currentPassword" class="auth-input" placeholder="كلمة المرور الحالية" data-i18n-placeholder="current_password_placeholder">
                <input type="password" id="newPassword" class="auth-input" placeholder="كلمة المرور الجديدة" data-i18n-placeholder="new_password_placeholder">
                <input type="password" id="confirmNewPassword" class="auth-input" placeholder="تأكيد كلمة المرور الجديدة" data-i18n-placeholder="confirm_new_password_placeholder">
                <button class="auth-btn" onclick="processChangePassword()" data-i18n="update_password_btn">تحديث كلمة المرور</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="toggleChangePassword(false)" data-i18n="back_btn">الرجوع</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="hidden">
        <div class="history-card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 15px;"><i class="fa-solid fa-clipboard-list" style="color: var(--primary);"></i> <span data-i18n="my_orders">سجل طلباتي السابقة</span></h3>
                <button onclick="toggleHistory(false)" style="background: none; border: none; color: var(--white); font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; gap: 6px; margin-bottom: 15px;">
                <button onclick="toggleEditProfile(true)" style="flex: 1; background: rgba(255, 165, 2, 0.2); color: var(--warning); border: 1px solid var(--warning); padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px;" data-i18n="btn_edit_profile">تعديل البيانات</button>
                <button onclick="toggleChangePassword(true)" style="flex: 1; background: rgba(46, 213, 115, 0.2); color: var(--secondary); border: 1px solid var(--secondary); padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px;" data-i18n="btn_change_password">تغيير كلمة المرور</button>
            </div>
            <div id="historyListContainer"></div>
            <button onclick="logoutClient()" style="background: rgba(255, 71, 87, 0.2); color: var(--primary); border: 1px solid var(--primary); width: 100%; padding: 8px; border-radius: 8px; font-weight: 700; margin-top: 10px; cursor: pointer; font-size: 12px;" data-i18n="btn_logout_client">تسجيل خروج</button>
        </div>
    </div>

    <header>
        <div class="header-brand">
            <img id="headerLogoImg" class="header-logo" src="" alt="الشعار">
            <h1 id="headerRestaurantTitle">المنيو والطلب</h1>
        </div>
        <select id="langSelectOrders" onchange="changeLanguage(this.value)" style="width: 100px; padding: 4px; font-size: 11px; background: var(--dark-bg); color: #fff; border: 1px solid var(--border); border-radius: 6px;">
            <option value="ar">العربية 🇸🇦</option>
            <option value="en">English 🇺🇸</option>
        </select>
    </header>

    <div class="container">
        <div id="liveOrderTrackerContainer"></div>

        <div class="top-bar">
            <div>
                <span id="orderTypeBadge" style="font-weight: 700; font-size: 12px;">نوع الطلب: أونلاين</span>
                <span id="tableDisplayBadge" style="color: var(--primary); font-weight: 700; font-size: 12px; margin-right: 8px;">توصيل دليفري</span>
            </div>
            <button class="history-btn-top" onclick="toggleHistory(true)"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="btn_my_orders">طلباتي</span></button>
        </div>

        <div class="categories-row" id="categoriesRowContainer">
            <button class="cat-btn active" onclick="filterCategory('All', this)" data-i18n="all_cat">الكل</button>
        </div>

        <div id="customerMenuGrid" class="menu-grid"></div>
    </div>

    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-details" id="cartBreakdown"></div>
        <div class="cart-main-row">
            <div>
                <div style="font-size: 10px; color: var(--gray);" data-i18n="final_total">الإجمالي النهائي</div>
                <div style="font-weight: 900; color: var(--secondary); font-size: 15px;" id="cartTotal">0.0 ج.م</div>
            </div>
            <button class="btn-submit" onclick="submitOrder()"><span data-i18n="btn_submit_order">إرسال الطلب</span> <i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let currentLang = localStorage.getItem('app_lang') || 'ar';
        const translations = {
            ar: {
                alert_title: "تنبيه",
                btn_ok: "حسناً",
                my_orders: "سجل طلباتي السابقة",
                btn_logout_client: "تسجيل خروج",
                btn_my_orders: "طلباتي",
                btn_edit_profile: "تعديل البيانات",
                btn_change_password: "تغيير كلمة المرور",
                all_cat: "الكل",
                final_total: "الإجمالي النهائي",
                btn_submit_order: "إرسال الطلب",
                add_btn: "إضافة",
                welcome_auth: "مرحباً بك في المنيو",
                login_btn: "تسجيل الدخول",
                register_btn: "إنشاء حساب جديد",
                forgot_password_btn: "نسيت كلمة المرور",
                login_title: "تسجيل الدخول",
                register_title: "إنشاء حساب جديد",
                forgot_title: "استعادة كلمة المرور",
                edit_profile_title: "تعديل البيانات الشخصية",
                change_password_title: "تغيير كلمة المرور",
                enter_btn: "دخول",
                back_btn: "الرجوع",
                create_account_btn: "إنشاء الحساب",
                reset_password_btn: "تحديث كلمة المرور",
                save_changes_btn: "حفظ التعديلات",
                update_password_btn: "تحديث كلمة المرور",
                name_placeholder: "اسمك الكريم (مثال: أحمد)",
                phone_placeholder: "رقم الموبايل (مثال: 01012345678)",
                password_placeholder: "كلمة المرور",
                confirm_password_placeholder: "تأكيد كلمة المرور",
                confirm_new_password_placeholder: "تأكيد كلمة المرور الجديدة",
                new_password_placeholder: "كلمة المرور الجديدة",
                current_password_placeholder: "كلمة المرور الحالية",
                address_placeholder: "العنوان بالتفصيل (للأونلاين فقط)",
                subtotal_text: "سعر المنتجات",
                delivery_text: "رسوم التوصيل",
                service_text: "خدمة الصالة",
                final_total_text: "الإجمالي النهائي",
                phone_already_registered: "هذا الرقم مسجل بالفعل.",
                phone_not_registered: "هذا الرقم غير مسجل.",
                wrong_password: "كلمة المرور غير صحيحة.",
                passwords_not_match: "كلمة المرور وتأكيدها غير متطابقين.",
                fill_all_fields: "الرجاء إدخال جميع الحقول المطلوبة بشكل صحيح.",
                profile_updated: "تم تعديل البيانات بنجاح.",
                password_updated: "تم تحديث كلمة المرور بنجاح.",
                current_password_incorrect: "كلمة المرور الحالية غير صحيحة."
            },
            en: {
                alert_title: "Alert",
                btn_ok: "OK",
                my_orders: "My Order History",
                btn_logout_client: "Logout",
                btn_my_orders: "My Orders",
                btn_edit_profile: "Edit Profile",
                btn_change_password: "Change Password",
                all_cat: "All",
                final_total: "Final Total",
                btn_submit_order: "Submit Order",
                add_btn: "Add",
                welcome_auth: "Welcome to Menu",
                login_btn: "Login",
                register_btn: "Create Account",
                forgot_password_btn: "Forgot Password",
                login_title: "Login",
                register_title: "Create New Account",
                forgot_title: "Recover Password",
                edit_profile_title: "Edit Profile",
                change_password_title: "Change Password",
                enter_btn: "Login",
                back_btn: "Back",
                create_account_btn: "Create Account",
                reset_password_btn: "Update Password",
                save_changes_btn: "Save Changes",
                update_password_btn: "Update Password",
                name_placeholder: "Your Name (e.g., John)",
                phone_placeholder: "Mobile Number (e.g., 01012345678)",
                password_placeholder: "Password",
                confirm_password_placeholder: "Confirm Password",
                confirm_new_password_placeholder: "Confirm New Password",
                new_password_placeholder: "New Password",
                current_password_placeholder: "Current Password",
                address_placeholder: "Detailed Address",
                subtotal_text: "Subtotal",
                delivery_text: "Delivery",
                service_text: "Service Charge",
                final_total_text: "Final Total",
                phone_already_registered: "This number is already registered.",
                phone_not_registered: "This number is not registered.",
                wrong_password: "Incorrect password.",
                passwords_not_match: "Passwords do not match.",

                profile_updated: "Profile updated successfully.",
                password_updated: "Password updated successfully.",
                current_password_incorrect: "Current password is incorrect."
            }
        };

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelectOrders').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                let key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                let key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            loadCategoriesBar();
            loadMenu();
            updateCartBar();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        let db = JSON.parse(localStorage.getItem('all_restaurants_db')) || {};
        let restData = db[restaurant] || {};
        const menuItems = restData.items || [];

        let customColor = restData.primaryColor || '#FF4757';
        document.documentElement.style.setProperty('--primary', customColor);

        if (restData.logo) {
            let logoImg = document.getElementById('headerLogoImg');
            logoImg.src = restData.logo;
            logoImg.style.display = 'block';
        }

        const table = urlParams.get('table');
        const isOnline = !table || table === 'online';
        let orderType = isOnline ? (currentLang === 'ar' ? 'أونلاين' : 'Online') : (currentLang === 'ar' ? 'صالة' : 'Dine-In');
        document.getElementById('orderTypeBadge').innerText = `${currentLang === 'ar' ? 'نوع الطلب' : 'Order Type'}: ${orderType}`;
        document.getElementById('tableDisplayBadge').innerText = isOnline ? (currentLang === 'ar' ? 'توصيل دليفري' : 'Delivery') : `Table: ${table}`;

        let usersDB = JSON.parse(localStorage.getItem(`users_${restaurant}`)) || [];
        let currentUser = JSON.parse(localStorage.getItem(`current_client_${restaurant}`));
        if (currentUser) {
            document.getElementById('authModal').classList.add('hidden');
            if (isOnline && !currentUser.address) {
                let promptAddress = prompt(currentLang === 'ar' ? 'برجاء إدخال عنوان التوصيل بالتفصيل:' : 'Please enter your delivery address:');
                if (promptAddress) {
                    currentUser.address = promptAddress;
                    let uIndex = usersDB.findIndex(u => u.phone === currentUser.phone);
                    if (uIndex !== -1) {
                        usersDB[uIndex].address = promptAddress;
                        localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));
                    }
                    localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
                }
            }
        }

        function showAuthForm(view) {
            document.getElementById('authChoiceView').classList.add('hidden');
            document.getElementById('loginFormView').classList.add('hidden');
            document.getElementById('registerFormView').classList.add('hidden');
            document.getElementById('forgotFormView').classList.add('hidden');
            document.getElementById('editProfileFormView').classList.add('hidden');
            document.getElementById('changePasswordFormView').classList.add('hidden');

            if (view === 'choice') {
                document.getElementById('authChoiceView').classList.remove('hidden');
            } else if (view === 'login') {
                document.getElementById('loginFormView').classList.remove('hidden');
            } else if (view === 'register') {
                document.getElementById('registerFormView').classList.remove('hidden');
                if (!isOnline) {
                    document.getElementById('regAddress').style.display = 'none';
                }
            } else if (view === 'forgot') {
                document.getElementById('forgotFormView').classList.remove('hidden');
            }
        }

        function toggleEditProfile(show) {
            if (show) {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authChoiceView').classList.add('hidden');
                document.getElementById('editProfileFormView').classList.remove('hidden');
                document.getElementById('editName').value = currentUser.name || '';
                document.getElementById('editAddress').value = currentUser.address || '';
                toggleHistory(false);
            } else {
                document.getElementById('editProfileFormView').classList.add('hidden');
                document.getElementById('authModal').classList.add('hidden');
            }
        }

        function toggleChangePassword(show) {
            if (show) {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authChoiceView').classList.add('hidden');
                document.getElementById('changePasswordFormView').classList.remove('hidden');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                toggleHistory(false);
            } else {
                document.getElementById('changePasswordFormView').classList.add('hidden');
                document.getElementById('authModal').classList.add('hidden');
            }
        }

        function processRegister() {
            let name = document.getElementById('regName').value.trim();
            let phone = document.getElementById('regPhone').value.trim();
            let password = document.getElementById('regPassword').value.trim();
            let confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            let address = isOnline ? document.getElementById('regAddress').value.trim() : `Dine-In Table ${table}`;

            if (!name || phone.length < 10 || !password || !confirmPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (password !== confirmPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            let existingUser = usersDB.find(u => u.phone === phone);
            if (existingUser) {
                showCustomAlert(translations[currentLang].phone_already_registered);
                return;
            }

            let newUser = {
                id: Math.floor(100000 + Math.random() * 900000),
                name,
                phone,
                password,
                address,
                createdAt: new Date().toISOString(),
                lastLogin: new Date().toISOString()
            };
            usersDB.push(newUser);
            localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));

            currentUser = { name, phone, address };
            localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
            
            document.getElementById('authModal').classList.add('hidden');
            loadCategoriesBar();
            loadMenu();
            updateLiveTracker();
        }

        function processLogin() {
            let phone = document.getElementById('loginPhone').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            if (!phone || !password) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            let user = usersDB.find(u => u.phone === phone);
            if (!user) {
                showCustomAlert(translations[currentLang].phone_not_registered);
                return;
            }

            if (user.password !== password) {
                showCustomAlert(translations[currentLang].wrong_password);
                return;
            }

            user.lastLogin = new Date().toISOString();
            localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));

            currentUser = { name: user.name, phone: user.phone, address: user.address || (isOnline ? '' : `Dine-In Table ${table}`) };
            
            if (isOnline && !currentUser.address) {
                let promptAddress = prompt(currentLang === 'ar' ? 'برجاء إدخال عنوان التوصيل بالتفصيل:' : 'Please enter your delivery address:');
                if (promptAddress) {
                    currentUser.address = promptAddress;
                    user.address = promptAddress;
                    localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));
                }
            }

            localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
            document.getElementById('authModal').classList.add('hidden');
            loadCategoriesBar();
            loadMenu();
            updateLiveTracker();
        }

        function processForgotPassword() {
            let phone = document.getElementById('forgotPhone').value.trim();
            let newPassword = document.getElementById('forgotNewPassword').value.trim();
            let confirmNewPassword = document.getElementById('forgotConfirmPassword').value.trim();

            if (!phone || !newPassword || !confirmNewPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            let user = usersDB.find(u => u.phone === phone);
            if (!user) {
                showCustomAlert(translations[currentLang].phone_not_registered);
                return;
            }

            user.password = newPassword;
            localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));

            showCustomAlert(translations[currentLang].password_updated);
            showAuthForm('login');
        }

        function processEditProfile() {
            let name = document.getElementById('editName').value.trim();
            let address = document.getElementById('editAddress').value.trim();

            if (!name) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            let user = usersDB.find(u => u.phone === currentUser.phone);
            if (user) {
                user.name = name;
                user.address = address;
                localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));
            }

            currentUser.name = name;
            currentUser.address = address;
            localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));

            showCustomAlert(translations[currentLang].profile_updated);
            toggleEditProfile(false);
        }

        function processChangePassword() {
            let currentPassword = document.getElementById('currentPassword').value.trim();
            let newPassword = document.getElementById('newPassword').value.trim();
            let confirmNewPassword = document.getElementById('confirmNewPassword').value.trim();

            if (!currentPassword || !newPassword || !confirmNewPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            let user = usersDB.find(u => u.phone === currentUser.phone);
            if (!user || user.password !== currentPassword) {
                showCustomAlert(translations[currentLang].current_password_incorrect);
                return;
            }

            user.password = newPassword;
            localStorage.setItem(`users_${restaurant}`, JSON.stringify(usersDB));

            showCustomAlert(translations[currentLang].password_updated);
            toggleChangePassword(false);
        }

        function logoutClient() {
            localStorage.removeItem(`current_client_${restaurant}`);
            location.reload();
        }

        function toggleHistory(show) {
            let modal = document.getElementById('historyModal');
            if (show) { renderClientHistory(); modal.classList.remove('hidden'); }
            else { modal.classList.add('hidden'); }
        }

        function renderClientHistory() {
            let container = document.getElementById('historyListContainer');
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let myOrders = orders.filter(o => currentUser && o.client && o.client.phone === currentUser.phone);

            if (myOrders.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 20px; font-size: 13px;">${currentLang === 'ar' ? 'لا توجد طلبات سابقة برقم هاتفك.' : 'No previous orders found.'}</p>`;
                return;
            }

            let html = '';
            myOrders.slice().reverse().forEach(ord => {
                let itemsDetailsHtml = '';
                (ord.items || []).forEach(i => {
                    itemsDetailsHtml += `<div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--white); margin-bottom: 3px;">
                        <span>${escapeHTML(i.name)} (x${i.qty})</span>
                        <span style="color: var(--secondary);">${i.price * i.qty} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}</span>
                    </div>`;
                });

                let canCancel = (ord.status === 'قيد التحضير' || ord.status === 'جاهز' || ord.status === 'Preparing' || ord.status === 'Ready');
                let cancelBtnHtml = canCancel ? `<button onclick="cancelOrder(${ord.id})" style="background: rgba(255, 71, 87, 0.2); color: var(--primary); border: 1px solid var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer;">${currentLang === 'ar' ? 'إلغاء الطلب' : 'Cancel'}</button>` : ``;

                let isOnlineOrder = ord.type === 'أونلاين' || ord.type === 'Online';
                let breakdownHtml = isOnlineOrder ? 
                    `${translations[currentLang].subtotal_text}: ${ord.subtotal} ج.م<br>${translations[currentLang].delivery_text}: ${ord.serviceFee} ج.م<br>--------------------<br>${translations[currentLang].final_total_text}: ${ord.total} ج.م` :
                    `${translations[currentLang].subtotal_text}: ${ord.subtotal} ج.م<br>${translations[currentLang].service_text}: ${ord.serviceFee} ج.م<br>--------------------<br>${translations[currentLang].final_total_text}: ${ord.total} ج.م`;

                html += `
                    <div class="history-item-row">
                        <div style="display: flex; justify-content: space-between; color: var(--gray); font-size: 11px; margin-bottom: 8px;">
                            <span>${currentLang === 'ar' ? 'طلب' : 'Order'} #${ord.id} (${escapeHTML(ord.type)})</span>
                            <span>${escapeHTML(ord.date)} - ${escapeHTML(ord.time)}</span>
                        </div>
                        <div style="border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px;">
                            ${itemsDetailsHtml}
                        </div>
                        <div style="font-size: 11px; color: var(--gray); margin-bottom: 8px; line-height: 1.6;">
                            ${breakdownHtml}
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 8px;">
                            <span style="color: var(--secondary); font-weight: 700; font-size: 14px;">${translations[currentLang].final_total}: ${ord.total} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="background: rgba(46, 213, 115, 0.15); color: var(--secondary); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;">${escapeHTML(ord.status)}</span>
                                ${cancelBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function cancelOrder(orderId) {
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let order = orders.find(o => o.id === orderId);
            if (order) {
                order.status = currentLang === 'ar' ? 'ملغي' : 'Cancelled';
                localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));
                renderClientHistory();
                updateLiveTracker();
                showCustomAlert(currentLang === 'ar' ? 'تم إلغاء الطلب بنجاح.' : 'Order cancelled successfully.');
            }
        }

        function updateLiveTracker() {
            let trackerContainer = document.getElementById('liveOrderTrackerContainer');
            if (!currentUser) { trackerContainer.innerHTML = ''; return; }
            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let activeOrder = orders.slice().reverse().find(o => o.client && o.client.phone === currentUser.phone && o.status !== 'تم التسليم' && o.status !== 'ملغي' && o.status !== 'Delivered' && o.status !== 'Cancelled');

            if (!activeOrder) { trackerContainer.innerHTML = ''; return; }

            trackerContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #1f2937 11%, #111827 100%); border: 1px solid var(--warning); border-radius: 12px; padding: 12px; margin-bottom: 15px;">
                    <span style="font-size: 12px; font-weight: 700; color: var(--warning);"><i class="fa-solid fa-bell fa-bounce"></i> ${currentLang === 'ar' ? 'متابعة طلبك' : 'Track Order'} (#${activeOrder.id})</span>
                    <span style="background: rgba(255, 165, 2, 0.2); color: var(--warning); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;">${escapeHTML(activeOrder.status)}</span>
                </div>
            `;
        }

        let cart = JSON.parse(localStorage.getItem(`cart_${restaurant}`)) || {};
        let selectedCategory = 'All';

        function loadCategoriesBar() {
            let cats = (restData && restData.categories) ? restData.categories : ["مشروبات / Drinks", "أكلات / Foods"];
            let container = document.getElementById('categoriesRowContainer');
            
            let html = `<button class="cat-btn ${selectedCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All', this)">${translations[currentLang].all_cat}</button>`;
            cats.forEach(c => {
                html += `<button class="cat-btn ${selectedCategory === c ? 'active' : ''}" onclick="filterCategory('${escapeHTML(c)}', this)">${escapeHTML(c)}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadMenu();
        }

        function loadMenu() {
            let items = menuItems;

            if (selectedCategory !== 'All') {
                items = items.filter(i => i.category === selectedCategory);
            }

            let grid = document.getElementById('customerMenuGrid');
            let html = '';
            items.forEach(item => {
                let qty = cart[item.id] ? cart[item.id].qty : 0;
                let finalPrice = item.discount ? (item.price - item.discount) : item.price;

                html += `
                    <div class="menu-card">
                        <img src="${escapeHTML(item.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500')}" alt="${escapeHTML(item.name)}" loading="lazy" decoding="async">
                        <div class="menu-content">
                            <div class="menu-title">${escapeHTML(item.name)}</div>
                        </div>
                        <div class="menu-footer">
                            <div class="menu-price">
                                ${item.discount ? `<span style="text-decoration: line-through; color: var(--gray); font-size: 10px; display:block;">${item.price}</span>` : ''}
                                ${finalPrice} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}
                            </div>
                            <div id="btn-container-${item.id}">
                                ${qty === 0 ? 
                                    `<button class="add-initial-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, 1)">${translations[currentLang].add_btn}</button>` :
                                    `<div class="qty-controls">
                                        <button class="qty-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, -1)"><i class="fa-solid fa-minus"></i></button>
                                        <span class="qty-num">${qty}</span>
                                        <button class="qty-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, 1)"><i class="fa-solid fa-plus"></i></button>
                                     </div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
            updateLiveTracker();
        }

        function updateQtyUI(id) {
            let container = document.getElementById(`btn-container-${id}`);
            if (!container) return;

            let item = menuItems.find(i => i.id === id);
            if (!item) return;

            let qty = cart[id] ? cart[id].qty : 0;
            let finalPrice = item.discount ? (item.price - item.discount) : item.price;

            if (qty === 0) {
                container.innerHTML = `<button class="add-initial-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, 1)">${translations[currentLang].add_btn}</button>`;
            } else {
                container.innerHTML = `
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, -1)"><i class="fa-solid fa-minus"></i></button>
                        <span class="qty-num">${qty}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, '${escapeHTML(item.name).replace(/'/g, "\\'")}', ${finalPrice}, 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
            }
        }

        function changeQty(id, name, price, change) {
            if (!cart[id]) {
                if (change > 0) cart[id] = { id, name, price, qty: 1 };
            } else {
                cart[id].qty += change;
                if (cart[id].qty <= 0) delete cart[id];
            }
            localStorage.setItem(`cart_${restaurant}`, JSON.stringify(cart));
            updateQtyUI(id);
            updateCartBar();
        }

        function updateCartBar() {
            let itemsArray = Object.values(cart);
            let subtotal = itemsArray.reduce((sum, item) => sum + (item.price * item.qty), 0);

            if (itemsArray.length > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
                let serviceFee = isOnline ? 40 : Math.round(subtotal * 0.10);
                let finalTotal = subtotal + serviceFee;

                let breakdownText = isOnline ? 
                    `${translations[currentLang].subtotal_text}: ${subtotal} ج.م<br>${translations[currentLang].delivery_text}: ${serviceFee} ج.م` :
                    `${translations[currentLang].subtotal_text}: ${subtotal} ج.م<br>${translations[currentLang].service_text}: ${serviceFee} ج.م`;

                document.getElementById('cartBreakdown').innerHTML = breakdownText;
                document.getElementById('cartTotal').innerText = `${finalTotal} ${currentLang === 'ar' ? 'ج.م' : 'EGP'}`;
            } else {
                document.getElementById('cartBar').classList.add('hidden');
            }
        }

        function submitOrder() {
            const btn = document.querySelector(".btn-submit");
            btn.disabled = true;

            setTimeout(() => {
                btn.disabled = false;
            }, 1500);

            if (!currentUser) { document.getElementById('authModal').classList.remove('hidden'); return; }
            let itemsArray = Object.values(cart);
            if (itemsArray.length === 0) return;

            let subtotal = itemsArray.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let serviceFee = isOnline ? 40 : Math.round(subtotal * 0.10);
            let finalTotal = subtotal + serviceFee;

            let orders = JSON.parse(localStorage.getItem(`orders_${restaurant}`)) || [];
            let newOrder = {
                id: Math.floor(100000 + Math.random() * 900000),
                client: currentUser,
                type: orderType,
                table: isOnline ? (currentLang === 'ar' ? 'أونلاين (دليفري)' : 'Online (Delivery)') : table,
                items: itemsArray,
                subtotal, serviceFee, total: finalTotal,
                time: new Date().toLocaleTimeString(currentLang === 'ar' ? 'ar-EG' : 'en-US', {hour: '2-digit', minute:'2-digit'}),
                date: new Date().toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US'),
                status: currentLang === 'ar' ? 'قيد التحضير' : 'Preparing'
            };

            orders.push(newOrder);
            localStorage.setItem(`orders_${restaurant}`, JSON.stringify(orders));

            showCustomAlert(currentLang === 'ar' ? 'تم إرسال طلبك بنجاح!' : 'Order submitted successfully!');
            cart = {};
            localStorage.removeItem(`cart_${restaurant}`);
            updateCartBar();
            loadMenu();
            updateLiveTracker();
        }

        function showCustomAlert(msg) {
            document.getElementById('customAlertMessage').innerText = msg;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }
        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }

        window.addEventListener("storage", (e) => {
            if (e.key === `orders_${restaurant}`) {
                updateLiveTracker();
            }
        });

        window.onload = function() {
            changeLanguage(currentLang);
            updateCartBar();
        };
    </script>
    <div style="text-align: center; padding: 20px 0; background: var(--dark-card, #151B22); border-top: 1px solid var(--border, #30363D); margin-top: 40px; color: var(--gray, #8B949E); font-size: 13px; font-family: 'Cairo', sans-serif;">
        تم التطوير بواسطة <span style="color: var(--primary, #FF4757); font-weight: 700;">Abdelrhman Mohamed | Web Developer</span>
    </div>
</body>
</html>
