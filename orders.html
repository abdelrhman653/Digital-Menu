<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنيو والطلب / Menu & Ordering</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --warning: #FFA502;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 120px; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
        header h1 { font-size: 15px; font-weight: 700; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 480px; margin: 12px auto; padding: 0 10px; }

        #authModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.96);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .auth-box h3 { margin-bottom: 15px; font-size: 15px; color: var(--white); }
        .auth-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--white);
            margin-bottom: 12px;
            font-size: 13px;
        }
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--dark-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
        .history-btn-top {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .live-order-tracker {
            background: linear-gradient(135deg, #1f2937 11%, #111827 100%);
            border: 1px solid var(--warning);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .categories-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }
        .cat-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media(max-width: 340px) { .menu-grid { grid-template-columns: 1fr; } }

        .menu-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card img { width: 100%; height: 105px; object-fit: cover; }
        .menu-content { padding: 8px; }
        .menu-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 8px 8px;
        }
        .menu-price { color: var(--secondary); font-weight: 700; font-size: 13px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px 6px;
        }
        .qty-btn { background: none; border: none; color: var(--white); cursor: pointer; font-size: 12px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .qty-num { font-size: 13px; font-weight: 700; min-width: 15px; text-align: center; }

        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            padding: 12px 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            z-index: 990;
        }
        .cart-details { font-size: 11px; color: var(--gray); margin-bottom: 6px; }
        .cart-main-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-submit {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        #customAlertModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .custom-alert-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="customAlertModal" class="hidden">
        <div class="custom-alert-box">
            <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 16px;"><i class="fa-solid fa-circle-exclamation"></i> Alert</h3>
            <p id="customAlertMessage">Alert Message</p>
            <button class="auth-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <div id="authModal">
        <div class="auth-box">
            <h3 id="authModalTitle">Enter Your Details / تسجيل بيانات العميل</h3>
            <input type="text" id="clientName" class="auth-input" placeholder="Your Name / اسمك الكريم">
            <input type="tel" id="clientPhone" class="auth-input" placeholder="Phone Number / رقم الموبايل">
            <input type="text" id="clientAddress" class="auth-input" placeholder="Address / العنوان بالتفصيل">
            <button class="auth-btn" onclick="saveClientData()">Continue / متابعة للمنيو <i class="fa-solid fa-arrow-left"></i></button>
        </div>
    </div>

    <header>
        <div class="header-brand">
            <img id="headerLogoImg" class="header-logo" src="" alt="Logo">
            <h1 id="headerRestaurantTitle">Menu</h1>
        </div>
    </header>

    <div class="container">
        <div id="liveOrderTrackerContainer"></div>

        <div class="top-bar">
            <div>
                <span id="orderTypeBadge" style="font-weight: 700; font-size: 12px;">Type: Online</span>
                <span id="tableDisplayBadge" style="color: var(--primary); font-weight: 700; font-size: 12px; margin-right: 8px;">Delivery</span>
            </div>
            <button class="history-btn-top" onclick="toggleHistory(true)" id="myOrdersBtnText">My Orders</button>
        </div>

        <div class="categories-row" id="categoriesRowContainer">
            <button class="cat-btn active" onclick="filterCategory('الكل', this)" id="allCatBtnText">All / الكل</button>
        </div>

        <div id="customerMenuGrid" class="menu-grid"></div>
    </div>

    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-details" id="cartDetailsText">0 items selected</div>
        <div class="cart-main-row">
            <div>
                <span style="font-size: 12px; color: var(--gray);" id="totalTextLabel">Total:</span>
                <span id="cartTotalPrice" style="font-weight: 900; font-size: 16px; color: var(--secondary);">0</span>
            </div>
            <button class="btn-submit" onclick="submitOrder()" id="submitOrderBtnText">Submit Order / إرسال الطلب</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantName = urlParams.get('restaurant') || 'default';
        const tableNumber = urlParams.get('table');

        let db = JSON.parse(localStorage.getItem('all_restaurants_db')) || {};
        let restData = db[restaurantName] || {};
        let storeLang = restData.lang || 'ar';

        // ضبط اتجاه الصفحة تلقائياً حسب لغة المكان (عربي RTL أو إنجليزي LTR)
        let htmlRoot = document.getElementById('htmlRoot');
        if (storeLang === 'en') {
            htmlRoot.setAttribute('dir', 'ltr');
            htmlRoot.setAttribute('lang', 'en');
        } else {
            htmlRoot.setAttribute('dir', 'rtl');
            htmlRoot.setAttribute('lang', 'ar');
        }

        let customColor = restData.primaryColor || '#FF4757';
        document.documentElement.style.setProperty('--primary', customColor);

        if (restData.logo) {
            let logoImg = document.getElementById('headerLogoImg');
            logoImg.src = restData.logo;
            logoImg.style.display = 'block';
        }

        let clientData = JSON.parse(localStorage.getItem(`client_${restaurantName}`)) || null;
        let cart = {};
        let activeCategory = 'الكل';

        window.onload = function() {
            if (clientData) {
                document.getElementById('authModal').classList.add('hidden');
            }
            if (tableNumber) {
                document.getElementById('orderTypeBadge').innerText = storeLang === 'en' ? `Type: Dine-in` : `نوع الطلب: صالة`;
                document.getElementById('tableDisplayBadge').innerText = storeLang === 'en' ? `Table ${tableNumber}` : `طاولة ${tableNumber}`;
            } else {
                document.getElementById('orderTypeBadge').innerText = storeLang === 'en' ? `Type: Delivery` : `نوع الطلب: أونلاين`;
                document.getElementById('tableDisplayBadge').innerText = storeLang === 'en' ? `Delivery` : `توصيل دليفري`;
            }

            renderCategories();
            renderMenu();
            checkActiveOrderTracker();
        };

        function saveClientData() {
            let name = document.getElementById('clientName').value.trim();
            let phone = document.getElementById('clientPhone').value.trim();
            let address = document.getElementById('clientAddress').value.trim();

            if (!name || !phone) {
                showCustomAlert(storeLang === 'en' ? 'Please enter your name and phone number!' : 'الرجاء إدخال الاسم ورقم الموبايل!');
                return;
            }

            clientData = { name, phone, address };
            localStorage.setItem(`client_${restaurantName}`, JSON.stringify(clientData));
            document.getElementById('authModal').classList.add('hidden');
        }

        function getCategories() {
            return restData.categories || ["Drinks / مشروبات", "Meals / أكلات"];
        }

        function renderCategories() {
            let container = document.getElementById('categoriesRowContainer');
            let cats = getCategories();
            let html = `<button class="cat-btn active" onclick="filterCategory('الكل', this)">${storeLang === 'en' ? 'All' : 'الكل'}</button>`;
            cats.forEach(c => {
                html += `<button class="cat-btn" onclick="filterCategory('${c}', this)">${c}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            let items = restData.items || [];
            let container = document.getElementById('customerMenuGrid');

            let filtered = activeCategory === 'الكل' ? items : items.filter(i => i.category === activeCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="grid-column: span 2; text-align: center; color: var(--gray); padding: 30px;">${storeLang === 'en' ? 'No items available in this category.' : 'لا توجد أصناف متاحة في هذا التصنيف.'}</p>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                let qty = cart[item.id] ? cart[item.id].qty : 0;
                let finalPrice = item.discount ? (item.price - item.discount) : item.price;

                html += `
                    <div class="menu-card">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="menu-content">
                            <div class="menu-title">${item.name}</div>
                            <div class="menu-price">${finalPrice} ${item.discount ? `<span style="font-size:10px; color:var(--primary); text-decoration:line-through;">${item.price}</span>` : ''}</div>
                        </div>
                        <div class="menu-footer">
                            ${qty === 0 ? `
                                <button class="auth-btn" style="padding: 6px 12px; font-size: 12px;" onclick="changeQty(${item.id}, 1)">${storeLang === 'en' ? 'Add +ing' : 'إضافة ➕'}</button>
                            ` : `
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                                    <span class="qty-num">${qty}</span>
                                    <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            updateCartBar();
        }

        function changeQty(itemId, delta) {
            let items = restData.items || [];
            let item = items.find(i => i.id == itemId);
            if (!item) return;

            if (!cart[itemId]) {
                cart[itemId] = { ...item, qty: 0 };
            }

            cart[itemId].qty += delta;
            if (cart[itemId].qty <= 0) {
                delete cart[itemId];
            }
            renderMenu();
        }

        function updateCartBar() {
            let cartBar = document.getElementById('cartBar');
            let keys = Object.keys(cart);
            if (keys.length === 0) {
                cartBar.classList.add('hidden');
                return;
            }

            cartBar.classList.remove('hidden');
            let totalCount = 0;
            let totalPrice = 0;
            keys.forEach(k => {
                totalCount += cart[k].qty;
                let itemPrice = cart[k].discount ? (cart[k].price - cart[k].discount) : cart[k].price;
                totalPrice += itemPrice * cart[k].qty;
            });

            document.getElementById('cartDetailsText').innerText = storeLang === 'en' ? `${totalCount} items in cart` : `تم اختيار ${totalCount} صنف`;
            document.getElementById('cartTotalPrice').innerText = totalPrice;
        }

        function submitOrder() {
            if (!clientData) {
                document.getElementById('authModal').classList.remove('hidden');
                return;
            }

            let keys = Object.keys(cart);
            if (keys.length === 0) return;

            let orderItems = [];
            let totalPrice = 0;
            keys.forEach(k => {
                let item = cart[k];
                let itemPrice = item.discount ? (item.price - item.discount) : item.price;
                totalPrice += itemPrice * item.qty;
                orderItems.push({ name: item.name, price: itemPrice, qty: item.qty });
            });

            let serviceFee = tableNumber ? 10 : 25; // رسوم خدمة أو توصيل
            let finalTotal = totalPrice + serviceFee;

            let newOrder = {
                id: Date.now().toString().slice(-5),
                client: clientData,
                items: orderItems,
                type: tableNumber ? (storeLang === 'en' ? 'Dine-in' : 'صالة') : (storeLang === 'en' ? 'Delivery' : 'توصيل'),
                table: tableNumber ? `Table ${tableNumber}` : (storeLang === 'en' ? 'Online' : 'أونلاين'),
                serviceFee: serviceFee,
                total: finalTotal,
                status: storeLang === 'en' ? 'Pending' : 'قيد التحضير',
                date: new Date().toLocaleDateString(),
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let ordersKey = `orders_${restaurantName}`;
            let existingOrders = JSON.parse(localStorage.getItem(ordersKey)) || [];
            existingOrders.push(newOrder);
            localStorage.setItem(ordersKey, JSON.stringify(existingOrders));

            cart = {};
            renderMenu();
            checkActiveOrderTracker();
            showCustomAlert(storeLang === 'en' ? 'Order sent successfully! Kitchen is preparing it.' : 'تم إرسال طلبك بنجاح وجاري تحضيره في المطبخ!');
        }

        function checkActiveOrderTracker() {
            let ordersKey = `orders_${restaurantName}`;
            let existingOrders = JSON.parse(localStorage.getItem(ordersKey)) || [];
            if (!clientData) return;

            let userOrders = existingOrders.filter(o => o.client && o.client.phone === clientData.phone);
            if (userOrders.length === 0) return;

            let latestOrder = userOrders[userOrders.length - 1];
            let trackerContainer = document.getElementById('liveOrderTrackerContainer');

            trackerContainer.innerHTML = `
                <div class="live-order-tracker">
                    <div style="font-size: 13px; font-weight: 700; display: flex; justify-content: space-between;">
                        <span>${storeLang === 'en' ? 'Order Status #' : 'حالة الطلب رقم'} #${latestOrder.id}</span>
                        <span style="color: var(--secondary);">${latestOrder.status}</span>
                    </div>
                    <div style="font-size: 11px; color: var(--gray);">${latestOrder.type} | Total: ${latestOrder.total}</div>
                </div>
            `;
        }

        function showCustomAlert(msg) {
            document.getElementById('customAlertMessage').innerText = msg;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }
        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }
    </script>
</body>
</html>
