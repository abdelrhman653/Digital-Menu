    <style>
        :root {
            --primary: #FF4757;
            --primary-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            --secondary: #2ED573;
            --dark-card: #151B22;
            --dark-bg: #0D1117;
            --white: #FFFFFF;
            --gray: #8B949E;
            --border: #30363D;
            --warning: #FFA502;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark-bg); color: var(--white); padding-bottom: 120px; }

        button { touch-action: manipulation; }
        img { user-select: none; -webkit-user-drag: none; }

        header {
            background: var(--dark-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); display: none; }
        header h1 { font-size: 15px; font-weight: 700; }
        #headerRestaurantTitle { color: var(--warning); font-size: 14px; }

        .container { max-width: 480px; margin: 12px auto; padding: 0 10px; }

        #authModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.96);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        .auth-box h3 { margin-bottom: 15px; font-size: 15px; color: var(--white); }
        .auth-input {
            width: 100%;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            color: var(--white);
            margin-bottom: 12px;
            font-size: 13px;
        }
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: var(--dark-card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 13px;
        }
        .history-btn-top {
            background: rgba(255, 71, 87, 0.15);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .categories-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }
        .cat-btn {
            background: var(--dark-card);
            color: var(--gray);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cat-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media(max-width: 340px) { .menu-grid { grid-template-columns: 1fr; } }

        .menu-card {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .menu-card img { width: 100%; height: 105px; object-fit: cover; }
        .menu-content { padding: 8px; }
        .menu-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px 8px 8px;
        }
        .menu-price { color: var(--secondary); font-weight: 700; font-size: 13px; }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px 6px;
        }
        .qty-btn { background: none; border: none; color: var(--white); cursor: pointer; font-size: 12px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .qty-num { font-size: 13px; font-weight: 700; min-width: 15px; text-align: center; }

        .add-initial-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        #historyModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.95);
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .history-card-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .history-item-row {
            background: var(--dark-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--dark-card);
            border-top: 1px solid var(--border);
            padding: 12px 15px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            z-index: 990;
        }
        .cart-details { font-size: 11px; color: var(--gray); margin-bottom: 6px; line-height: 1.5; }
        .cart-main-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-submit {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        #customAlertModal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 17, 23, 0.85);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .custom-alert-box {
            background: var(--dark-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .custom-alert-box p { font-size: 14px; margin-bottom: 20px; color: var(--white); line-height: 1.6; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="customAlertModal" class="hidden">
        <div class="custom-alert-box">
            <h3 style="color: var(--primary); margin-bottom: 10px; font-size: 16px;"><i class="fa-solid fa-circle-exclamation"></i> <span data-i18n="alert_title">تنبيه</span></h3>
            <p id="customAlertMessage">رسالة التنبيه هنا</p>
            <button class="auth-btn" onclick="closeCustomAlert()" data-i18n="btn_ok">حسناً</button>
        </div>
    </div>

    <div id="authModal" class="hidden">
        <div class="auth-box">
            <div id="authChoiceView">
                <h3 id="authModalTitle" style="margin-bottom: 20px;" data-i18n="welcome_auth">مرحباً بك في المنيو</h3>
                <button class="auth-btn" style="margin-bottom: 10px;" onclick="showAuthForm('login')" data-i18n="login_btn">تسجيل الدخول</button>
                <button class="auth-btn" style="background: transparent; border: 1px solid var(--primary); color: var(--white); margin-bottom: 10px;" onclick="showAuthForm('register')" data-i18n="register_btn">إنشاء حساب جديد</button>
                <button class="auth-btn" style="background: transparent; border: 1px solid var(--gray); color: var(--gray);" onclick="showAuthForm('forgot')" data-i18n="forgot_password_btn">نسيت كلمة المرور</button>
            </div>

            <div id="loginFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="login_title">تسجيل الدخول</h3>
                <input type="tel" id="loginPhone" class="auth-input" placeholder="رقم الموبايل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="loginPassword" class="auth-input" placeholder="كلمة المرور" data-i18n-placeholder="password_placeholder">
                <button class="auth-btn" onclick="processLogin()" data-i18n="enter_btn">دخول</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="registerFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="register_title">إنشاء حساب جديد</h3>
                <input type="text" id="regName" class="auth-input" placeholder="اسمك الكريم" data-i18n-placeholder="name_placeholder">
                <input type="tel" id="regPhone" class="auth-input" placeholder="رقم الموبايل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="regPassword" class="auth-input" placeholder="كلمة المرور" data-i18n-placeholder="password_placeholder">
                <input type="password" id="regConfirmPassword" class="auth-input" placeholder="تأكيد كلمة المرور" data-i18n-placeholder="confirm_password_placeholder">
                <input type="text" id="regAddress" class="auth-input" placeholder="العنوان بالتفصيل (للأونلاين فقط)" data-i18n-placeholder="address_placeholder">
                <button class="auth-btn" onclick="processRegister()" data-i18n="create_account_btn">إنشاء الحساب</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="forgotFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="forgot_title">استعادة كلمة المرور</h3>
                <input type="tel" id="forgotPhone" class="auth-input" placeholder="رقم الموبايل المسجل" data-i18n-placeholder="phone_placeholder">
                <input type="password" id="forgotNewPassword" class="auth-input" placeholder="كلمة المرور الجديدة" data-i18n-placeholder="new_password_placeholder">
                <input type="password" id="forgotConfirmPassword" class="auth-input" placeholder="تأكيد كلمة المرور الجديدة" data-i18n-placeholder="confirm_new_password_placeholder">
                <button class="auth-btn" onclick="processForgotPassword()" data-i18n="reset_password_btn">تحديث كلمة المرور</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="showAuthForm('choice')" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="editProfileFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="edit_profile_title">تعديل البيانات الشخصية</h3>
                <input type="text" id="editName" class="auth-input" placeholder="الاسم الكريم" data-i18n-placeholder="name_placeholder">
                <input type="text" id="editAddress" class="auth-input" placeholder="العنوان بالتفصيل" data-i18n-placeholder="address_placeholder">
                <button class="auth-btn" onclick="processEditProfile()" data-i18n="save_changes_btn">حفظ التعديلات</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="toggleEditProfile(false)" data-i18n="back_btn">الرجوع</button>
            </div>

            <div id="changePasswordFormView" class="hidden">
                <h3 style="margin-bottom: 15px;" data-i18n="change_password_title">تغيير كلمة المرور</h3>
                <input type="password" id="currentPassword" class="auth-input" placeholder="كلمة المرور الحالية" data-i18n-placeholder="current_password_placeholder">
                <input type="password" id="newPassword" class="auth-input" placeholder="كلمة المرور الجديدة" data-i18n-placeholder="new_password_placeholder">
                <input type="password" id="confirmNewPassword" class="auth-input" placeholder="تأكيد كلمة المرور الجديدة" data-i18n-placeholder="confirm_new_password_placeholder">
                <button class="auth-btn" onclick="processChangePassword()" data-i18n="update_password_btn">تحديث كلمة المرور</button>
                <button style="background: none; border: none; color: var(--gray); margin-top: 10px; cursor: pointer; font-size: 12px;" onclick="toggleChangePassword(false)" data-i18n="back_btn">الرجوع</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="hidden">
        <div class="history-card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 15px;"><i class="fa-solid fa-clipboard-list" style="color: var(--primary);"></i> <span data-i18n="my_orders">سجل طلباتي السابقة</span></h3>
                <button onclick="toggleHistory(false)" style="background: none; border: none; color: var(--white); font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="display: flex; gap: 6px; margin-bottom: 15px;">
                <button onclick="toggleEditProfile(true)" style="flex: 1; background: rgba(255, 165, 2, 0.2); color: var(--warning); border: 1px solid var(--warning); padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px;" data-i18n="btn_edit_profile">تعديل البيانات</button>
                <button onclick="toggleChangePassword(true)" style="flex: 1; background: rgba(46, 213, 115, 0.2); color: var(--secondary); border: 1px solid var(--secondary); padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px;" data-i18n="btn_change_password">تغيير كلمة المرور</button>
            </div>
            <div id="historyListContainer"></div>
            <button onclick="logoutClient()" style="background: rgba(255, 71, 87, 0.2); color: var(--primary); border: 1px solid var(--primary); width: 100%; padding: 8px; border-radius: 8px; font-weight: 700; margin-top: 10px; cursor: pointer; font-size: 12px;" data-i18n="btn_logout_client">تسجيل خروج</button>
        </div>
    </div>

    <header>
        <div class="header-brand">
            <img id="headerLogoImg" class="header-logo" src="" alt="الشعار">
            <h1 id="headerRestaurantTitle">المنيو والطلب</h1>
        </div>
        <select id="langSelectOrders" onchange="changeLanguage(this.value)" style="width: 100px; padding: 4px; font-size: 11px; background: var(--dark-bg); color: #fff; border: 1px solid var(--border); border-radius: 6px;">
            <option value="ar">العربية 🇸🇦</option>
            <option value="en">English 🇺🇸</option>
        </select>
    </header>

    <div class="container">
        <div id="liveOrderTrackerContainer"></div>

        <div class="top-bar">
            <div>
                <span id="orderTypeBadge" style="font-weight: 700; font-size: 12px;">نوع الطلب: أونلاين</span>
                <span id="tableDisplayBadge" style="color: var(--primary); font-weight: 700; font-size: 12px; margin-right: 8px;">توصيل دليفري</span>
            </div>
            <button class="history-btn-top" onclick="toggleHistory(true)"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="btn_my_orders">طلباتي</span></button>
        </div>

        <div class="categories-row" id="categoriesRowContainer">
            <button class="cat-btn active" onclick="filterCategory('All', this)" data-i18n="all_cat">الكل</button>
        </div>

        <div id="customerMenuGrid" class="menu-grid"></div>
    </div>

    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-details" id="cartBreakdown"></div>
        <div class="cart-main-row">
            <div>
                <div style="font-size: 10px; color: var(--gray);" data-i18n="final_total">الإجمالي النهائي</div>
                <div style="font-weight: 900; color: var(--secondary); font-size: 15px;" id="cartTotal">0.0 ج.م</div>
            </div>
            <button class="btn-submit" onclick="submitOrder()"><span data-i18n="btn_submit_order">إرسال الطلب</span> <i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

                fill_all_fields: "Please fill all required fields correctly.",
                profile_updated: "Profile updated successfully.",
                password_updated: "Password updated successfully.",
                current_password_incorrect: "Current password is incorrect."
            }
        };

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showCustomAlert(msg) {
            document.getElementById('customAlertMessage').innerText = msg;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('app_lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langSelectOrders').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                let key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                let key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            if (typeof categories !== 'undefined') loadCategoriesBar();
            if (typeof menuItems !== 'undefined') loadMenu();
            updateCartBar();
        }

        const urlParams = new URLSearchParams(window.location.search);
        const restaurant = urlParams.get('restaurant') || 'default';
        document.getElementById('headerRestaurantTitle').innerText = restaurant.toUpperCase();

        const table = urlParams.get('table');
        const isOnline = !table || table === 'online';
        let orderType = isOnline ? (currentLang === 'ar' ? 'أونلاين' : 'Online') : (currentLang === 'ar' ? 'صالة' : 'Dine-In');
        document.getElementById('orderTypeBadge').innerText = `${currentLang === 'ar' ? 'نوع الطلب' : 'Order Type'}: ${orderType}`;
        document.getElementById('tableDisplayBadge').innerText = isOnline ? (currentLang === 'ar' ? 'توصيل دليفري' : 'Delivery') : `Table: ${table}`;

        let menuItems = [];
        let categories = [];
        let currentUser = JSON.parse(localStorage.getItem(`current_client_${restaurant}`)) || null;
        let cart = JSON.parse(localStorage.getItem(`cart_${restaurant}`)) || {};
        let selectedCategory = 'All';
        let activeOrderUnsubscribe = null;

        window.addEventListener('firebase-loaded', async () => {
            try {
                const restDocRef = window.firebaseModules.doc(window.db, "restaurants", restaurant);
                const restSnap = await window.firebaseModules.getDoc(restDocRef);
                if (restSnap.exists()) {
                    let restData = restSnap.data();
                    if (restData.primaryColor) {
                        document.documentElement.style.setProperty('--primary', restData.primaryColor);
                    }
                    if (restData.logo) {
                        let logoImg = document.getElementById('headerLogoImg');
                        logoImg.src = restData.logo;
                        logoImg.style.display = 'block';
                    }
                    if (restData.categories) categories = restData.categories;
                    if (restData.items) menuItems = restData.items;
                }
            } catch(e) { console.error(e); }

            if(categories.length === 0) categories = ["مشروبات / Drinks", "أكلات / Foods"];
            loadCategoriesBar();
            loadMenu();

            if (!currentUser) {
                document.getElementById('authModal').classList.remove('hidden');
            } else {
                document.getElementById('authModal').classList.add('hidden');
                if (isOnline && !currentUser.address) {
                    let promptAddress = prompt(currentLang === 'ar' ? 'برجاء إدخال عنوان التوصيل بالتفصيل:' : 'Please enter your delivery address:');
                    if (promptAddress) {
                        currentUser.address = promptAddress;
                        localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
                        updateUserInFirestore(currentUser);
                    }
                }
                listenLiveOrders();
            }
            updateCartBar();
        });

        async function updateUserInFirestore(userObj) {
            try {
                await window.firebaseModules.setDoc(window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, userObj.phone), userObj, { merge: true });
            } catch(e) { console.error(e); }
        }

        function showAuthForm(view) {
            document.getElementById('authChoiceView').classList.add('hidden');
            document.getElementById('loginFormView').classList.add('hidden');
            document.getElementById('registerFormView').classList.add('hidden');
            document.getElementById('forgotFormView').classList.add('hidden');
            document.getElementById('editProfileFormView').classList.add('hidden');
            document.getElementById('changePasswordFormView').classList.add('hidden');

            if (view === 'choice') {
                document.getElementById('authChoiceView').classList.remove('hidden');
            } else if (view === 'login') {
                document.getElementById('loginFormView').classList.remove('hidden');
            } else if (view === 'register') {
                document.getElementById('registerFormView').classList.remove('hidden');
                if (!isOnline) {
                    document.getElementById('regAddress').style.display = 'none';
                }
            } else if (view === 'forgot') {
                document.getElementById('forgotFormView').classList.remove('hidden');
            }
        }

        function toggleEditProfile(show) {
            if (show) {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authChoiceView').classList.add('hidden');
                document.getElementById('editProfileFormView').classList.remove('hidden');
                document.getElementById('editName').value = currentUser.name || '';
                document.getElementById('editAddress').value = currentUser.address || '';
                toggleHistory(false);
            } else {
                document.getElementById('editProfileFormView').classList.add('hidden');
                document.getElementById('authModal').classList.add('hidden');
            }
        }

        function toggleChangePassword(show) {
            if (show) {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authChoiceView').classList.add('hidden');
                document.getElementById('changePasswordFormView').classList.remove('hidden');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmNewPassword').value = '';
                toggleHistory(false);
            } else {
                document.getElementById('changePasswordFormView').classList.add('hidden');
                document.getElementById('authModal').classList.add('hidden');
            }
        }

        async function processRegister() {
            let name = document.getElementById('regName').value.trim();
            let phone = document.getElementById('regPhone').value.trim();
            let password = document.getElementById('regPassword').value.trim();
            let confirmPassword = document.getElementById('regConfirmPassword').value.trim();
            let address = isOnline ? document.getElementById('regAddress').value.trim() : `Dine-In Table ${table}`;

            if (!name || phone.length < 10 || !password || !confirmPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (password !== confirmPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            try {
                let userRef = window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, phone);
                let userSnap = await window.firebaseModules.getDoc(userRef);

                if (userSnap.exists()) {
                    showCustomAlert(translations[currentLang].phone_already_registered);
                    return;
                }

                let newUser = {
                    name,
                    phone,
                    password,
                    address,
                    createdAt: new Date().toISOString()
                };

                await window.firebaseModules.setDoc(userRef, newUser);

                currentUser = { name, phone, address };
                localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
                
                document.getElementById('authModal').classList.add('hidden');
                loadCategoriesBar();
                loadMenu();
                listenLiveOrders();
            } catch(e) {
                showCustomAlert(e.message);
            }
        }

        async function processLogin() {
            let phone = document.getElementById('loginPhone').value.trim();
            let password = document.getElementById('loginPassword').value.trim();

            if (!phone || !password) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            try {
                let userRef = window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, phone);
                let userSnap = await window.firebaseModules.getDoc(userRef);

                if (!userSnap.exists()) {
                    showCustomAlert(translations[currentLang].phone_not_registered);
                    return;
                }

                let userData = userSnap.data();
                if (userData.password !== password) {
                    showCustomAlert(translations[currentLang].wrong_password);
                    return;
                }

                currentUser = { name: userData.name, phone: userData.phone, address: userData.address || (isOnline ? '' : `Dine-In Table ${table}`) };
                localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));
                
                document.getElementById('authModal').classList.add('hidden');
                loadCategoriesBar();
                loadMenu();
                listenLiveOrders();
            } catch(e) {
                showCustomAlert(e.message);
            }
        }

        async function processForgotPassword() {
            let phone = document.getElementById('forgotPhone').value.trim();
            let newPassword = document.getElementById('forgotNewPassword').value.trim();
            let confirmNewPassword = document.getElementById('forgotConfirmPassword').value.trim();

            if (!phone || !newPassword || !confirmNewPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            try {
                let userRef = window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, phone);
                let userSnap = await window.firebaseModules.getDoc(userRef);

                if (!userSnap.exists()) {
                    showCustomAlert(translations[currentLang].phone_not_registered);
                    return;
                }

                await window.firebaseModules.updateDoc(userRef, { password: newPassword });
                showCustomAlert(translations[currentLang].password_updated);
                showAuthForm('login');
            } catch(e) {
                showCustomAlert(e.message);
            }
        }

        async function processEditProfile() {
            let name = document.getElementById('editName').value.trim();
            let address = document.getElementById('editAddress').value.trim();

            if (!name) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            try {
                let userRef = window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, currentUser.phone);
                await window.firebaseModules.updateDoc(userRef, { name, address });

                currentUser.name = name;
                currentUser.address = address;
                localStorage.setItem(`current_client_${restaurant}`, JSON.stringify(currentUser));

                showCustomAlert(translations[currentLang].profile_updated);
                toggleEditProfile(false);
            } catch(e) {
                showCustomAlert(e.message);
            }
        }

        async function processChangePassword() {
            let currentPassword = document.getElementById('currentPassword').value.trim();
            let newPassword = document.getElementById('newPassword').value.trim();
            let confirmNewPassword = document.getElementById('confirmNewPassword').value.trim();

            if (!currentPassword || !newPassword || !confirmNewPassword) {
                showCustomAlert(translations[currentLang].fill_all_fields);
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showCustomAlert(translations[currentLang].passwords_not_match);
                return;
            }

            try {
                let userRef = window.firebaseModules.doc(window.db, `restaurants/${restaurant}/users`, currentUser.phone);
                let userSnap = await window.firebaseModules.getDoc(userRef);

                if (!userSnap.exists() || userSnap.data().password !== currentPassword) {
                    showCustomAlert(translations[currentLang].current_password_incorrect);
                    return;
                }

                await window.firebaseModules.updateDoc(userRef, { password: newPassword });
                showCustomAlert(translations[currentLang].password_updated);
                toggleChangePassword(false);
            } catch(e) {
                showCustomAlert(e.message);
            }
        }

        function logoutClient() {
            localStorage.removeItem(`current_client_${restaurant}`);
            location.reload();
        }

        function toggleHistory(show) {
            let modal = document.getElementById('historyModal');
            if (show) { renderClientHistory(); modal.classList.remove('hidden'); }
            else { modal.classList.add('hidden'); }
        }

        async function renderClientHistory() {
            let container = document.getElementById('historyListContainer');
            container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 20px; font-size: 13px;">جاري التحميل...</p>`;

            try {
                let q = window.firebaseModules.query(window.firebaseModules.collection(window.db, `restaurants/${restaurant}/orders`), window.firebaseModules.where("client.phone", "==", currentUser.phone));
                let querySnapshot = await window.firebaseModules.getDocs(q);
                let myOrders = [];
                querySnapshot.forEach(d => myOrders.push({ id: d.id, ...d.data() }));

                if (myOrders.length === 0) {
                    container.innerHTML = `<p style="color: var(--gray); text-align: center; padding: 20px; font-size: 13px;">لا توجد طلبات سابقة.</p>`;
                    return;
                }

                myOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

                container.innerHTML = myOrders.map(o => `
                    <div class="history-item-row">
                        <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 6px;">
                            <span>طلب #${o.id.slice(-4)}</span>
                            <span style="color: var(--warning);">${o.status || 'قيد المعالجة'}</span>
                        </div>
                        <div style="color: var(--gray); font-size: 11px; margin-bottom: 6px;">${new Date(o.createdAt).toLocaleString()}</div>
                        <div style="border-top: 1px solid var(--border); padding-top: 6px; font-size: 12px;">
                            ${(o.items || []).map(i => `${i.name} × ${i.quantity}`).join('، ')}
                        </div>
                        <div style="margin-top: 6px; font-weight: 700; color: var(--secondary);">الإجمالي: ${o.total} ج.م</div>
                    </div>
                `).join('');
            } catch(e) {
                container.innerHTML = `<p style="color: var(--primary); text-align: center; padding: 20px; font-size: 13px;">فشل تحميل الطلبات.</p>`;
            }
        }

        function loadCategoriesBar() {
            let container = document.getElementById('categoriesRowContainer');
            let html = `<button class="cat-btn ${selectedCategory === 'All' ? 'active' : ''}" onclick="filterCategory('All', this)">${translations[currentLang].all_cat}</button>`;
            categories.forEach(cat => {
                html += `<button class="cat-btn ${selectedCategory === cat ? 'active' : ''}" onclick="filterCategory('${escapeHTML(cat)}', this)">${escapeHTML(cat)}</button>`;
            });
            container.innerHTML = html;
        }

        function filterCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadMenu();
        }

        function loadMenu() {
            let container = document.getElementById('customerMenuGrid');
            let filtered = selectedCategory === 'All' ? menuItems : menuItems.filter(i => i.category === selectedCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--gray); grid-column: span 2; text-align: center; padding: 20px; font-size: 13px;">لا توجد أصناف متاحة.</p>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                let price = item.discount ? (item.price - item.discount) : item.price;
                let qty = cart[item.id] ? cart[item.id].quantity : 0;

                return `
                    <div class="menu-card">
                        <img src="${escapeHTML(item.img || 'https://images.unsplash.com/photo-1587049352847-4a222e784d38?w=500')}" alt="${escapeHTML(item.name)}">
                        <div class="menu-content">
                            <div class="menu-title">${escapeHTML(item.name)}</div>
                            <div class="menu-price">${price} ج.م</div>
                        </div>
                        <div class="menu-footer">
                            ${qty === 0 ? `
                                <button class="add-initial-btn" onclick="updateCartItem('${item.id}', 1)">${translations[currentLang].add_btn}</button>
                            ` : `
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="updateCartItem('${item.id}', -1)"><i class="fa-solid fa-minus"></i></button>
                                    <span class="qty-num">${qty}</span>
                                    <button class="qty-btn" onclick="updateCartItem('${item.id}', 1)"><i class="fa-solid fa-plus"></i></button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateCartItem(itemId, change) {
            let item = menuItems.find(i => i.id == itemId);
            if (!item) return;

            if (!cart[itemId]) {
                if (change > 0) {
                    cart[itemId] = {
                        id: item.id,
                        name: item.name,
                        price: item.discount ? (item.price - item.discount) : item.price,
                        quantity: 1
                    };
                }
            } else {
                cart[itemId].quantity += change;
                if (cart[itemId].quantity <= 0) {
                    delete cart[itemId];
                }
            }

            localStorage.setItem(`cart_${restaurant}`, JSON.stringify(cart));
            loadMenu();
            updateCartBar();
        }

        function updateCartBar() {
            let cartBar = document.getElementById('cartBar');
            let breakdown = document.getElementById('cartBreakdown');
            let totalElem = document.getElementById('cartTotal');

            let keys = Object.keys(cart);
            if (keys.length === 0) {
                cartBar.classList.add('hidden');
                return;
            }

            cartBar.classList.remove('hidden');
            let subtotal = 0;
            let itemsCount = 0;

            keys.forEach(k => {
                subtotal += cart[k].price * cart[k].quantity;
                itemsCount += cart[k].quantity;
            });

            let deliveryFee = isOnline ? 15 : 0;
            let serviceFee = !isOnline ? subtotal * 0.1 : 0;
            let finalTotal = subtotal + deliveryFee + serviceFee;

            breakdown.innerHTML = `
                ${itemsCount} أصناف | ${translations[currentLang].subtotal_text}: ${subtotal.toFixed(1)} ج.م<br>
                ${isOnline ? `${translations[currentLang].delivery_text}: ${deliveryFee} ج.م` : `${translations[currentLang].service_text} (10%): ${serviceFee.toFixed(1)} ج.م`}
            `;
            totalElem.innerText = `${finalTotal.toFixed(1)} ج.م`;
        }

        async function submitOrder() {
            let keys = Object.keys(cart);
            if (keys.length === 0) return;

            let subtotal = 0;
            let orderItemsList = [];
            keys.forEach(k => {
                subtotal += cart[k].price * cart[k].quantity;
                orderItemsList.push(cart[k]);
            });

            let deliveryFee = isOnline ? 15 : 0;
            let serviceFee = !isOnline ? subtotal * 0.1 : 0;
            let finalTotal = subtotal + deliveryFee + serviceFee;

            let orderData = {
                restaurant,
                client: currentUser,
                items: orderItemsList,
                orderType: isOnline ? 'Delivery' : 'Dine-In',
                table: table || 'Online',
                subtotal,
                fees: isOnline ? deliveryFee : serviceFee,
                total: finalTotal,
                status: 'قيد المعالجة',
                createdAt: new Date().toISOString()
            };

            try {
                let docRef = await window.firebaseModules.addDoc(window.firebaseModules.collection(window.db, `restaurants/${restaurant}/orders`), orderData);
                cart = {};
                localStorage.removeItem(`cart_${restaurant}`);
                updateCartBar();
                loadMenu();
                showCustomAlert(currentLang === 'ar' ? 'تم إرسال طلبك بنجاح! تابع حالته من قسم طلباتي.' : 'Order submitted successfully!');
                listenLiveOrders();
            } catch(e) {
                showCustomAlert(currentLang === 'ar' ? 'حدث خطأ أثناء إرسال الطلب.' : 'Error submitting order.');
            }
        }

        function listenLiveOrders() {
            if (!currentUser) return;
            if (activeOrderUnsubscribe) activeOrderUnsubscribe();

            try {
                let q = window.firebaseModules.query(window.firebaseModules.collection(window.db, `restaurants/${restaurant}/orders`), window.firebaseModules.where("client.phone", "==", currentUser.phone));
                activeOrderUnsubscribe = window.firebaseModules.onSnapshot(q, (snapshot) => {
                    let activeOrders = [];
                    snapshot.forEach(d => {
                        let data = d.data();
                        if (data.status !== 'مكتمل' && data.status !== 'ملغي') {
                            activeOrders.push({ id: d.id, ...data });
                        }
                    });

                    let tracker = document.getElementById('liveOrderTrackerContainer');
                    if (activeOrders.length === 0) {
                        tracker.innerHTML = '';
                        return;
                    }

                    let latest = activeOrders[activeOrders.length - 1];
                    tracker.innerHTML = `
                        <div style="background: rgba(46, 213, 115, 0.15); border: 1px solid var(--secondary); padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 13px;">
                            <div style="font-weight: 700; color: var(--secondary); margin-bottom: 4px;"><i class="fa-solid fa-spinner fa-spin"></i> حالة طلبك الحالي: ${latest.status}</div>
                            <div style="color: var(--gray); font-size: 11px;">رقم الطلب: #${latest.id.slice(-4)} | الإجمالي: ${latest.total} ج.م</div>
                        </div>
                    `;
                });
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
