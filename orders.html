<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المنيو الرقمي والطلب المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getFirestore, doc, getDoc, onSnapshot, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkDKnpfuxVuRH4g9FwlMBZWCaH3NAfFSs",
            authDomain: "digital-menu-8d2b4.firebaseapp.com",
            projectId: "digital-menu-8d2b4",
            storageBucket: "digital-menu-8d2b4.firebasestorage.app",
            messagingSenderId: "436566477044",
            appId: "1:436566477044:web:2a86cfb212b44229f0b6a1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.FB = { db, doc, getDoc, onSnapshot, collection, addDoc, getDocs, query, where };
        window.dispatchEvent(new Event('firebase-ready-orders'));
    </script>

    <style>
        :root {
            --primary: #FF4757;
            --secondary: #2ED573;
            --accent: #FFA502;
            --bg-color: #0c090a;
            --surface-color: rgba(25, 20, 20, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-muted: #a4b0be;
            --input-bg: rgba(0, 0, 0, 0.3);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --radius-lg: 20px;
            --radius-md: 14px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-user-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(241, 245, 249, 0.9);
            --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        .hidden { display: none !important; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 90px; transition: var(--transition); }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--surface-color); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color); padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand-box { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); display: none; }
        .brand-title { font-size: 18px; font-weight: 800; }
        .table-badge { background: var(--primary); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }

        .theme-toggle-btn {
            background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: var(--transition);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 20px 15px; }

        /* Search & Categories */
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 14px 45px 14px 16px; border-radius: 16px; font-size: 14px; outline: none;
        }
        .search-box i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 24px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .cat-chip {
            white-space: nowrap; padding: 10px 20px; border-radius: 30px; background: var(--surface-color);
            border: 1px solid var(--border-color); color: var(--text-muted); font-size: 13px; font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .cat-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        /* Items Grid */
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .item-card {
            background: var(--surface-color); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            overflow: hidden; display: flex; flex-direction: column; transition: var(--transition);
        }
        .item-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
        .item-img { width: 100%; height: 140px; object-fit: cover; }
        .item-details { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .item-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .item-price { font-size: 16px; font-weight: 800; color: var(--secondary); margin-bottom: 12px; }
        .add-btn {
            background: var(--primary); color: #fff; border: none; padding: 10px; border-radius: 12px;
            font-weight: 700; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; transition: var(--transition);
        }
        .add-btn:hover { opacity: 0.9; }

        /* Floating Cart Bar */
        .cart-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 600px;
            background: var(--primary); color: #fff; padding: 14px 24px; border-radius: 30px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            cursor: pointer; z-index: 500; font-weight: 800;
        }

        /* Cart Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); z-index: 999; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: var(--transition);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .cart-modal {
            background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 24px 24px 0 0;
            width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 24px; transform: translateY(100%); transition: var(--transition);
        }
        .modal-overlay.active .cart-modal { transform: translateY(0); }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .qty-controls { display: flex; align-items: center; gap: 10px; background: var(--input-bg); padding: 4px 10px; border-radius: 10px; }
        .qty-btn { background: none; border: none; color: var(--text-color); font-size: 16px; cursor: pointer; padding: 2px 6px; }

        /* Inputs */
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none;
        }

        .btn-submit {
            background: var(--secondary); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 14px;
            font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: var(--transition);
        }

        .live-order-banner{position:sticky;top:77px;z-index:90;max-width:800px;margin:10px auto 0;padding:14px 16px;background:var(--surface-color);border:1px solid var(--primary);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(14px);}
        .live-order-banner.hidden{display:none!important}.live-order-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.live-order-status{font-size:15px;font-weight:900;color:var(--accent)}.live-order-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.live-order-step{height:6px;border-radius:99px;background:var(--border-color);transition:.3s}.live-order-step.active{background:var(--primary)}.account-actions{display:flex;align-items:center;gap:8px}.header-action-btn{background:var(--input-bg);border:1px solid var(--border-color);color:var(--text-color);border-radius:12px;padding:8px 11px;cursor:pointer;font-weight:800;font-size:12px}.header-action-btn:hover{border-color:var(--primary);color:var(--primary)}.history-list{display:flex;flex-direction:column;gap:12px}.history-card{background:var(--surface-color);border:1px solid var(--border-color);border-radius:16px;padding:14px}.history-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.history-status{font-weight:800;color:var(--secondary)}.saved-customer-box{background:var(--input-bg);border:1px dashed var(--border-color);border-radius:12px;padding:12px;margin-bottom:15px;color:var(--text-muted);font-size:12px}.empty-cart { text-align: center; padding: 40px 0; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand-box">
            <img id="restLogo" class="brand-logo" src="" alt="Logo">
            <div>
                <div class="brand-title" id="restName">اسم المطعم</div>
                <div id="tableDisplay" class="table-badge">طلب عام</div>
            </div>
        </div>
        <div class="account-actions">
            <button class="header-action-btn" onclick="openHistoryModal()"><i class="fa-solid fa-clock-rotate-left"></i> السجل</button>
            <button class="header-action-btn" onclick="customerLogout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            <button class="theme-toggle-btn" onclick="toggleUserTheme()"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <div id="liveOrderBanner" class="live-order-banner hidden">
        <div class="live-order-top"><div><div style="font-size:11px;color:var(--text-muted);">حالة طلبك المباشرة</div><div id="liveOrderNumber" style="font-weight:900;">#------</div></div><div id="liveOrderStatus" class="live-order-status">قيد الانتظار ⏳</div></div>
        <div class="live-order-progress"><span class="live-order-step active"></span><span class="live-order-step"></span><span class="live-order-step"></span><span class="live-order-step"></span></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        
        <!-- Search -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن صنف أو مشروب..." onkeyup="filterItems()">
        </div>

        <!-- Categories -->
        <div class="categories-scroll" id="categoriesScroll">
            <!-- Dynamic Category Chips -->
        </div>

        <!-- Items Grid -->
        <div class="items-grid" id="itemsGrid">
            <!-- Dynamic Items -->
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div id="cartBar" class="cart-bar hidden" onclick="openCartModal()">
        <div><i class="fa-solid fa-cart-shopping"></i> السلة (<span id="cartCount">0</span>)</div>
        <div id="cartTotalBar">0 ج.م</div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal-overlay">
        <div class="cart-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 20px;"><i class="fa-solid fa-bag-shopping" style="color:var(--primary);"></i> طلبك الحالي</h3>
                <button onclick="closeCartModal()" style="background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="cartItemsList"></div>

            <div id="checkoutFormSection" style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                <div class="input-group" id="custNameGroup">
                    <label>اسمك الكريـم</label>
                    <input type="text" id="custName" placeholder="أدخل اسمك...">
                </div>
                <div class="input-group" id="custPhoneGroup">
                    <label>رقم التليفون</label>
                    <input type="tel" id="custPhone" placeholder="010XXXXXXXX">
                </div>
                <input type="hidden" id="orderTypeSelect" value="delivery">
                <div class="input-group hidden" id="addressGroup">
                    <label>عنوان التوصيل التفصيلي</label>
                    <input type="text" id="custAddress" placeholder="المنطقة، الشارع، العمارة...">
                </div>
                <div id="savedCustomerBox" class="saved-customer-box hidden"></div>
                <div class="input-group">
                    <label><i class="fa-solid fa-money-bill-wave"></i> طريقة الدفع</label>
                    <select id="paymentMethodSelect" disabled style="background: var(--input-bg); opacity: 0.9;">
                        <option value="cash" selected>💵 الدفع عند الاستلام (Cash on Delivery)</option>
                    </select>
                    <small style="color: var(--text-muted); font-size: 11px; display: block; margin-top: 4px;">* الدفع نقداً عند الاستلام أو بالطاولة حالياً.</small>
                </div>
                <div class="input-group">
                    <label>ملاحظات خاصة</label>
                    <textarea id="orderNotes" rows="2" placeholder="بدون مخلل، زيادة صوص..."></textarea>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; margin: 15px 0;">
                    <span>الإجمالي النهائي:</span>
                    <span id="modalTotalAmount" style="color: var(--secondary);">0 ج.م</span>
                </div>

                <button class="btn-submit" id="submitOrderBtn" onclick="submitOrder()"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب الآن</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal-overlay">
        <div class="cart-modal" style="border-radius:24px;max-width:600px;text-align:right;padding:25px 20px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;"><h3 style="font-size:20px;"><i class="fa-solid fa-clock-rotate-left" style="color:var(--primary);"></i> سجل طلباتك</h3><button onclick="closeHistoryModal()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="historyList" class="history-list"><p class="empty-cart">جاري تحميل السجل...</p></div>
        </div>
    </div>

    <!-- Order Status Modal -->
    <div id="statusModal" class="modal-overlay">
        <div class="cart-modal" style="border-radius:24px; max-width:450px; text-align:center; padding:35px 24px;">
            <div style="font-size: 55px; color: var(--secondary); margin-bottom: 15px;"><i class="fa-solid fa-circle-check"></i></div>
            <h2 style="font-size: 22px; margin-bottom: 10px;">تم إرسال طلبك بنجاح!</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">رقم الطلب: <strong id="submittedOrderId" style="color:var(--primary);">#---</strong></p>
            
            <div style="background: var(--input-bg); padding: 15px; border-radius: 16px; margin-bottom: 20px;">
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">حالة الطلب الحالية:</p>
                <div id="liveStatusText" style="font-size: 18px; font-weight: 800; color: var(--accent);">قيد الانتظار ⏳</div>
            </div>

            <button class="btn-submit" style="background: var(--primary);" onclick="closeStatusModal()">حسناً، الرجوع للمنيو</button>
        </div>
    </div>

    <!-- Script -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('restaurant') || 'default';
        const tableNum = urlParams.get('table');

        let restaurantData = null;
        let selectedCategory = 'all';
        let cart = [];
        let userTheme = localStorage.getItem('user_app_theme') || 'dark';
        let customerSession = null;
        let historyOrders = [];
        let activeOrderUnsubscribers = {};
        const customerSessionKey = `customer_session_${encodeURIComponent(restaurantId)}`;
        const activeOrdersKey = `customer_active_orders_${encodeURIComponent(restaurantId)}`;
        const statusMeta = {
            pending:{text:'قيد الانتظار ⏳',level:1}, preparing:{text:'جاري التجهيز بالمطبخ 👨‍🍳',level:2},
            ready:{text:'طلبك جاهز الآن! 🔔',level:3}, delivered:{text:'تم التسليم بنجاح ✅',level:4},
            canceled:{text:'تم إلغاء الطلب ❌',level:4}
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function toggleUserTheme() {
            userTheme = userTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('user_app_theme', userTheme);
            applyThemeUI();
        }

        function applyThemeUI() {
            if (userTheme === 'light') {
                document.documentElement.setAttribute('data-user-theme', 'light');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            } else {
                document.documentElement.removeAttribute('data-user-theme');
                document.getElementById('themeIcon').className = 'fa-solid fa-moon';
            }
        }

        window.addEventListener('firebase-ready-orders', () => {
            applyThemeUI();
            configureOrderMode();
            loadCustomerSession();
            configureOrderMode();

            window.FB.onSnapshot(window.FB.doc(window.FB.db, "restaurants", restaurantId), (docSnap) => {
                if(docSnap.exists()) {
                    restaurantData=docSnap.data();
                    const root=document.documentElement;
                    if(restaurantData.primaryColor) root.style.setProperty('--primary',restaurantData.primaryColor);
                    if(restaurantData.secondaryColor) root.style.setProperty('--secondary',restaurantData.secondaryColor);
                    if(restaurantData.accentColor) root.style.setProperty('--accent',restaurantData.accentColor);
                    if(restaurantData.bgColor) root.style.setProperty('--bg-color',restaurantData.bgColor);
                    if(restaurantData.surfaceColor) root.style.setProperty('--surface-color',restaurantData.surfaceColor);
                    if(restaurantData.textColor) root.style.setProperty('--text-color',restaurantData.textColor);
                    document.getElementById('restName').innerText=restaurantData.name||restaurantId;
                    if(restaurantData.logo){const logo=document.getElementById('restLogo');logo.src=restaurantData.logo;logo.style.display='block';}
                    renderCategories(); renderItems();
                    restoreActiveOrderListeners(); loadOrderHistory();
                }
            });
        });

        function renderCategories() {
            let container = document.getElementById('categoriesScroll');
            let cats = restaurantData.categories || [];
            let html = `<div class="cat-chip ${selectedCategory==='all'?'active':''}" onclick="setCategory('all')">الكل</div>`;
            cats.forEach(c => {
                html += `<div class="cat-chip ${selectedCategory===c?'active':''}" onclick="setCategory('${c.replace(/'/g, "\\'")}')">${escapeHtml(c)}</div>`;
            });
            container.innerHTML = html;
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            renderItems();
        }

        function filterItems() {
            renderItems();
        }

        function renderItems() {
            let container = document.getElementById('itemsGrid');
            let search = document.getElementById('searchInput').value.toLowerCase().trim();
            let items = restaurantData.items || [];

            let filtered = items.filter(i => {
                let matchCat = selectedCategory === 'all' || i.category === selectedCategory;
                let matchSearch = !search || i.name.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p class="empty-cart" style="grid-column: 1/-1;">لا توجد أصناف مطابقة</p>';
                return;
            }

            container.innerHTML = filtered.map(item => {
                let finalPrice = item.price - (item.discount || 0);
                return `
                    <div class="item-card">
                        <img src="${escapeHtml(item.img)}" class="item-img" alt="" loading="lazy">
                        <div class="item-details">
                            <div>
                                <div class="item-title">${escapeHtml(item.name)}</div>
                                <div class="item-price">${finalPrice} ج.م ${item.discount ? `<small style="text-decoration:line-through; color:var(--text-muted); font-size:12px;">${item.price}</small>` : ''}</div>
                            </div>
                            <button class="add-btn" onclick="addToCart(${item.id})"><i class="fa-solid fa-plus"></i> إضافة للسلّة</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addToCart(itemId) {
            let item = restaurantData.items.find(i => i.id == itemId);
            if (!item) return;

            let existing = cart.find(c => c.id == itemId);
            if (existing) {
                existing.quantity++;
            } else {
                let price = item.price - (item.discount || 0);
                cart.push({ id: item.id, name: item.name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let count = cart.reduce((acc, item) => acc + item.quantity, 0);
            let total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            document.getElementById('cartCount').innerText = count;
            document.getElementById('cartTotalBar').innerText = `${total} ج.م`;
            document.getElementById('modalTotalAmount').innerText = `${total} ج.م`;

            if (count > 0) {
                document.getElementById('cartBar').classList.remove('hidden');
            } else {
                document.getElementById('cartBar').classList.add('hidden');
                closeCartModal();
            }

            renderCartItems();
        }

        function renderCartItems() {
            let container = document.getElementById('cartItemsList');
            if (cart.length === 0) {
                container.innerHTML = '<p class="empty-cart">السلة فارغة</p>';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div>
                        <div style="font-weight:700;">${escapeHtml(item.name)}</div>
                        <div style="color:var(--secondary); font-size:13px;">${item.price * item.quantity} ج.م</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                        <span style="font-weight:700;">${item.quantity}</span>
                        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(itemId, delta) {
            let item = cart.find(c => c.id == itemId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(c => c.id != itemId);
                }
            }
            updateCartUI();
        }

        function configureOrderMode(){
            const typeEl=document.getElementById('orderTypeSelect');
            const tableDisplay=document.getElementById('tableDisplay');
            const addressGroup=document.getElementById('addressGroup');
            const addressInput=document.getElementById('custAddress');

            if(tableNum){
                // QR from a restaurant table = dine-in. Never ask for an address.
                typeEl.value='dine_in';
                tableDisplay.innerText=`طاولة رقم ${tableNum}`;
                addressGroup.classList.add('hidden');
                addressInput.value='';
            }else{
                // Direct menu link = online/delivery. Address is required for the first order.
                typeEl.value='delivery';
                tableDisplay.innerText='طلب أونلاين';
                addressGroup.classList.remove('hidden');
            }
        }
        function toggleAddressField(){
            const type=tableNum?'dine_in':'delivery';document.getElementById('orderTypeSelect').value=type;
            document.getElementById('addressGroup').classList.toggle('hidden',type!=='delivery');
        }
        function loadCustomerSession(){
            try{customerSession=JSON.parse(localStorage.getItem(customerSessionKey)||'null');}catch(e){customerSession=null;}
            const name=document.getElementById('custName'),phone=document.getElementById('custPhone'),address=document.getElementById('custAddress');
            if(customerSession){
                name.value=customerSession.name||'';phone.value=customerSession.phone||'';address.value=customerSession.address||'';
                document.getElementById('custNameGroup').classList.add('hidden');document.getElementById('custPhoneGroup').classList.add('hidden');
                const box=document.getElementById('savedCustomerBox');box.classList.remove('hidden');
                box.innerHTML=`<i class="fa-solid fa-user-check" style="color:var(--secondary);"></i> بياناتك محفوظة: <strong>${escapeHtml(customerSession.name)}</strong> — ${escapeHtml(customerSession.phone)}.`;
            }else{
                document.getElementById('custNameGroup').classList.remove('hidden');document.getElementById('custPhoneGroup').classList.remove('hidden');document.getElementById('savedCustomerBox').classList.add('hidden');
            }
            if(!tableNum) document.getElementById('addressGroup').classList.toggle('hidden',!!(customerSession&&customerSession.address));
        }
        function saveCustomerSession(name,phone,address){customerSession={name,phone,address:address||''};localStorage.setItem(customerSessionKey,JSON.stringify(customerSession));loadCustomerSession();}
        function customerLogout(){
            Object.values(activeOrderUnsubscribers).forEach(u=>{try{u();}catch(e){}});activeOrderUnsubscribers={};
            localStorage.removeItem(customerSessionKey);localStorage.removeItem(activeOrdersKey);customerSession=null;historyOrders=[];
            document.getElementById('custName').value='';document.getElementById('custPhone').value='';document.getElementById('custAddress').value='';
            loadCustomerSession();hideLiveOrderBanner();renderHistory();alert('تم تسجيل الخروج. يمكنك الآن إدخال بيانات عميل جديد.');
        }
        function openCartModal(){document.getElementById('cartModal').classList.add('active');}
        function closeCartModal(){document.getElementById('cartModal').classList.remove('active');}

        async function submitOrder(){
            const name=document.getElementById('custName').value.trim()||(customerSession&&customerSession.name)||'';
            const phone=document.getElementById('custPhone').value.trim()||(customerSession&&customerSession.phone)||'';
            const orderType=tableNum?'dine_in':'delivery';
            const address=document.getElementById('custAddress').value.trim()||(customerSession&&customerSession.address)||'';
            const notes=document.getElementById('orderNotes').value.trim();
            const total=cart.reduce((acc,item)=>acc+(item.price*item.quantity),0);
            if(!name||!phone)return alert('الرجاء إدخال الاسم ورقم الهاتف');
            if(orderType==='delivery'&&!address)return alert('الرجاء إدخال عنوان التوصيل');
            const btn=document.getElementById('submitOrderBtn');btn.disabled=true;btn.innerText='جاري الإرسال...';
            const orderData={restaurant:restaurantId,table:tableNum||'عام',customerName:name,customerPhone:phone,orderType,address:orderType==='delivery'?address:'',notes:notes||'',items:cart,total,paymentMethod:'cash',status:'pending',createdAt:new Date().toISOString()};
            try{
                const docRef=await window.FB.addDoc(window.FB.collection(window.FB.db,'orders'),orderData);
                saveCustomerSession(name,phone,orderType==='delivery'?address:(customerSession?.address||''));
                const ids=JSON.parse(localStorage.getItem(activeOrdersKey)||'[]');if(!ids.includes(docRef.id))ids.push(docRef.id);localStorage.setItem(activeOrdersKey,JSON.stringify(ids));
                cart=[];updateCartUI();closeCartModal();showStatusModal(docRef.id);listenToOrderStatus(docRef.id);await loadOrderHistory();
            }catch(e){console.error('Order error:',e);alert('حدث خطأ أثناء إرسال الطلب');}
            finally{btn.disabled=false;btn.innerText='إرسال الطلب الآن';}
        }

        function updateLiveOrderBanner(orderId,status){
            const meta=statusMeta[status]||statusMeta.pending,banner=document.getElementById('liveOrderBanner');banner.classList.remove('hidden');
            document.getElementById('liveOrderNumber').innerText=`#${String(orderId).substring(0,8)}`;document.getElementById('liveOrderStatus').innerText=meta.text;
            document.querySelectorAll('.live-order-step').forEach((s,i)=>s.classList.toggle('active',i<meta.level));
            document.getElementById('liveStatusText').innerText=meta.text;
        }
        function hideLiveOrderBanner(){document.getElementById('liveOrderBanner').classList.add('hidden');}
        function listenToOrderStatus(orderId){
            if(!orderId||activeOrderUnsubscribers[orderId])return;
            activeOrderUnsubscribers[orderId]=window.FB.onSnapshot(window.FB.doc(window.FB.db,'orders',orderId),snap=>{
                if(!snap.exists())return;
                const status=snap.data().status||'pending';
                if(status==='delivered'||status==='canceled'){
                    const ids=JSON.parse(localStorage.getItem(activeOrdersKey)||'[]').filter(id=>id!==orderId);localStorage.setItem(activeOrdersKey,JSON.stringify(ids));
                    try{activeOrderUnsubscribers[orderId]();}catch(e){}delete activeOrderUnsubscribers[orderId];hideLiveOrderBanner();
                }else updateLiveOrderBanner(orderId,status);
                loadOrderHistory();
            },err=>console.error('Live status error:',err));
        }
        function restoreActiveOrderListeners(){let ids=[];try{ids=JSON.parse(localStorage.getItem(activeOrdersKey)||'[]');}catch(e){}ids.forEach(listenToOrderStatus);}
        function showStatusModal(orderId){document.getElementById('submittedOrderId').innerText=`#${orderId.substring(0,6)}`;document.getElementById('statusModal').classList.add('active');listenToOrderStatus(orderId);}
        function closeStatusModal(){document.getElementById('statusModal').classList.remove('active');}

        async function loadOrderHistory(){
            if(!window.FB||!customerSession||!customerSession.phone){historyOrders=[];renderHistory();return;}
            try{
                const q=window.FB.query(window.FB.collection(window.FB.db,'orders'),window.FB.where('restaurant','==',restaurantId),window.FB.where('customerPhone','==',customerSession.phone));
                const snap=await window.FB.getDocs(q);historyOrders=[];snap.forEach(d=>historyOrders.push({id:d.id,...d.data()}));
                historyOrders.sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));renderHistory();
            }catch(e){console.error('History error:',e);document.getElementById('historyList').innerHTML='<p class="empty-cart">تعذر تحميل سجل الطلبات حالياً.</p>';}
        }
        function renderHistory(){
            const list=document.getElementById('historyList');
            if(!historyOrders.length){list.innerHTML='<p class="empty-cart">لا يوجد طلبات سابقة لهذا الحساب.</p>';return;}
            const statusText={pending:'قيد الانتظار',preparing:'جاري التجهيز',ready:'جاهز',delivered:'تم التسليم',canceled:'ملغي',on_way:'في الطريق'};
            list.innerHTML=historyOrders.map(o=>`<div class="history-card"><div class="history-head"><strong>#${escapeHtml(o.id.substring(0,8))}</strong><span class="history-status">${escapeHtml(statusText[o.status]||'غير معروف')}</span></div><div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${new Date(o.createdAt||Date.now()).toLocaleString('ar-EG')} — ${o.orderType==='dine_in'?`صالة / طاولة ${escapeHtml(o.table)}`:'أونلاين'}</div><div style="font-size:13px;">${(o.items||[]).map(i=>`${escapeHtml(i.quantity)}× ${escapeHtml(i.name)}`).join('، ')}</div><div style="margin-top:8px;font-weight:900;color:var(--secondary);">${escapeHtml(o.total)} ج.م</div></div>`).join('');
        }
        function openHistoryModal(){document.getElementById('historyModal').classList.add('active');loadOrderHistory();}
        function closeHistoryModal(){document.getElementById('historyModal').classList.remove('active');}
    </script>
</body>
</html>
