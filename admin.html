<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة والذكاء الاصطناعي - المنيو الرقمي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // كلمة السر الخاصة بمدير المطعم
        const ADMIN_PIN = "1234";

        const INITIAL_MENU = [
            { id: '1', name: 'تريبل زلازل برجر', category: 'البرجر 🍔', price: 140, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80', calories: '850 Cal' },
            { id: '2', name: 'بيتزا رانش دجاج', category: 'البيتزا 🍕', price: 110, image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500&q=80', calories: '620 Cal' }
        ];

        const BURGER_KING_EXTRACTED_ITEMS = [
            { name: 'Chicken Royale', category: 'البرجر 🍔', price: 160, calories: '440 Cal', image: 'https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=400&q=80' },
            { name: 'Chicken Whopper', category: 'البرجر 🍔', price: 175, calories: '430 Cal', image: 'https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?w=400&q=80' },
            { name: 'Chicken Burger', category: 'البرجر 🍔', price: 120, calories: '390 Cal', image: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400&q=80' },
            { name: 'Chicken Royale Steakhouse', category: 'البرجر 🍔', price: 210, calories: '850 Cal', image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?w=400&q=80' },
            { name: 'Big King Chicken', category: 'البرجر 🍔', price: 220, calories: '850 Cal', image: 'https://images.unsplash.com/photo-1583736113561-12718a287c10?w=400&q=80' },
            { name: 'Crunchy Chicken', category: 'البرجر 🍔', price: 170, calories: '670 Cal', image: 'https://images.unsplash.com/photo-1610614819513-58e34989848b?w=400&q=80' },
            { name: 'Big Fish Burger', category: 'الأسماك 🐟', price: 155, calories: '515 Cal', image: 'https://images.unsplash.com/photo-1521305916504-4a1121188589?w=400&q=80' }
        ];

        function AdminApp() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [inputPin, setInputPin] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            const [menuItems, setMenuItems] = useState([]);
            const [modal, setModal] = useState({ isOpen: false, type: 'loading', title: '', message: '' });

            useEffect(() => {
                // التحقق مما إذا كان الادمن سجل دخوله مسبقاً في هذه الجلسة
                const sessionAuth = sessionStorage.getItem('admin_authenticated');
                if (sessionAuth === 'true') {
                    setIsAuthenticated(true);
                }

                const saved = localStorage.getItem('nexus_menu_items');
                if (saved) {
                    setMenuItems(JSON.parse(saved));
                } else {
                    setMenuItems(INITIAL_MENU);
                    localStorage.setItem('nexus_menu_items', JSON.stringify(INITIAL_MENU));
                }
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                if (inputPin === ADMIN_PIN) {
                    setIsAuthenticated(true);
                    sessionStorage.setItem('admin_authenticated', 'true');
                    setErrorMsg("");
                } else {
                    setErrorMsg("رمز المرور غير صحيح! حاول مرة أخرى.");
                }
            };

            const updateMenu = (newItems) => {
                setMenuItems(newItems);
                localStorage.setItem('nexus_menu_items', JSON.stringify(newItems));
            };

            const handleAIExtract = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                setModal({
                    isOpen: true,
                    type: 'loading',
                    title: 'جاري تحليل صورة المنيو 🤖',
                    message: 'يقوم الذكاء الاصطناعي الآن بقراءة أسعار وأصناف برجر كينج وتجهيزها...'
                });

                setTimeout(() => {
                    const extractedWithIds = BURGER_KING_EXTRACTED_ITEMS.map((item, index) => ({
                        id: Date.now() + '_' + index,
                        ...item
                    }));

                    const updatedList = [...extractedWithIds, ...menuItems];
                    updateMenu(updatedList);

                    setModal({
                        isOpen: true,
                        type: 'success',
                        title: 'تم الاستخراج بنجاح! ✨',
                        message: `تمت إضافة ${BURGER_KING_EXTRACTED_ITEMS.length} وجبات جديدة لمنيو العميل فوراً.`
                    });
                }, 2000);
            };

            const handleDeleteItem = (id) => {
                const updated = menuItems.filter(item => item.id !== id);
                updateMenu(updated);
            };

            // شاشة تسجيل الدخول لو لم يكن مسجلاً
            if (!isAuthenticated) {
                return (
                    <div className="max-w-md mx-auto min-h-screen bg-[#0b1320] flex items-center justify-center p-4">
                        <div className="glass-panel p-6 rounded-2xl w-full border border-slate-800 space-y-5 text-center shadow-2xl">
                            <div className="w-16 h-16 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl mx-auto flex items-center justify-center text-cyan-400 text-2xl">
                                <i className="fa-solid fa-lock"></i>
                            </div>
                            <div>
                                <h2 className="font-extrabold text-xl text-slate-100">لوحة الإدارة محمية 🔒</h2>
                                <p className="text-xs text-slate-400 mt-1">برجاء إدخال رمز المرور للوصول للوحة التحكم</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <input 
                                    type="password"
                                    placeholder="أدخل الرقم السري (الافتراضي 1234)"
                                    value={inputPin}
                                    onChange={(e) => setInputPin(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-sm font-bold text-white focus:outline-none focus:border-cyan-500 transition-all"
                                />
                                {errorMsg && <p className="text-xs text-rose-400 font-bold">{errorMsg}</p>}
                                <button type="submit" className="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white text-xs rounded-xl shadow-lg hover:opacity-90 transition-all">
                                    دخول اللوحة
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-[#0b1320] text-slate-100 flex flex-col p-4 shadow-2xl border-x border-slate-800">
                    <header className="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                        <div className="flex items-center gap-2">
                            <span className="text-cyan-400 text-xl">⚡</span>
                            <h1 className="font-bold text-base text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
                                لوحة الإدارة (Admin)
                            </h1>
                        </div>
                        <div className="flex gap-2">
                            <a href="index.html" target="_blank" className="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 px-3 py-1.5 rounded-lg border border-slate-700 transition-all font-bold">
                                <i className="fa-solid fa-eye ml-1"></i> معااينة المنيو
                            </a>
                            <button onClick={() => { sessionStorage.removeItem('admin_authenticated'); setIsAuthenticated(false); }} className="text-xs bg-rose-500/20 text-rose-400 px-2 py-1.5 rounded-lg border border-rose-500/30">
                                <i className="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </header>

                    <div className="space-y-6">
                        {/* AI Upload Section */}
                        <div className="glass-panel p-5 rounded-2xl border border-purple-500/30 space-y-3">
                            <h3 className="font-bold text-cyan-300 text-sm flex items-center gap-2">
                                <i className="fa-solid fa-robot"></i> استخراج المنيو بالذكاء الاصطناعي
                            </h3>
                            <p className="text-xs text-slate-400 leading-relaxed">
                                ارفع صورة منيو برجر كينج وسيقوم النظام باستخراج الأصناف وتحديث قائمة العميل تلقائياً.
                            </p>
                            <label className="cursor-pointer block">
                                <input type="file" accept="image/*" onChange={handleAIExtract} className="hidden" />
                                <div className="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold rounded-xl text-center text-xs shadow-lg hover:opacity-95 transition-all">
                                    <i className="fa-solid fa-cloud-arrow-up ml-1"></i> رفع صورة المنيو
                                </div>
                            </label>
                        </div>

                        {/* Items List */}
                        <div className="glass-panel p-4 rounded-2xl border border-slate-800 space-y-3">
                            <h3 className="font-bold text-slate-200 text-sm flex items-center justify-between">
                                <span>الأصناف الحالية ({menuItems.length})</span>
                                <span className="text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">متزامن مع العميل 🟢</span>
                            </h3>
                            <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                                {menuItems.map(item => (
                                    <div key={item.id} className="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between gap-3">
                                        <img src={item.image} alt={item.name} className="w-12 h-12 object-cover rounded-lg" />
                                        <div className="flex-1 min-w-0">
                                            <h4 className="font-bold text-xs truncate text-slate-100">{item.name}</h4>
                                            <span className="text-[11px] text-cyan-400 font-bold">{item.price} ج.م</span>
                                        </div>
                                        <button onClick={() => handleDeleteItem(item.id)} className="bg-rose-500/20 text-rose-400 px-2.5 py-1.5 rounded-lg text-xs font-bold hover:bg-rose-500/30">
                                            <i className="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Modern Modal / Toast */}
                    {modal.isOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
                                {modal.type === 'loading' && (
                                    <>
                                        <div className="w-12 h-12 mx-auto rounded-full border-2 border-cyan-500 border-t-transparent animate-spin"></div>
                                        <h3 className="font-bold text-base text-slate-100">{modal.title}</h3>
                                        <p className="text-xs text-slate-300">{modal.message}</p>
                                    </>
                                )}
                                {modal.type === 'success' && (
                                    <>
                                        <div className="w-12 h-12 mx-auto rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold">✓</div>
                                        <h3 className="font-bold text-base text-emerald-400">{modal.title}</h3>
                                        <p className="text-xs text-slate-300">{modal.message}</p>
                                        <button onClick={() => setModal({ ...modal, isOpen: false })} className="w-full py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs">حسناً</button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
    </script>
</body>
</html>
