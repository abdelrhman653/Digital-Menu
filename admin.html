/* =========================================================

========================================================= */

function showMsg(text,type="normal"){

  const el = $("msg");

  el.className = "msg";

  el.classList.remove("hidden");

  el.textContent = text;

  if(type === "success"){
    el.classList.add("ok");
  }

  if(type === "error"){
    el.classList.add("bad");
  }

}


function hideMsg(){

  $("msg").classList.add("hidden");

}


/* =========================================================
   OWNER CHECK
========================================================= */

function isOwner(user){

  return !!user &&
         user.uid === OWNER_UID;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   RANDOM LICENSE CODE
========================================================= */

function randomCode(){

  const a =
    crypto.randomUUID()
      .replaceAll("-","")
      .slice(0,4)
      .toUpperCase();

  const b =
    crypto.randomUUID()
      .replaceAll("-","")
      .slice(0,4)
      .toUpperCase();

  return `DM-${a}-${b}`;

}


/* =========================================================
   PLAN
========================================================= */

function planName(plan, meta={}){
  if(plan === "custom") return meta.planName || (meta.durationDays ? `${meta.durationDays} يوم` : "مدة مخصصة");
  return {month:"شهر","3months":"3 أشهر","6months":"6 أشهر",year:"سنة",lifetime:"مدى الحياة"}[plan] || "غير محدد";
}


function planMonths(plan){

  return {

    month:1,

    "3months":3,

    "6months":6,

    year:12

  }[plan] || 0;

}


/* =========================================================
   EXPIRY
========================================================= */

function asDate(value){
  if(!value) return null;
  if(value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
  if(typeof value.toDate === 'function'){
    try{ const d=value.toDate(); return Number.isNaN(d.getTime()) ? null : d; }catch(_){ return null; }
  }
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

function calculateExpiry(plan,baseDate=new Date(),customDays=0){
  if(plan === "lifetime") return null;
  const date=asDate(baseDate) || new Date();
  if(plan === "custom") { date.setDate(date.getDate()+Math.max(1,Number(customDays)||1)); return date; }
  const months=planMonths(plan);
  date.setMonth(date.getMonth()+months);
  return date;
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

  if(!value){
    return "مدى الحياة";
  }

  const date = asDate(value);

  if(!date){
    return String(value);
  }

  return date.toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   STATUS
========================================================= */

function statusName(status){

  return {

    active:"نشط",

    paused:"متوقف",

    cancelled:"ملغي",

    canceled:"ملغي",

    expired:"منتهي",

    available:"متاح",

    used:"مستخدم"

  }[status] || status || "غير معروف";

}


function statusClass(status){

  if(status === "active"){
    return "ok";
  }

  if(
    status === "paused" ||
    status === "expired"
  ){
    return "warn";
  }

  return "bad";

}

/* =========================================================
   FIND RESTAURANT
========================================================= */

async function findRestaurant(search){

  search =
    search.trim();


  if(!search){
    return null;
  }


  /*
   * أولًا نجرب الـ Document ID
   */

  const direct =
    await getDoc(
      doc(
        db,
        "restaurants",
        search
      )
    );


  if(direct.exists()){

    return {
      id:direct.id,
      ...direct.data()
    };

  }


  /*
   * بعد ذلك نبحث بالاسم
   */

  const snapshot =
    await getDocs(
      collection(
        db,
        "restaurants"
      )
    );


  const wanted =
    search.toLowerCase();


  let partial = null;


  for(const item of snapshot.docs){

    const data =
      item.data();


    const name =
      String(
        data.name || ""
      ).toLowerCase();


    const id =
      String(
        item.id || ""
      ).toLowerCase();


    if(
      name === wanted ||
      id === wanted
    ){

      return {
        id:item.id,
        ...data
      };

    }


    if(
      !partial &&
      (
        name.includes(wanted) ||
        id.includes(wanted)
      )
    ){

      partial = {
        id:item.id,
        ...data
      };

    }

  }


  return partial;

}


/* =========================================================
   GET LICENSE
========================================================= */

async function getLicense(restaurant){

  if(!restaurant.licenseCode){
    return null;
  }


  try{

    const snapshot =
      await getDoc(
        doc(
          db,
          "licenses",
          restaurant.licenseCode
        )
      );


    if(!snapshot.exists()){
      return null;
    }


    return {
      id:snapshot.id,
      ...snapshot.data()
    };


  }catch(error){

    console.error(
      "LICENSE ERROR:",
      error
    );

    return null;

  }

}


/* =========================================================

async function displayRestaurant(

){

  );

  box.innerHTML = `

        </span>
      </div>

      <div class="info-line">

        ${planName(plan,{durationDays,planName:customPlanName})}
      </div>

      <div class="info-line">
        <b>الانتهاء:</b>
        ${formatDate(expiresAt)}
      </div>

      <div class="info-line">
        <b>كود الاشتراك:</b>
        <span class="code">
          ${escapeHtml(code)}
        </span>
      </div>

      <div class="info-line">
        <b>البريد:</b>
        ${escapeHtml(
          restaurant.ownerEmail || "-"
        )}
      </div>

      <div class="info-line">
        <b>الهاتف:</b>
        ${escapeHtml(
          restaurant.phone || "-"
        )}
      </div>

    </div>

    <div class="actions">

      <button
        id="renewBtn"
        class="green"
      >
        🔄 تجديد
      </button>

      <button
        id="pauseBtn"
        class="orange"
      >
        ⏸️ إيقاف
      </button>

      <button
        id="activateBtn"
        class="green"
      >
        ▶️ تفعيل
      </button>

      <button
        id="cancelBtn"
        class="danger"
      >
        ❌ إلغاء
      </button>

    </div>

  `;


  $("renewBtn").onclick =
    () => renewRestaurant(
      restaurant,
      license,
      plan
    );


  $("pauseBtn").onclick =

      restaurant,

    );

      restaurant,

    );


  $("cancelBtn").onclick =

}

        "error"
      );

      return;

    }


    const code =
      randomCode();


    const expiresAtDate =
      calculateExpiry(plan, new Date(), durationDays);

      expiresAtDate ? Timestamp.fromDate(expiresAtDate) : null;


    const button =
      $("createBtn");


    button.disabled = true;

    button.textContent =
      "جارٍ إنشاء الكود...";


    try{

      await setDoc(
        doc(
          db,
          "licenses",
          code
        ),
        {
          code,
          restaurantId,
          plan,
          durationDays,
          price,
          planName: customPlanName,
          expiresAt,
          status:"available",
          used:false,
          createdAt:
            new Date().toISOString(),
          createdBy:
            auth.currentUser.uid
        }
      );

        .classList
        .remove("hidden");


      $("newCode").innerHTML = `

        الكود:
        <span class="code">
          ${escapeHtml(code)}
        </span>

        <br>

        <span class="muted">
          المطعم:
          ${escapeHtml(restaurantId)}
        </span>

        <br>

        <span class="muted">
          المدة:
          ${planName(plan,{durationDays,planName:customPlanName})}
        </span>

      `;


      showMsg(
        "✅ تم إنشاء كود الاشتراك بنجاح.",
        "success"
      );


      $("restaurantId").value =
        "";


      await loadLicenses();


    }catch(error){

      console.error(error);

      showMsg(
        "❌ تعذر إنشاء الكود: " +
        (error.code || error.message),
        "error"
      );


    }finally{

      button.disabled = false;

      button.textContent =
        "إنشاء الكود";

    }

  }
);


/* =========================================================
   RENEW
========================================================= */

async function renewRestaurant(
  restaurant,
  license,
  currentPlan
){

  if(!isOwner(auth.currentUser)){
    return;
  }


  const selected =
    prompt(
      "اختر مدة التجديد: month / 3months / 6months / year / lifetime / custom\n\nمثال للمدة المخصصة: custom ثم سيطلب منك عدد الأيام.",
      ""
    );


  if(!selected){
    return;
  }


  const allowed = ["month","3months","6months","year","lifetime","custom"];


  if(!allowed.includes(selected)){
    alert("❌ الخطة غير صحيحة.");
    return;
  }

  let customDays=0;
  if(selected === "custom") {
    customDays=Math.max(1,Number(prompt("اكتب عدد أيام التجديد:","30"))||0);
    if(!customDays){ alert("❌ عدد الأيام غير صحيح."); return; }
  }

  const currentExpiry =
    restaurant.licenseExpiresAt ||
    license?.expiresAt ||
    null;


  let baseDate =
    new Date();


  const parsedCurrentExpiry=asDate(currentExpiry);
  if(parsedCurrentExpiry && parsedCurrentExpiry > new Date()){
    baseDate=parsedCurrentExpiry;
  }


  const newExpiry =
    calculateExpiry(
      selected,
      baseDate,
      customDays
    );


  try{

    await updateDoc(
      doc(
        db,
        "restaurants",
        restaurant.id
      ),
      {
        licenseStatus:"active",
        licenseExpiresAt:(newExpiry ? Timestamp.fromDate(newExpiry) : null)
      }
    );


    if(license){

      await updateDoc(
        doc(
          db,
          "licenses",
          license.id
        ),
        {
          plan:selected,
          durationDays: selected === "custom" ? customDays : 0,
          expiresAt:(newExpiry ? Timestamp.fromDate(newExpiry) : null),
          status:"used",
          used:true
        }
      );

    }


    showMsg(
      "✅ تم تجديد الاشتراك بنجاح.",
      "success"
    );


    await displayRestaurant({
      ...restaurant,
      licenseStatus:"active",
      licenseExpiresAt:newExpiry
    });


    await loadLicenses();


  }catch(error){

    console.error(error);

    showMsg(
      "❌ فشل التجديد: " +
      (error.code || error.message),
      "error"
    );

  }

}

/* =========================================================
   LOAD LICENSES
========================================================= */

async function loadLicenses(){

  if(!isOwner(auth.currentUser)){

    $("licenses").innerHTML =
      '<span class="bad">غير مصرح لك.</span>';

    return;

  }


  try{

    const snapshot =
      await getDocs(
        query(
          collection(
            db,
            "licenses"
          ),
          orderBy(
            "createdAt",
            "desc"
          ),
          limit(100)
        )
      );


    if(snapshot.empty){

      $("licenses").innerHTML =
        '<span class="muted">لا توجد أكواد حتى الآن.</span>';

      return;

    }

    // One-time compatibility repair for older licenses that stored expiry
    // as an ISO string. Firestore Rules compare expiry against request.time,
    // so active subscriptions must use a Firestore Timestamp.
    for (const item of snapshot.docs) {
      const data = item.data();
      const rawExpiry = data.expiresAt;
      let expiryDate = null;
      try {
        if (rawExpiry && typeof rawExpiry.toDate === 'function') {
          expiryDate = rawExpiry.toDate();
        } else if (rawExpiry) {
          expiryDate = new Date(rawExpiry);
        }
      } catch (_) {}

      if (expiryDate && !Number.isNaN(expiryDate.getTime())) {
        const normalized = Timestamp.fromDate(expiryDate);
        const needsLicenseRepair = !(rawExpiry && typeof rawExpiry.toDate === 'function');
        if (needsLicenseRepair) {
          await updateDoc(doc(db, 'licenses', item.id), { expiresAt: normalized });
        }
        if (data.used === true && data.status === 'used' && typeof data.restaurantId === 'string' && data.restaurantId) {
          await updateDoc(doc(db, 'restaurants', data.restaurantId), {
            plan: data.plan || 'month',
            licenseExpiresAt: normalized,
            licenseStatus: 'active'
          });
        }
      } else if (data.plan === 'lifetime' && data.used === true && data.status === 'used' && typeof data.restaurantId === 'string' && data.restaurantId) {
        await updateDoc(doc(db, 'restaurants', data.restaurantId), {
          plan: 'lifetime',
          licenseExpiresAt: null,
          licenseStatus: 'active'
        });
      }
    }


    let html = `

      <div style="overflow-x:auto">

        <table>

          <tr>
            <th>الكود</th>
            <th>المطعم</th>
            <th>الخطة</th>
            <th>الحالة</th>
            <th>الانتهاء</th>
          </tr>

    `;


    snapshot.forEach(item => {

      const data =
        item.data();


      let status =
        data.status;


      if(
        data.used &&
        status === "available"
      ){

        status =
          "used";

      }


      html += `

        <tr>

          <td class="code">
            ${escapeHtml(
              data.code ||
              item.id
            )}
          </td>

          <td>
            ${escapeHtml(
              data.restaurantId ||
              "-"
            )}
          </td>

          <td>
            ${planName(data.plan)}
          </td>

          <td class="${statusClass(status)}">
            ${statusName(status)}
          </td>

          <td>
            ${formatDate(
              data.expiresAt
            )}
          </td>

        </tr>

      `;

    });


    html += `

        </table>

      </div>

    `;


    $("licenses").innerHTML =
      html;


  }catch(error){

    console.error(error);

    $("licenses").innerHTML = `

      <span class="bad">
        لا يمكن قراءة الأكواد:
        ${escapeHtml(
          error.code ||
          error.message
        )}
      </span>

    `;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    console.log(
      "Auth state:",
      user ? user.uid : "No user"
    );


    if(!user){

      $("panel")
        .classList
        .add("hidden");

      $("logoutBtn")
        .classList
        .add("hidden");

      $("loginBtn")
        .classList
        .remove("hidden");

      return;

    }


    if(!isOwner(user)){

      $("panel")
        .classList
        .add("hidden");

      $("logoutBtn")
        .classList
        .add("hidden");

      $("loginBtn")
        .classList
        .remove("hidden");


      showMsg(
        "❌ هذا الحساب غير مصرح له بدخول لوحة المالك.",
        "error"
      );


      await signOut(auth);

      return;

    }


    $("panel")
      .classList
      .remove("hidden");


    $("logoutBtn")
      .classList
      .remove("hidden");


    $("loginBtn")
      .classList
      .add("hidden");


    showMsg(
      "✅ تم تسجيل الدخول كمالك المنصة.",
      "success"
    );


    await loadLicenses();

  }
);
