/* =========================================================
   HELPERS

const $ = id =>
  document.getElementById(id);


function showMsg(text,type="normal"){

  const el = $("msg");

  el.classList.remove("hidden");

  el.textContent = text;

  el.className = "msg";

  if(type === "error"){
    el.classList.add("bad");
  }

  if(type === "success"){
    el.classList.add("ok");
  }

}


function hideMsg(){
  $("msg").classList.add("hidden");
}


function isOwner(user){

  return !!user &&
         user.uid === OWNER_UID;

}


function randomCode(){

  return `DM-${crypto
    .randomUUID()
    .replaceAll("-","")
    .slice(0,4)
    .toUpperCase()}-${crypto
    .randomUUID()
    .replaceAll("-","")
    .slice(0,4)
    .toUpperCase()}`;

}


function addMonths(date,months){

  const d = new Date(date);

  d.setMonth(
    d.getMonth() + months
  );

  return d;

}


function planName(plan){

  return {

    month:"شهر",

    "3months":"3 أشهر",

    "6months":"6 أشهر",

    year:"سنة",

    lifetime:"مدى الحياة"

  }[plan] || "غير محدد";

}


function planMonths(plan){

  return {

    month:1,

    "3months":3,

    "6months":6,

    year:12

  }[plan] || 0;

}


function expiryForPlan(plan,baseDate=new Date()){

  if(plan === "lifetime"){
    return null;
  }

  return addMonths(
    baseDate,
    planMonths(plan)
  ).toISOString();

}


function formatDate(value){

  if(!value){
    return "مدى الحياة";
  }

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return value;
  }

  return d.toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function statusName(status){

  return {

    active:"نشط",

    paused:"متوقف",

    cancelled:"ملغي",

    canceled:"ملغي",

    expired:"منتهي",

    available:"متاح",

    used:"مستخدم"

  }[status] || status || "غير معروف";

}


function statusClass(status){

  if(status === "active"){
    return "ok";
  }

  if(
    status === "paused" ||
    status === "expired"
  ){
    return "warn";
  }

  return "bad";

}


/* =========================================================
   GET LICENSE FOR RESTAURANT
========================================================= */

async function getRestaurantLicense(restaurant){

  const licenseCode =
    restaurant.licenseCode;

  if(!licenseCode){
    return null;
  }

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "licenses",
          licenseCode
        )
      );

    if(!snap.exists()){
      return null;
    }

    return {
      id:snap.id,
      ...snap.data()
    };

  }catch(error){

    console.error(
      "License error:",
      error
    );

    return null;

  }

}


/* =========================================================
   FIND RESTAURANT
========================================================= */

async function findRestaurant(search){

  search = search.trim();

  if(!search){
    return null;
  }


  /*
   * أول محاولة:
   * البحث مباشرة بالـ Document ID
   */

  const direct =
    await getDoc(
      doc(
        db,
        "restaurants",
        search
      )
    );

  if(direct.exists()){

    return {
      id:direct.id,
      ...direct.data()
    };

  }


  /*
   * ثاني محاولة:
   * البحث في جميع المطاعم بالاسم
   */

  const snap =
    await getDocs(
      collection(
        db,
        "restaurants"
      )
    );


  const normalized =
    search.toLowerCase();


  let exact = null;
  let partial = null;


  snap.forEach(item => {

    const data = item.data();

    const name =
      String(data.name || "")
        .toLowerCase();

    const id =
      String(item.id || "")
        .toLowerCase();


    if(
      name === normalized ||
      id === normalized
    ){

      exact = {
        id:item.id,
        ...data
      };

    }


    if(
      !partial &&
      (
        name.includes(normalized) ||
        id.includes(normalized)
      )
    ){

      partial = {
        id:item.id,
        ...data
      };

    }

  });


  return exact || partial;

}


/* =========================================================

          ${statusName(status)}
        </span>
      </div>

      <div class="info-line">
        <b>الخطة:</b>
        ${planName(plan)}
      </div>

      <div class="info-line">
        <b>تاريخ الانتهاء:</b>
        ${formatDate(expiresAt)}
      </div>

      <div class="info-line">
        <b>كود الاشتراك:</b>
        <span class="code">
          ${escapeHtml(licenseCode)}
        </span>
      </div>

      <div class="info-line">
        <b>البريد:</b>
        ${escapeHtml(
          restaurant.ownerEmail ||
          "-"
        )}
      </div>

      <div class="info-line">
        <b>الهاتف:</b>
        ${escapeHtml(
          restaurant.phone ||
          "-"
        )}
      </div>

    </div>

    <div class="actions">

      <button
        class="green"
        id="renewBtn"
      >
        🔄 تجديد
      </button>

      <button
        class="orange"
        id="pauseBtn"
      >
        ⏸️ إيقاف
      </button>

      <button
        class="green"
        id="activateBtn"
      >
        ▶️ تفعيل
      </button>

      <button
        class="danger"
        id="cancelBtn"
      >
        ❌ إلغاء
      </button>

    </div>

  `;


  $("renewBtn").onclick =

  $("pauseBtn").onclick =

  $("activateBtn").onclick =

  $("cancelBtn").onclick =

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   RENEW
========================================================= */

async function renewRestaurant(
  restaurant,
  license,
  currentPlan
){

  if(!isOwner(auth.currentUser)){
    return;
  }


  const selected =
    prompt(
      "اكتب مدة التجديد:\n\n" +
      "month = شهر\n" +
      "3months = 3 أشهر\n" +
      "6months = 6 أشهر\n" +
      "year = سنة\n" +
      "lifetime = مدى الحياة\n\n" +
      "مثال: 3months",
      currentPlan || "month"
    );


  if(!selected){
    return;
  }


  const allowed = [
    "month",
    "3months",
    "6months",
    "year",
    "lifetime"
  ];


  if(!allowed.includes(selected)){

    alert(
      "الخطة غير صحيحة."
    );

    return;

  }


  const currentExpiry =
    restaurant.licenseExpiresAt ||
    license?.expiresAt ||
    null;


  let baseDate =
    new Date();


  if(
    currentExpiry &&
    new Date(currentExpiry) > new Date()
  ){

    baseDate =
      new Date(currentExpiry);

  }


  const newExpiry =
    expiryForPlan(
      selected,
      baseDate
    );


  try{

    /*
     * تحديث المطعم
     */

    await updateDoc(
      doc(
        db,
        "restaurants",
        restaurant.id
      ),
      {
        licenseStatus:"active",
        licenseExpiresAt:newExpiry
      }
    );


    /*
     * تحديث الترخيص
     */

    if(license){

      await updateDoc(
        doc(
          db,
          "licenses",
          license.id
        ),
        {
          plan:selected,
          expiresAt:newExpiry,
          status:"used",
          used:true
        }
      );

    }


    showMsg(
      "✅ تم تجديد الاشتراك بنجاح.",
      "success"
    );


    await displayRestaurant({
      ...restaurant,
      licenseStatus:"active",
      licenseExpiresAt:newExpiry
    });


    loadLicenses();

  }catch(error){

    console.error(error);

    showMsg(
      "❌ فشل التجديد: " +
      (error.code || error.message),
      "error"
    );

  }

}

/* =========================================================
   ACTIVATE
========================================================= */

async function activateRestaurant(
  restaurant,
  license
){

  if(!isOwner(auth.currentUser)){
    return;
  }


  const expiresAt =
    restaurant.licenseExpiresAt ||
    license?.expiresAt ||
    null;


  if(
    expiresAt &&
    new Date(expiresAt) <= new Date()
  ){

    alert(
      "الاشتراك منتهي بالفعل. استخدم «تجديد» أولًا."
    );

    return;

  }


  if(
    !confirm(
      "هل تريد تفعيل اشتراك هذا المطعم؟"
    )
  ){
    return;
  }


  try{

    await updateDoc(
      doc(
        db,
        "restaurants",
        restaurant.id
      ),
      {
        licenseStatus:"active"
      }
    );


    if(license){

      await updateDoc(
        doc(
          db,
          "licenses",
          license.id
        ),
        {
          status:"used",
          used:true
        }
      );

    }


    showMsg(
      "▶️ تم تفعيل الاشتراك.",
      "success"
    );


    await displayRestaurant({
      ...restaurant,

    });


    loadLicenses();

  }catch(error){

    console.error(error);

    showMsg(
      "❌ فشل تفعيل الاشتراك: " +
      (error.code || error.message),
      "error"
    );

  }

}


/* =========================================================
   CANCEL
========================================================= */

async function cancelRestaurant(
  restaurant,
  license
){

  if(!isOwner(auth.currentUser)){
    return;
  }


  if(
    !confirm(
      "⚠️ هل أنت متأكد من إلغاء الاشتراك؟\n\n" +
      "سيتم منع المطعم من استخدام النظام."
    )
  ){
    return;
  }


  try{

    await updateDoc(
      doc(
        db,
        "restaurants",
        restaurant.id
      ),
      {
        licenseStatus:"cancelled",
        licenseExpiresAt:new Date().toISOString()
      }
    );


    if(license){

      await updateDoc(
        doc(
          db,
          "licenses",
          license.id
        ),
        {
          status:"cancelled"
        }
      );

    }


    showMsg(
      "❌ تم إلغاء الاشتراك.",
      "success"
    );


    await displayRestaurant({
      ...restaurant,
      licenseStatus:"cancelled",
      licenseExpiresAt:new Date().toISOString()
    });


    loadLicenses();

  }catch(error){

    console.error(error);

    showMsg(
      "❌ فشل إلغاء الاشتراك: " +
      (error.code || error.message),
      "error"
    );

  }

}


/* =========================================================
   CREATE LICENSE
========================================================= */

$("createBtn").onclick = async () => {

  if(!isOwner(auth.currentUser)){

    showMsg(
      "❌ غير مصرح لك.",
      "error"
    );

    return;

  }


  const restaurantId =
    $("restaurantId").value.trim();


  const plan =
    $("plan").value;


  if(!restaurantId){

    showMsg(
      "اكتب معرّف المطعم أولًا.",
      "error"
    );

    return;

  }


  const code =
    randomCode();


  const expiresAt =
    expiryForPlan(plan);


  try{

    await setDoc(
      doc(
        db,
        "licenses",
        code
      ),
      {
        code,
        restaurantId,
        plan,
        expiresAt,
        status:"available",
        used:false,
        createdAt:new Date().toISOString(),
        createdBy:auth.currentUser.uid
      }
    );


    $("newCode").classList.remove(
      "hidden"
    );


    $("newCode").innerHTML = `
      الكود:
      <span class="code">
        ${escapeHtml(code)}
      </span>
      <br>
      <span class="muted">
        المطعم: ${escapeHtml(restaurantId)}
      </span>
      <br>
      <span class="muted">
        المدة: ${planName(plan)}
      </span>
    `;


    showMsg(
      "✅ تم إنشاء الكود بنجاح.",
      "success"
    );


    $("restaurantId").value = "";

    loadLicenses();

  }catch(error){

    console.error(error);

    showMsg(
      "❌ تعذر إنشاء الكود: " +
      (error.code || error.message),
      "error"
    );

  }

};


/* =========================================================
   SEARCH
========================================================= */

$("lookupBtn").onclick = async () => {

  if(!isOwner(auth.currentUser)){

    showMsg(
      "❌ غير مصرح لك.",
      "error"
    );

    return;

  }


  const search =
    $("lookupId").value.trim();


  if(!search){

    showMsg(
      "اكتب اسم المطعم أو المعرّف أولًا.",
      "error"
    );

    return;

  }


  const box =
    $("restaurantInfo");


  box.classList.remove(
    "hidden"
  );


  box.textContent =
    "جارٍ البحث...";


  try{

    const restaurant =
      await findRestaurant(search);


    if(!restaurant){

      box.textContent =
        "المطعم غير موجود.";

      return;

    }


    await displayRestaurant(
      restaurant
    );


  }catch(error){

    console.error(error);

    box.textContent =
      "حدث خطأ أثناء البحث.";

  }

};

/* =========================================================
   LOAD LICENSES
========================================================= */

async function loadLicenses(){

  if(!isOwner(auth.currentUser)){

    $("licenses").innerHTML =
      '<span class="bad">غير مصرح لك.</span>';

    return;

  }


  try{

    const snap =
      await getDocs(
        query(
          collection(db,"licenses"),
          orderBy(
            "createdAt",
            "desc"
          ),
          limit(100)
        )
      );


    if(snap.empty){

      $("licenses").innerHTML =
        '<span class="muted">لا توجد أكواد حتى الآن.</span>';

      return;

    }


    let html = `
      <div style="overflow-x:auto">
      <table>
        <tr>
          <th>الكود</th>
          <th>المطعم</th>
          <th>الخطة</th>
          <th>الحالة</th>
          <th>الانتهاء</th>
        </tr>
    `;


    snap.forEach(item => {

      const data =
        item.data();


      let status =
        data.status;


      if(
        data.used &&
        status === "available"
      ){
        status = "used";
      }


      html += `
        <tr>

          <td class="code">
            ${escapeHtml(
              data.code ||
              item.id
            )}
          </td>

          <td>
            ${escapeHtml(
              data.restaurantId ||
              "-"
            )}
          </td>

          <td>
            ${planName(data.plan)}
          </td>

          <td class="${statusClass(status)}">
            ${statusName(status)}
          </td>

          <td>
            ${formatDate(
              data.expiresAt
            )}
          </td>

        </tr>
      `;

    });


    html += `
      </table>
      </div>
    `;


    $("licenses").innerHTML =
      html;


  }catch(error){

    console.error(error);

    $("licenses").innerHTML =
      `<span class="bad">
        لا يمكن قراءة الأكواد:
        ${escapeHtml(
          error.code ||
          error.message
        )}
      </span>`;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      $("panel")
        .classList
        .add("hidden");

      $("logoutBtn")
        .classList
        .add("hidden");

      $("loginBtn")
        .classList
        .remove("hidden");

      hideMsg();

      return;

    }


    if(!isOwner(user)){

      $("panel")
        .classList
        .add("hidden");

      $("logoutBtn")
        .classList
        .add("hidden");

      $("loginBtn")
        .classList
        .remove("hidden");


      showMsg(
        "❌ هذا الحساب غير مصرح له بدخول لوحة المالك.",
        "error"
      );


      await signOut(auth);

      return;

    }


    $("panel")
      .classList
      .remove("hidden");


    $("logoutBtn")
      .classList
      .remove("hidden");


    $("loginBtn")
      .classList
      .add("hidden");


    showMsg(
      "✅ تم تسجيل الدخول كمالك المنصة.",
      "success"
    );


    loadLicenses();

  }
);


/* =========================================================
   LOGOUT
========================================================= */

$("logoutBtn").onclick =
  async () => {

    await signOut(auth);

  };

</script>
