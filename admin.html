/* =========================================================

const app = initializeApp(firebaseConfig);

const $ = id =>

/* =========================================================
   MESSAGES
========================================================= */

function showMsg(text,type="normal"){

  const el = $("msg");

  el.className = "msg";

  el.classList.remove("hidden");

  el.textContent = text;

  if(type === "success"){
    el.classList.add("ok");
  }

  if(type === "error"){
    el.classList.add("bad");
  }

}


function hideMsg(){

  $("msg").classList.add("hidden");

}


/* =========================================================
   OWNER CHECK
========================================================= */

function isOwner(user){

  return !!user &&
         user.uid === OWNER_UID;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   RANDOM LICENSE CODE
========================================================= */

function randomCode(){

  const a =
    crypto.randomUUID()
      .replaceAll("-","")
      .slice(0,4)
      .toUpperCase();

  const b =
    crypto.randomUUID()
      .replaceAll("-","")
      .slice(0,4)
      .toUpperCase();

  return `DM-${a}-${b}`;

}


/* =========================================================
   CUSTOM PLANS
========================================================= */

let savedPlans = [];

function legacyPlanName(plan){
  return {
    month:"شهر",
    "3months":"3 أشهر",
    "6months":"6 أشهر",
    year:"سنة",
    lifetime:"مدى الحياة"
  }[plan] || "غير محدد";
}

function legacyPlanMonths(plan){
  return {
    month:1,
    "3months":3,
    "6months":6,
    year:12
  }[plan] || 0;
}

function planName(plan){
  if(plan && typeof plan === 'object') return plan.name || 'خطة مخصصة';
  const found=savedPlans.find(p=>p.id===plan);
  if(found) return found.name;
  return legacyPlanName(plan);
}

function planDurationText(plan){
  if(!plan) return 'غير محدد';
  if(typeof plan === 'string'){
    if(plan==='lifetime') return 'مدى الحياة';
    const n=legacyPlanMonths(plan);
    return n ? `${n} شهر` : legacyPlanName(plan);
  }
  const unit=plan.durationUnit;
  const n=Number(plan.durationValue)||0;
  if(unit==='days') return `${n} ${n===1?'يوم':'يوم'}`;
  if(unit==='years') return `${n} ${n===1?'سنة':'سنوات'}`;
  return `${n} ${n===1?'شهر':'أشهر'}`;
}

function planPriceText(plan){
  if(!plan) return '-';
  const original=Number(plan.originalPrice ?? plan.price ?? 0);
  const discount=Number(plan.discount ?? 0);
  const final=Math.max(0, original-discount);
  if(discount>0) return `${final} ج.م <span class="muted" style="text-decoration:line-through">${original} ج.م</span>`;
  return `${final} ج.م`;
}

function calculateExpiry(plan,baseDate=new Date()){
  if(plan === 'lifetime') return null;
  let p=plan;
  if(typeof plan==='string') p=savedPlans.find(x=>x.id===plan);
  if(!p){
    const months=legacyPlanMonths(plan);
    if(!months) return null;
    p={durationValue:months,durationUnit:'months'};
  }
  const value=Math.max(0,Number(p.durationValue)||0);
  if(!value) return null;
  const date=asDate(baseDate) || new Date();
  if(p.durationUnit==='days') date.setDate(date.getDate()+value);
  else if(p.durationUnit==='years') date.setFullYear(date.getFullYear()+value);
  else date.setMonth(date.getMonth()+value);
  return date;
}

const PLANS_DOC_ID = '__admin_custom_plans__';

async function loadPlans(){
  if(!isOwner(auth.currentUser)) return;
  try{
    // Store the plans inside the already-authorized `licenses` collection.
    // This avoids requiring a new Firestore `plans` collection/rule.
    const ref = doc(db,'licenses',PLANS_DOC_ID);
    const snap = await getDoc(ref);
    const data = snap.exists() ? (snap.data() || {}) : {};
    savedPlans = Array.isArray(data.plans) ? data.plans.map(p=>({ ...p })) : [];
    renderPlanSelect();
    renderPlansList();
  }catch(error){
    console.error('loadPlans',error);
    savedPlans=[];
    renderPlanSelect();
    renderPlansList();
    const list=$('plansList');
    if(list) list.innerHTML='<div class="msg bad">❌ تعذر قراءة الخطط: '+escapeHtml(error.code||error.message)+'</div>';
  }
}

function renderPlanSelect(){
  const select=$('plan');
  if(!select) return;
  const current=select.value;
  select.innerHTML='<option value="">اختر خطة محفوظة</option>' + savedPlans.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} — ${escapeHtml(planDurationText(p))} — ${Math.max(0,Number(p.originalPrice||0)-Number(p.discount||0))} ج.م</option>`).join('');
  if(savedPlans.some(p=>p.id===current)) select.value=current;
}

function renderPlansList(){
  const box=$('plansList');
  if(!box) return;
  if(!savedPlans.length){
    box.innerHTML='<div class="msg"><span class="muted">لا توجد خطط محفوظة حتى الآن. أنشئ أول خطة من الأعلى.</span></div>';
    return;
  }
  box.innerHTML=`<div style="overflow-x:auto"><table><tr><th>اسم الخطة</th><th>المدة</th><th>السعر قبل الخصم</th><th>الخصم</th><th>السعر النهائي</th><th>إجراء</th></tr>${savedPlans.map(p=>{
    const original=Number(p.originalPrice||0), discount=Math.max(0,Number(p.discount||0)), final=Math.max(0,original-discount);
    return `<tr><td><b>${escapeHtml(p.name)}</b></td><td>${escapeHtml(planDurationText(p))}</td><td>${original} ج.م</td><td>${discount?discount+' ج.م':'—'}</td><td><b>${final} ج.م</b></td><td><div style="display:flex;gap:8px;min-width:180px"><button class="green" onclick="editPlan('${escapeHtml(p.id)}')">✏️ تعديل</button><button class="danger" onclick="deletePlan('${escapeHtml(p.id)}')">🗑️ حذف</button></div></td></tr>`;
  }).join('')}</table></div>`;
}

function resetPlanForm(){
  $('planId').value=''; $('planNameInput').value=''; $('planDurationValue').value=''; $('planDurationUnit').value='days'; $('planOriginalPrice').value=''; $('planDiscount').value='';
  $('cancelPlanEditBtn').classList.add('hidden');
  $('savePlanBtn').textContent='💾 حفظ الخطة';
  $('planPreview').classList.add('hidden');
}

window.editPlan=function(id){
  const p=savedPlans.find(x=>x.id===id); if(!p) return;
  $('planId').value=p.id; $('planNameInput').value=p.name||''; $('planDurationValue').value=p.durationValue||''; $('planDurationUnit').value=p.durationUnit||'days'; $('planOriginalPrice').value=p.originalPrice??p.price??''; $('planDiscount').value=p.discount||'';
  $('cancelPlanEditBtn').classList.remove('hidden'); $('savePlanBtn').textContent='💾 حفظ التعديل';
  $('plansCard').scrollIntoView({behavior:'smooth',block:'start'});
};

window.deletePlan=async function(id){
  const p=savedPlans.find(x=>x.id===id); if(!p) return;
  if(!confirm(`هل تريد حذف الخطة «${p.name}»؟\nالحذف لن يلغي اشتراكات المطاعم الحالية.`)) return;
  try{
    const next=savedPlans.filter(x=>x.id!==id);
    await setDoc(doc(db,'licenses',PLANS_DOC_ID),{
      code: PLANS_DOC_ID,
      restaurantId: '__system__',
      plan: '__custom_plans__',
      planName: 'خطط الإدارة',
      status: 'available',
      used: false,
      expiresAt: null,
      createdAt: new Date().toISOString(),
      plans: next,
      updatedAt:new Date().toISOString(),
      createdBy:auth.currentUser.uid,
      __systemType:'customPlans'
    },{merge:true});
    savedPlans=next;
    renderPlanSelect(); renderPlansList();
    showMsg('✅ تم حذف الخطة.','success');
  }catch(error){ console.error(error); showMsg('❌ تعذر حذف الخطة: '+(error.code||error.message),'error'); }
};

$('savePlanBtn').addEventListener('click',async()=>{
  if(!isOwner(auth.currentUser)) return showMsg('❌ غير مصرح لك.','error');
  const id=$('planId').value.trim();
  const name=$('planNameInput').value.trim();
  const durationValue=Math.floor(Number($('planDurationValue').value));
  const durationUnit=$('planDurationUnit').value;
  const originalPrice=Number($('planOriginalPrice').value);
  const discount=Math.max(0,Number($('planDiscount').value)||0);
  if(!name||!durationValue||durationValue<1||!['days','months','years'].includes(durationUnit)||!Number.isFinite(originalPrice)||originalPrice<0){
    return showMsg('اكتب اسم الخطة والمدة والسعر بشكل صحيح.','error');
  }
  if(discount>originalPrice) return showMsg('الخصم لا يمكن أن يكون أكبر من السعر الأساسي.','error');
  const finalPrice=Math.max(0,originalPrice-discount);
  const planId=id || ('plan_'+crypto.randomUUID().replaceAll('-','').slice(0,16));
  const payload={id:planId,name,durationValue,durationUnit,originalPrice,discount,finalPrice,updatedAt:new Date().toISOString(),createdBy:auth.currentUser.uid};
  try{
    const next=id ? savedPlans.map(p=>p.id===id ? {...p,...payload} : p) : [...savedPlans,{...payload,createdAt:new Date().toISOString()}];
    await setDoc(doc(db,'licenses',PLANS_DOC_ID),{
      plans:next,
      updatedAt:new Date().toISOString(),
      createdBy:auth.currentUser.uid,
      __systemType:'customPlans'
    },{merge:true});
    savedPlans=next;
    showMsg(id?'✅ تم تعديل الخطة وحفظها.':'✅ تم حفظ الخطة.','success');
    resetPlanForm(); renderPlanSelect(); renderPlansList();
  }catch(error){ console.error(error); showMsg('❌ تعذر حفظ الخطة: '+(error.code||error.message),'error'); }
});

$('cancelPlanEditBtn').addEventListener('click',resetPlanForm);

$('planDiscount').addEventListener('input',()=>{
  const original=Number($('planOriginalPrice').value)||0, discount=Math.max(0,Number($('planDiscount').value)||0), final=Math.max(0,original-discount);
  $('planPreview').classList.remove('hidden'); $('planPreview').innerHTML=`السعر النهائي: <b>${final} ج.م</b>${discount?` — الخصم: <b>${discount} ج.م</b>`:''}`;
});

/* =========================================================
   EXPIRY
========================================================= */

function asDate(value){
  if(!value) return null;
  if(value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
  if(typeof value.toDate === 'function'){
    try{ const d=value.toDate(); return Number.isNaN(d.getTime()) ? null : d; }catch(_){ return null; }
  }
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? null : d;
}

/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(value){

  if(!value){
    return "مدى الحياة";
  }

  const date = asDate(value);

  if(!date){
    return String(value);
  }

  return date.toLocaleString(
    "ar-EG",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   STATUS
========================================================= */

function statusName(status){

  return {

    active:"نشط",

    paused:"متوقف",

    cancelled:"ملغي",

    canceled:"ملغي",

    expired:"منتهي",

    available:"متاح",

    used:"مستخدم"

  }[status] || status || "غير معروف";

}


function statusClass(status){

  if(status === "active"){
    return "ok";
  }

  if(
    status === "paused" ||
    status === "expired"
  ){
    return "warn";
  }

  return "bad";

}


/* =========================================================
   LOGIN
========================================================= */

$("loginBtn").addEventListener(
  "click",
  async function(){

    const email =
      $("email").value.trim();

    const password =
      $("password").value;


    if(!email || !password){

      showMsg(
        "⚠️ اكتب البريد الإلكتروني وكلمة المرور أولًا.",
        "error"
      );

      return;

    }


    const button =
      $("loginBtn");


    button.disabled = true;

    button.textContent =
      "جارٍ تسجيل الدخول...";


    try{

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        result.user;


      console.log(
        "Firebase UID:",
        user.uid
      );


      if(user.uid !== OWNER_UID){

        await signOut(auth);

        showMsg(
          "❌ هذا الحساب غير مصرح له بدخول لوحة المالك.",
          "error"
        );

        return;

      }


      showMsg(
        "✅ تم تسجيل الدخول بنجاح.",
        "success"
      );


    }catch(error){

      console.error(
        "LOGIN ERROR:",
        error
      );


      let message =
        "فشل تسجيل الدخول.";


      if(error.code === "auth/invalid-credential"){

        message =
          "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }
      else if(error.code === "auth/user-not-found"){

        message =
          "❌ الحساب غير موجود في Firebase Authentication.";

      }
      else if(error.code === "auth/wrong-password"){

        message =
          "❌ كلمة المرور غير صحيحة.";

      }
      else if(error.code === "auth/invalid-email"){

        message =
          "❌ البريد الإلكتروني غير صحيح.";

      }
      else if(error.code === "auth/too-many-requests"){

        message =
          "⚠️ محاولات تسجيل دخول كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";

      }
      else if(error.code === "auth/network-request-failed"){

        message =
          "❌ يوجد مشكلة في الاتصال بالإنترنت.";

      }
      else{

        message =
          "❌ " +
          (error.code || error.message);

      }


      showMsg(
        message,
        "error"
      );


    }finally{

      button.disabled = false;

      button.textContent =
        "تسجيل الدخول";

    }

  }
);

/* =========================================================
   FIND RESTAURANT
========================================================= */

async function findRestaurant(search){

  search =
    search.trim();


  if(!search){
    return null;
  }


  /*
   * أولًا نجرب الـ Document ID
   */

  const direct =
    await getDoc(
      doc(
        db,
        "restaurants",
        search
      )
    );


  if(direct.exists()){

    return {
      id:direct.id,
      ...direct.data()
    };

  }


  /*
   * بعد ذلك نبحث بالاسم
   */

  const snapshot =
    await getDocs(
      collection(
        db,
        "restaurants"
      )
    );


  const wanted =
    search.toLowerCase();


  let partial = null;


  for(const item of snapshot.docs){

    const data =
      item.data();


    const name =
      String(
        data.name || ""
      ).toLowerCase();


    const id =
      String(
        item.id || ""
      ).toLowerCase();


    if(
      name === wanted ||
      id === wanted
    ){

      return {
        id:item.id,
        ...data
      };

    }


    if(
      !partial &&
      (
        name.includes(wanted) ||
        id.includes(wanted)
      )
    ){

      partial = {
        id:item.id,
        ...data
      };

    }

  }


  return partial;

}


/* =========================================================
   GET LICENSE
========================================================= */

async function getLicense(restaurant){

  if(!restaurant.licenseCode){
    return null;
  }


  try{

    const snapshot =
      await getDoc(
        doc(
          db,
          "licenses",
          restaurant.licenseCode
        )
      );


    if(!snapshot.exists()){
      return null;
    }


    return {
      id:snapshot.id,
      ...snapshot.data()
    };


  }catch(error){

    console.error(
      "LICENSE ERROR:",
      error
    );

    return null;

  }

}

/* =========================================================
   RENEW
========================================================= */

async function renewRestaurant(restaurant,license,currentPlan){
  if(!isOwner(auth.currentUser)) return;

  await loadPlans();
  if(!savedPlans.length){
    alert('لا توجد خطط محفوظة. أنشئ خطة أولًا من قسم إدارة الخطط.');
    return;
  }

  const options=savedPlans.map((p,i)=>`${i+1}) ${p.name} — ${planDurationText(p)} — ${Math.max(0,Number(p.originalPrice||0)-Number(p.discount||0))} ج.م`).join('\n');
  const answer=prompt('اختر رقم الخطة للتجديد:\n\n'+options+'\n\nاكتب الرقم فقط:','1');
  if(!answer) return;
  const index=Number(answer)-1;
  if(!Number.isInteger(index)||!savedPlans[index]){ alert('❌ اختيار غير صحيح.'); return; }

  const selected=savedPlans[index];
  const currentExpiry=restaurant.licenseExpiresAt || license?.expiresAt || null;
  let baseDate=new Date();
  const parsedCurrentExpiry=asDate(currentExpiry);
  if(parsedCurrentExpiry && parsedCurrentExpiry>new Date()) baseDate=parsedCurrentExpiry;

  const newExpiry=calculateExpiry(selected,baseDate);

  try{
    await updateDoc(doc(db,'restaurants',restaurant.id),{
      licenseStatus:'active',
      plan:selected.id,
      planName:selected.name,
      licenseExpiresAt:(newExpiry?Timestamp.fromDate(newExpiry):null)
    });

    if(license){
      await updateDoc(doc(db,'licenses',license.id),{
        plan:selected.id,
        planName:selected.name,
        durationValue:selected.durationValue,
        durationUnit:selected.durationUnit,
        originalPrice:selected.originalPrice,
        discount:selected.discount||0,
        finalPrice:selected.finalPrice ?? Math.max(0,Number(selected.originalPrice||0)-Number(selected.discount||0)),
        expiresAt:(newExpiry?Timestamp.fromDate(newExpiry):null),
        status:'used',used:true
      });
    }

    showMsg(`✅ تم تجديد الاشتراك بخطة «${selected.name}» وإضافة المدة إلى المتبقي.`, 'success');
    await displayRestaurant({...restaurant,licenseStatus:'active',licenseExpiresAt:newExpiry,plan:selected.id,planName:selected.name});
    await loadLicenses();
  }catch(error){
    console.error(error);
    showMsg('❌ فشل التجديد: '+(error.code||error.message),'error');
  }
}

/* =========================================================
   LOAD LICENSES
========================================================= */

async function loadLicenses(){

  if(!isOwner(auth.currentUser)){

    $("licenses").innerHTML =
      '<span class="bad">غير مصرح لك.</span>';

    return;

  }


  try{

    const rawSnapshot =
      await getDocs(
        query(
          collection(
            db,
            "licenses"
          ),
          orderBy(
            "createdAt",
            "desc"
          ),
          limit(100)
        )
      );

    // Hide the internal custom-plans document from the issued-codes table.
    const licenseDocs = rawSnapshot.docs.filter(d => d.id !== PLANS_DOC_ID);
    const snapshot = { empty: licenseDocs.length === 0, docs: licenseDocs, forEach: fn => licenseDocs.forEach(fn) };


    if(snapshot.empty){

      $("licenses").innerHTML =
        '<span class="muted">لا توجد أكواد حتى الآن.</span>';

      return;

    }

    // One-time compatibility repair for older licenses that stored expiry
    // as an ISO string. Firestore Rules compare expiry against request.time,
    // so active subscriptions must use a Firestore Timestamp.
    for (const item of snapshot.docs) {
      const data = item.data();
      const rawExpiry = data.expiresAt;
      let expiryDate = null;
      try {
        if (rawExpiry && typeof rawExpiry.toDate === 'function') {
          expiryDate = rawExpiry.toDate();
        } else if (rawExpiry) {
          expiryDate = new Date(rawExpiry);
        }
      } catch (_) {}

      if (expiryDate && !Number.isNaN(expiryDate.getTime())) {
        const normalized = Timestamp.fromDate(expiryDate);
        const needsLicenseRepair = !(rawExpiry && typeof rawExpiry.toDate === 'function');
        if (needsLicenseRepair) {
          await updateDoc(doc(db, 'licenses', item.id), { expiresAt: normalized });
        }
        if (data.used === true && data.status === 'used' && typeof data.restaurantId === 'string' && data.restaurantId) {
          await updateDoc(doc(db, 'restaurants', data.restaurantId), {
            plan: data.plan || 'month',
            licenseExpiresAt: normalized,
            licenseStatus: 'active'
          });
        }
      } else if (data.plan === 'lifetime' && data.used === true && data.status === 'used' && typeof data.restaurantId === 'string' && data.restaurantId) {
        await updateDoc(doc(db, 'restaurants', data.restaurantId), {
          plan: 'lifetime',
          licenseExpiresAt: null,
          licenseStatus: 'active'
        });
      }
    }


    let html = `

      <div style="overflow-x:auto">

        <table>

          <tr>
            <th>الكود</th>
            <th>المطعم</th>
            <th>الخطة</th>
            <th>الحالة</th>
            <th>الانتهاء</th>
          </tr>

    `;


    snapshot.forEach(item => {

      const data =
        item.data();


      let status =
        data.status;


      if(
        data.used &&
        status === "available"
      ){

        status =
          "used";

      }


      html += `

        <tr>

          <td class="code">
            ${escapeHtml(
              data.code ||
              item.id
            )}
          </td>

          <td>
            ${escapeHtml(
              data.restaurantId ||
              "-"
            )}
          </td>

          <td>
            ${escapeHtml(data.planName || planName(data.plan))}
          </td>

          <td class="${statusClass(status)}">
            ${statusName(status)}
          </td>

          <td>
            ${formatDate(
              data.expiresAt
            )}
          </td>

        </tr>

      `;

    });


    html += `

        </table>

      </div>

    `;


    $("licenses").innerHTML =
      html;


  }catch(error){

    console.error(error);

    $("licenses").innerHTML = `

      <span class="bad">
        لا يمكن قراءة الأكواد:
        ${escapeHtml(
          error.code ||
          error.message
        )}
      </span>

    `;

  }

}
