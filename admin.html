<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --card-glass: rgba(22, 31, 49, 0.85);
            --accent-neon: #00f2fe;
            --accent-purple: #7928ca;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --green-glow: #00ff87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.2) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.2) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-card {
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--accent-neon);
        }

        .qr-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        button {
            background: linear-gradient(135deg, var(--accent-neon), #0072ff);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .qr-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-card h4 {
            margin-bottom: 10px;
            color: var(--green-glow);
        }

        .qr-code-box {
            background: white;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .table-link {
            font-size: 0.75rem;
            color: var(--text-sub);
            word-break: break-all;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo">لوحة تحكم التاجر ⚙️</div>
    </header>

    <div class="section-card">
        <div class="section-title">منشئ أكواد QR للترابيزات 📱</div>
        <div class="qr-controls">
            <input type="number" id="tablesCount" placeholder="أدخل عدد الترابيزات (مثلاً 5)" value="4">
            <button onclick="generateQRCodes()">توليد الروابط والـ QR</button>
        </div>
        <div class="qr-grid" id="qrGrid"></div>
    </div>

    <script>
        function generateQRCodes() {
            const count = document.getElementById('tablesCount').value || 1;
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = '';

            // الحصول على الرابط الأساسي للموقع تلقائياً
            const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', 'index.html');

            for (let i = 1; i <= count; i++) {
                const tableUrl = `${baseUrl}?table=${i}`;
                
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `
                    <h4>ترابيزة رقم ${i}</h4>
                    <div class="qr-code-box" id="qrcode-${i}"></div>
                    <a href="${tableUrl}" target="_blank" class="table-link">فتح الرابط 🔗</a>
                `;
                grid.appendChild(card);

                // توليد رمز الـ QR
                new QRCode(document.getElementById(`qrcode-${i}`), {
                    text: tableUrl,
                    width: 120,
                    height: 120
                });
            }
        }

        generateQRCodes();
    </script>
</body>
</html>
